<path d="M0,675 L0,450 L0,450 L203,339 L343,366 L486,343 L676,319 L819,385 L962,380 L1200,367 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L156,398 L396,447 L592,407 L834,345 L1037,339 L1200,353 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,597 L0,597 L190,535 L386,499 L558,484 L727,466 L922,421 L1104,473 L1200,542 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
