<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十四回　宋襄公假仁失衆　齊姜氏乘醉遣夫</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說楚成王假飾乘車赴會，跟隨人衆俱是壯丁，內</tspan><tspan x="90" dy="34">穿暗甲，身帶暗器，都是成得臣、鬥勃選練來的，</tspan></text>
