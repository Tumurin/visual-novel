<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回　楚商臣宮中弒父　秦穆公崤谷封屍</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽然晉軍中鼓聲驟起，陣門開處，一員大將，橫戟</tspan><tspan x="90" dy="34">而出，乃狐射姑也。白暾便與交鋒，戰不多合，左</tspan></text>
