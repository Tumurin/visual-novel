<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日五鼓，宮女二隊俱到教場，一個個身披甲冑，</tspan><tspan x="90" dy="34">頭戴兜鍪，右手操劍，左手握盾，二姬頂盔束甲，</tspan></text>
