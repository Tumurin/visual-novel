    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="705" cy="219" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,440 L0,440 L196,351 L388,353 L625,300 L776,353 L1004,392 L1200,380 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L184,480 L420,445 L674,357 L891,414 L1117,370 L1200,433 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,591 L0,591 L225,484 L383,482 L544,455 L752,485 L935,553 L1164,536 L1200,415 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="425" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回　晏蛾兒逾牆殉節　羣公子大鬧朝堂話說齊桓公背了管仲遺言</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">長衛姬曰：“我婦人也，惟卿等好爲之！”於是雍</tspan><tspan x="90" dy="34">巫、豎刁各率宮甲數百，殺入東宮，來擒世子。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>