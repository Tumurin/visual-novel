<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十二回　殺子胥夫差爭歃　納蒯瞶子路結纓</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">聖聞其故，伏地涕泣，其妻從旁笑曰：“子性太鄙</tspan><tspan x="90" dy="34">，希見人主，卒聞宣召，涕淚如雨。"聖仰天長嘆</tspan></text>
