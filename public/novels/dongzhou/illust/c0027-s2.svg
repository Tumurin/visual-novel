<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　驪姬巧計殺申生　獻公臨終囑荀息</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">翟君教開門放入，衆人進見。重耳泣曰：“諸君子</tspan><tspan x="90" dy="34">能協心相輔，如肉傅骨，生死不敢忘德。”魏犨攘</tspan></text>
