<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回　晉獻公違卜立驪姬　楚成王平亂相子文</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鄭文公聞楚師大至，急召百官商議。堵叔曰：“楚</tspan><tspan x="90" dy="34">兵衆盛，未可敵也，不如請成。"師叔曰：”吾新</tspan></text>
<g transform="translate(1070,545)">
