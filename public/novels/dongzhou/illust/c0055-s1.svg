<path d="M0,675 L0,448 L0,448 L208,407 L465,396 L668,309 L868,336 L1052,409 L1200,325 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,481 L0,481 L172,368 L313,466 L541,477 L701,359 L908,388 L1049,381 L1200,474 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,571 L0,571 L220,401 L412,448 L659,380 L828,411 L994,402 L1197,407 L1200,550 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="397" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十五回　華元登牀劫子反　老人結草亢杜回</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">魏顆排開陣勢，等待交鋒。杜回卻不用車馬，手執</tspan><tspan x="90" dy="34">大斧，領著慣戰殺手三百人，大踏步直衝入陣來，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>