<path d="M0,675 L0,445 L0,445 L171,373 L327,401 L578,370 L801,344 L996,308 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,508 L0,508 L210,378 L465,443 L608,351 L800,344 L963,415 L1196,429 L1200,439 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,560 L0,560 L198,382 L349,476 L555,519 L735,480 L963,531 L1118,534 L1200,382 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="412" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百一回　秦王滅周遷九鼎　廉頗敗燕殺二將</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">慄腹探知，喜曰：“吾固知趙卒不堪戰也！”乃率</tspan><tspan x="90" dy="34">衆急攻鄗城，鄗城人知救兵已至，堅守十五日不下</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>