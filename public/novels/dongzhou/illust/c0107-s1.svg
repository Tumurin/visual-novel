    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="722" cy="206" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,458 L0,458 L251,333 L399,311 L602,341 L828,394 L1019,404 L1200,389 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,516 L0,516 L223,412 L456,411 L635,391 L836,471 L997,385 L1200,386 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,567 L0,567 L154,439 L321,431 L523,437 L688,541 L842,503 L1024,534 L1200,386 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="441" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百七回　獻地圖荊軻鬧秦庭　論兵法王翦代李信</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李信恃勇前進，遇項燕，兩下交鋒，戰酣之際，七</tspan><tspan x="90" dy="34">路伏兵俱起，李信不能抵敵，大敗而走，項燕逐之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>