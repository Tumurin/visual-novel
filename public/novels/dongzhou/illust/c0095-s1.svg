    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="849" cy="126" r="59" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,406 L0,406 L189,329 L339,320 L504,374 L763,313 L934,300 L1127,347 L1200,367 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,517 L0,517 L177,447 L321,464 L498,463 L675,420 L917,377 L1084,351 L1200,448 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,607 L0,607 L142,387 L392,383 L538,541 L776,535 L930,420 L1109,428 L1200,412 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="389" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回　說四國樂毅滅齊　驅火牛田單破燕</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">田單椎牛具酒，候至日落黃昏，召五千壯卒飽食，</tspan><tspan x="90" dy="34">以五色塗面，各執利器，跟隨牛後，使百姓鑿城爲</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>