<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回　說四國樂毅滅齊　驅火牛田單破燕</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時楚兵雖衆，皆分屯於城外。淖齒居齊王之宮，方</tspan><tspan x="90" dy="34">酣飲，使婦人奏樂爲歡，兵士數百人，列於宮外。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
