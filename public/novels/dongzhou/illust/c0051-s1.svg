<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回　責趙盾董狐直筆　誅鬥椒絕纓大會</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蘇從去後，越椒命軍士擊鼓前進，莊王問諸將："</tspan><tspan x="90" dy="34">何人可退越椒？"大將樂伯應聲而出，越椒之子鬥</tspan></text>
