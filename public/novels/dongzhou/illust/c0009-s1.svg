<path d="M0,675 L0,445 L0,445 L240,384 L435,342 L593,331 L829,382 L1077,392 L1200,317 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,483 L0,483 L201,386 L444,361 L587,408 L739,422 L917,348 L1103,405 L1200,440 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,557 L0,557 L214,424 L373,429 L615,414 L771,395 L967,476 L1134,500 L1200,472 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
