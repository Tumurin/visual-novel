<path d="M0,675 L0,426 L0,426 L246,407 L405,380 L592,315 L828,333 L1086,314 L1200,373 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,521 L0,521 L182,346 L429,405 L612,417 L816,373 L1040,388 L1197,377 L1200,449 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,584 L0,584 L180,433 L335,390 L583,499 L766,434 L1006,560 L1200,524 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
