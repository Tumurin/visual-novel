<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="940" cy="201" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,413 L0,413 L231,340 L403,319 L560,346 L737,339 L958,320 L1127,330 L1200,319 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L168,480 L309,401 L541,348 L698,362 L931,433 L1145,464 L1200,341 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,573 L0,573 L175,531 L418,520 L580,510 L785,423 L936,385 L1192,516 L1200,518 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="386" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回　晉襄公墨縗敗秦　先元帥免冑殉翟</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孟明此時，如萬箭攢心，沒擺佈一頭處，軍士每分</tspan><tspan x="90" dy="34">頭亂竄，爬山越溪，都被晉兵斬獲，孟明大怒，同</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>