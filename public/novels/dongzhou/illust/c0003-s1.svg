<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　犬戎主大鬧鎬京　周平王東遷洛邑</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">申侯在陣上望見石父出城，指謂戎主曰：“此欺君</tspan><tspan x="90" dy="34">誤國之賊，不可走了。"戎主聞之曰：”誰爲我擒</tspan></text>
