<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回　智荀息假途滅虢　窮百里飼牛拜相</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說虢公在桑田，聞晉師破關，急急班師，被犬戎</tspan><tspan x="90" dy="34">兵掩殺一陣，大敗而走，隨身僅數十乘。奔至上陽</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
