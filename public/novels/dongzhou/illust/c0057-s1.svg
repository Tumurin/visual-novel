<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回　娶夏姬巫臣逃晉　圍下宮程嬰匿孤</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">共王見表大怒，召公子嬰齊、公子側使觀之。公子</tspan><tspan x="90" dy="34">側對曰：“楚、晉世仇，今巫臣適晉，是反叛也，</tspan></text>
