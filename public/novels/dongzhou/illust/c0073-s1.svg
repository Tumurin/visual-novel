<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回　伍員吹簫乞吳市　專諸進炙刺王僚</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時秋七月晦日，兵家忌晦，故鬍子髡、沈子逞及陳</tspan><tspan x="90" dy="34">夏齧，俱不做整備，及聞吳兵到，開營擊之，罪人</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
