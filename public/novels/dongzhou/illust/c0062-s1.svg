<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">齊莊公入城，工僂同殖綽綁縛夙沙衛解到。莊公大</tspan><tspan x="90" dy="34">罵：“奄狗！寡人何負於汝，汝卻輔少奪長！今公</tspan></text>
