<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回　公子友兩定魯君　齊皇子獨對委蛇</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行至酈地，莒公子嬴拿列陣以待。季友曰：“魯新</tspan><tspan x="90" dy="34">立君，國事未定，若戰而不勝，人心動搖矣，莒拿</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
