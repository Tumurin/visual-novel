    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="733" cy="182" r="57" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,451 L0,451 L248,408 L421,375 L621,393 L817,338 L1051,318 L1200,400 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,493 L0,493 L223,398 L440,379 L583,437 L790,330 L961,478 L1179,446 L1200,413 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,582 L0,582 L167,439 L385,555 L612,405 L764,396 L935,466 L1151,541 L1200,408 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="380" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回　周襄王河陽受覲　衛元咺公館對獄</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衛侯大怒曰：“汝謗毀吾弟，擅殺無辜，今又歸罪</tspan><tspan x="90" dy="34">於寡人。”命左右將歂犬斬首號令，吩咐以君禮厚</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>