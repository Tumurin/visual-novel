<path d="M0,675 L0,404 L0,404 L227,369 L374,370 L515,367 L725,302 L872,377 L1080,363 L1200,345 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,477 L0,477 L242,402 L494,452 L683,368 L934,340 L1177,358 L1200,338 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,565 L0,565 L253,405 L446,417 L624,391 L800,385 L986,478 L1130,425 L1200,453 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="455" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百五回　茅焦解衣諫秦王　李牧堅壁卻桓齮</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">營中不意趙兵猝到，遂大潰敗。殺死有名牙將十餘</tspan><tspan x="90" dy="34">員，士卒無算。敗兵奔往甘泉市，報知桓齒奇。桓</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>