<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四回　甘羅童年取高位　嫪毐僞腐亂秦宮</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張唐曰：“某有何事可吊？"甘羅曰：”君之功，</tspan><tspan x="90" dy="34">自謂比武安君何如？"唐曰：“武安君南挫強楚，</tspan></text>
