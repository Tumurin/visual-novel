<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回　娶夏姬巫臣逃晉　圍下宮程嬰匿孤</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">夜半，抱其子付於杵臼之手，即往見韓厥，先以“</tspan><tspan x="90" dy="34">武”字示之，然後言及杵臼之謀。韓厥曰：“姬氏</tspan></text>
