<path d="M0,675 L0,446 L0,446 L146,392 L376,342 L615,324 L766,398 L921,404 L1121,379 L1200,315 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,477 L0,477 L203,360 L396,468 L632,406 L858,342 L1100,418 L1200,473 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,561 L0,561 L197,422 L433,423 L594,523 L775,411 L984,508 L1172,394 L1200,405 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
