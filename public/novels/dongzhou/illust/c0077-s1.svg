<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩軍相遇于軍祥，排成陣勢。伯嚭望見楚軍行列不</tspan><tspan x="90" dy="34">整，便教鳴鼓，馳車突入，正遇子西。大罵：“汝</tspan></text>
