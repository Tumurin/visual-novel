<path d="M0,675 L0,408 L0,408 L199,314 L435,391 L672,390 L897,400 L1090,338 L1200,334 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,519 L0,519 L218,402 L401,405 L632,451 L844,440 L1094,440 L1200,379 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,596 L0,596 L196,401 L418,386 L584,498 L771,391 L1007,414 L1157,468 L1200,498 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="387" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回　誅羋勝葉公定楚　滅夫差越王稱霸</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">及吳王夫差會黃池時，楚國畏吳之強，戒飭邊人，</tspan><tspan x="90" dy="34">使修儆備，白公勝託言吳兵將謀襲楚，乃反以兵襲</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>