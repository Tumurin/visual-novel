<path d="M0,675 L0,421 L0,421 L198,357 L457,357 L688,372 L944,354 L1181,343 L1200,368 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,526 L0,526 L246,333 L475,375 L645,414 L851,429 L1022,372 L1200,433 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,557 L0,557 L230,502 L430,546 L670,489 L849,474 L1081,382 L1200,440 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
