    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="776" cy="208" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,404 L0,404 L228,327 L374,373 L623,318 L778,394 L922,322 L1158,316 L1200,364 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,497 L0,497 L150,402 L367,441 L583,480 L794,451 L1027,406 L1200,406 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,574 L0,574 L143,488 L401,497 L555,468 L803,485 L1059,465 L1200,410 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
