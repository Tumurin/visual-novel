<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十六回　吳起殺妻求將　騶忌鼓琴取相</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">田和得張醜回報，以起兵既弱，又無戰志，全不掛</tspan><tspan x="90" dy="34">意，忽然轅門外鼓聲大振，魯兵突然殺至，田和大</tspan></text>
