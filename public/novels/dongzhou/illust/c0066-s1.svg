<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="東周列國志">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="732" cy="200" r="69" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,411 L0,411 L195,349 L420,391 L619,359 L768,383 L931,341 L1122,379 L1200,369 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,522 L0,522 L162,407 L317,444 L502,375 L760,413 L1020,447 L1200,350 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,595 L0,595 L164,501 L370,422 L607,380 L823,532 L1046,398 L1192,439 L1200,493 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="434" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回　殺寧喜子鱄出奔　戮崔杼慶封獨相</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">殖綽也疑心林中有伏，便教停車，只見土山之上，</tspan><tspan x="90" dy="34">又屯著一簇步卒，約有二百人數，簇擁著一員將，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>