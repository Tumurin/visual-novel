<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回　周襄王河陽受覲　衛元咺公館對獄</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衛成公疑歂犬之言，遣人密地打探，見元咺奉叔武</tspan><tspan x="90" dy="34">入盟，名列載書，不暇致詳，即時回報衛侯，衛侯</tspan></text>
