<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十回　先軫詭謀激子玉　晉楚城濮大交兵</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">先軫分撥兵將，使狐毛、狐偃引上軍，同秦國副將</tspan><tspan x="90" dy="34">白乙丙攻楚左師，與鬥宜申交戰；使欒枝、胥臣引</tspan></text>
