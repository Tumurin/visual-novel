<path d="M0,675 L0,403 L0,403 L255,337 L434,303 L619,316 L772,378 L922,323 L1145,320 L1200,323 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,521 L0,521 L193,406 L441,391 L663,438 L808,375 L1061,339 L1200,474 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,580 L0,580 L220,533 L369,433 L517,530 L755,388 L931,538 L1085,455 L1200,445 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
