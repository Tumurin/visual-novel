<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回　馮諼彈鋏客孟嘗　齊王糾兵伐桀宋</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">是時，魏昭王與韓釐王奉周王之命，“合縱”伐秦</tspan><tspan x="90" dy="34">，秦使白起將兵迎之，大戰於伊闕，斬首二十四萬</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
