<path d="M0,675 L0,407 L0,407 L140,315 L318,327 L541,339 L683,326 L935,387 L1160,369 L1200,371 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,499 L0,499 L243,444 L409,362 L607,400 L843,467 L1039,333 L1200,466 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,555 L0,555 L189,438 L385,402 L547,413 L711,495 L956,419 L1194,461 L1200,462 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
