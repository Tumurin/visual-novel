    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="970" cy="190" r="56" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,437 L0,437 L190,394 L356,378 L584,369 L842,392 L1019,371 L1200,381 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,530 L0,530 L152,447 L383,330 L555,376 L706,420 L877,335 L1090,474 L1200,360 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,581 L0,581 L253,415 L432,419 L628,468 L837,429 L1052,410 L1200,481 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="422" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十七回　介子推守志焚綿上　太叔帶怙寵入宮中</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說宮婢中有個小東，頗有幾分顏色，善於音律。</tspan><tspan x="90" dy="34">太叔一夕歡宴之際，使小東吹玉簫，太叔歌而和之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>