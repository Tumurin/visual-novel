  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="720" cy="229" r="57" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,421 L0,421 L216,380 L376,366 L528,311 L755,344 L902,381 L1086,304 L1200,399 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,524 L0,524 L203,429 L370,367 L583,386 L735,349 L991,401 L1200,398 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,567 L0,567 L178,426 L409,392 L584,536 L836,389 L1089,548 L1200,408 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="385" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回　囊瓦懼謗誅無極　要離貪名刺慶忌</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">伍員曰：“其人姓要名離，吳人也，臣昔曾見其折</tspan><tspan x="90" dy="34">辱壯士椒邱訢，是以知其勇。"闔閭曰：”折辱之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>