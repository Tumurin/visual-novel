<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十四回　宋襄公假仁失衆　齊姜氏乘醉遣夫</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鬥勃提刀來趕，宋將華秀老又到，牽住鬥勃，兩對</tspan><tspan x="90" dy="34">兒在陣前廝殺，公孫固在楚陣中，左衝右突，良久</tspan></text>
