    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1017" cy="176" r="60" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,443 L0,443 L183,376 L415,360 L634,373 L857,384 L1059,387 L1200,313 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,527 L0,527 L246,444 L470,331 L693,393 L903,370 L1101,346 L1200,463 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,568 L0,568 L162,467 L400,529 L618,385 L770,426 L1004,431 L1200,481 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="417" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　蕭夫人登臺笑客　逢醜父易服免君</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，齊頃公親自披甲出陣，邴夏御車，逢醜父爲</tspan><tspan x="90" dy="34">車右，兩家各結陣於鞍，國佐率右軍以遏魯，高固</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>