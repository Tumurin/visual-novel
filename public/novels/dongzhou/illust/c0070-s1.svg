<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十回　殺三兄楚平王即位　劫齊魯晉昭公尋盟</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">靈王尚醉臥於乾溪之臺，鄭丹慌忙入報。靈王聞二</tspan><tspan x="90" dy="34">子被殺，自牀上投身於地，放聲大哭。鄭丹曰：“</tspan></text>
