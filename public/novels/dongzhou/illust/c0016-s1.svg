<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　釋檻囚鮑叔薦仲　戰長勺曹劌敗齊</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">莊公聞鼓聲震地，亦教鳴鼓對敵，曹劌止之曰：“</tspan><tspan x="90" dy="34">齊師方銳，宜靜以待之。"傳令軍中："有敢喧譁</tspan></text>
