  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="844" cy="185" r="65" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,444 L0,444 L166,371 L340,382 L562,340 L755,394 L918,319 L1090,334 L1200,347 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,526 L0,526 L180,407 L338,458 L544,353 L762,463 L925,413 L1163,456 L1200,332 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L190,528 L346,494 L513,496 L697,486 L939,529 L1102,408 L1200,389 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="468" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　蕭夫人登臺笑客　逢醜父易服免君</text>
<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">齊人也慮衛軍來襲，已有整備。良夫殺入營門，劫</tspan><tspan x="90" dy="34">了空營。方欲回車，左有國佐，右有高固兩員大將</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>