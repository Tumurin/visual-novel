  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1025" cy="143" r="65" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,430 L0,430 L223,330 L408,303 L659,397 L875,359 L1113,399 L1200,394 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,503 L0,503 L191,441 L446,475 L671,352 L891,342 L1144,346 L1200,470 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,569 L0,569 L217,499 L444,536 L614,526 L814,516 L1026,515 L1200,559 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="380" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回　歸女樂黎彌阻孔子　棲會稽文種通宰嚭</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">越軍中忽然鳴鼓，鼓聲大振，疇無餘、胥犴帥死士</tspan><tspan x="90" dy="34">二隊，各擁大楯，持短兵，呼哨而至，吳兵心忙，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>