<path d="M0,675 L0,433 L0,433 L142,369 L361,370 L517,398 L685,370 L842,312 L1003,346 L1200,310 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L165,415 L403,344 L647,399 L901,349 L1108,477 L1200,374 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,561 L0,561 L227,446 L473,501 L626,385 L858,403 L1042,475 L1200,430 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="453" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回　楚靈王挾詐滅陳蔡　晏平仲巧辯服荊蠻</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">司徒招事急，使人請公子過議事，過來坐定，問曰</tspan><tspan x="90" dy="34">：“司徒雲‘有計退楚’，計將安出？"招曰：”</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>