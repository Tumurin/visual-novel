<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百八回　兼六國混一輿圖　號始皇建立郡縣</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王賁兵不血刃，兩月之間盡得山東之地，秦王聞捷</tspan><tspan x="90" dy="34">，傳令曰：“齊王建用後勝計，絕秦使，欲爲亂，</tspan></text>
