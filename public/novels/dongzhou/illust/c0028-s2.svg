<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回　裏克兩弒孤主　穆公一平晉亂</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鄭父隨公孫枝至於秦國，見了穆公，呈上國書。穆</tspan><tspan x="90" dy="34">公覽畢，拍案大怒曰：“寡人固知夷吾不堪爲君，</tspan></text>
