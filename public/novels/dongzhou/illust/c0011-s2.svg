<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一回　宋莊公貪賂構兵　鄭祭足殺婿逐主</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說魯侯先至，與齊侯相遇于軍前。魯侯曰：“紀</tspan><tspan x="90" dy="34">乃敝邑世姻，聞得罪於上國，寡人躬來請赦。”齊</tspan></text>
