<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十一回　管夷吾智辨俞兒　齊桓公兵定孤竹</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說黃花元帥兵未到溪口，便遇了高黑前隊，兩下</tspan><tspan x="90" dy="34">接住廝殺。高黑戰黃花不過，卻待要走，王子成父</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
