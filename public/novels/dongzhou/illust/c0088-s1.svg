<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回　孫臏佯狂脫禍　龐涓兵敗桂陵</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，同入朝中，謁見惠王，惠王降階迎接，其禮</tspan><tspan x="90" dy="34">甚恭，臏再拜奏曰：“臣乃村野匹夫，過蒙大王聘</tspan></text>
