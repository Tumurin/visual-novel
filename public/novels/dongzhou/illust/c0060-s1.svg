<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回　智武子分軍肆敵　偪陽城三將鬥力</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兵至虎牢，鄭人請盟，荀罃許之，比及晉師反旆。</tspan><tspan x="90" dy="34">楚共王親自伐鄭，復取成而歸。悼公大怒，問於諸</tspan></text>
