<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回　殺寧喜子鱄出奔　戮崔杼慶封獨相</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">寧喜問無地曰：“子之此來，何人主使？"無地瞋</tspan><tspan x="90" dy="34">目大罵曰：”汝恃功專恣，爲臣不忠，吾兄弟特爲</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
