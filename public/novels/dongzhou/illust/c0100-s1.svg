<path d="M0,675 L0,431 L0,431 L194,359 L375,372 L630,370 L854,317 L1046,384 L1200,303 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L226,464 L446,352 L611,463 L770,350 L916,463 L1066,405 L1200,381 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,582 L0,582 L210,521 L460,556 L658,386 L887,406 L1029,476 L1183,538 L1200,406 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="398" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百回　魯仲連不肯帝秦　信陵君竊符救趙</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王齕不意魏兵卒至，倉卒拒戰，魏兵賈勇而前，平</tspan><tspan x="90" dy="34">原君亦開城接應，大戰一場，王齕折兵一半，奔汾</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>