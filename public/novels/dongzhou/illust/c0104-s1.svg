<path d="M0,675 L0,450 L0,450 L205,369 L428,348 L596,302 L771,321 L1011,403 L1200,406 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,508 L0,508 L170,379 L342,385 L519,438 L702,416 L848,446 L1042,452 L1200,426 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,587 L0,587 L238,495 L392,481 L629,436 L886,444 L1124,545 L1200,407 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
