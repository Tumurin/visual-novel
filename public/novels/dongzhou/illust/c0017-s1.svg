    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="974" cy="181" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,446 L0,446 L188,371 L343,323 L534,344 L741,408 L934,399 L1098,328 L1200,410 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L239,425 L399,373 L588,346 L741,367 L952,340 L1158,370 L1200,461 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,596 L0,596 L173,387 L389,421 L558,499 L761,471 L1013,466 L1200,526 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="409" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七回　宋國納賂誅長萬　楚王杯酒虜息嬀</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到乘邱地方，南宮長萬謂猛獲曰：“今日必須死戰</tspan><tspan x="90" dy="34">，不然不免！"猛獲應聲而出，剛遇公子偃，兩下</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>