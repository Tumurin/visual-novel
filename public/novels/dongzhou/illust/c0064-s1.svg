<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十四回　曲沃城欒盈滅族　且於門杞梁死戰</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">督戎氣忿忿的，獨自挺戟而立，叫道：“有本事的</tspan><tspan x="90" dy="34">，多著幾個出來，一總廝殺，省得費了工夫！"關</tspan></text>
