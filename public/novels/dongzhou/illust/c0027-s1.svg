<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　驪姬巧計殺申生　獻公臨終囑荀息</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">獻公大怒曰：“二子不獲其一，何以用兵？”叱左</tspan><tspan x="90" dy="34">右欲縛賈華斬之。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
