<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="東周列國志">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1015" cy="230" r="51" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,443 L0,443 L180,321 L330,409 L519,407 L685,379 L923,343 L1098,323 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,522 L0,522 L156,368 L356,347 L588,392 L820,393 L1026,333 L1197,460 L1200,384 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,600 L0,600 L191,385 L373,537 L589,423 L849,457 L1006,467 L1186,395 L1200,432 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="422" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回　孫臏佯狂脫禍　龐涓兵敗桂陵</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">離桂陵二十里，便遇齊兵，原來孫臏早已打聽魏兵</tspan><tspan x="90" dy="34">到來，預作準備，先使牙將袁達引三千人截路搦戰</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>