<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回　東門遂援立子倭　趙宣子桃園強諫</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">趙盾登車入朝，隨班行禮，靈公見趙盾不死，問屠</tspan><tspan x="90" dy="34">岸賈以鉏麑之事。岸賈答曰：“鉏麑去而不返，有</tspan></text>
