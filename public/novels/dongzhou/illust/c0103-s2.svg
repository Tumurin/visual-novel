<path d="M0,675 L0,409 L0,409 L206,350 L433,401 L598,376 L841,394 L1071,314 L1200,352 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L172,418 L382,451 L524,448 L784,421 L978,417 L1162,479 L1200,445 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,552 L0,552 L148,485 L389,462 L534,432 L712,463 L922,435 L1157,484 L1200,434 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="393" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三回　李國舅爭權除黃歇　樊於期傳檄討秦王</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">樊於期大怒，瞋目大呼，揮長刀直入秦軍，秦軍見</tspan><tspan x="90" dy="34">其雄猛，莫不披靡，樊於期左衝右突，如入無人之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>