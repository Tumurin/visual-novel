    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="853" cy="157" r="65" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,453 L0,453 L149,352 L348,325 L534,391 L770,329 L957,360 L1196,362 L1200,319 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,503 L0,503 L239,415 L464,397 L675,342 L845,454 L1051,422 L1200,411 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,561 L0,561 L259,536 L504,517 L731,552 L928,461 L1122,519 L1200,513 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="398" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十四回　荀林父縱屬亡師　孟侏儒託優悟主</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說上軍元帥士會，聞趙、魏二將討差往楚，慌忙</tspan><tspan x="90" dy="34">來見荀林父，欲止其行，比到中軍，二將已去矣。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>