<path d="M0,675 L0,449 L0,449 L163,327 L359,305 L549,344 L737,342 L974,348 L1200,373 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L141,410 L302,436 L530,469 L772,341 L946,348 L1086,343 L1200,412 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,584 L0,584 L204,537 L381,394 L543,549 L801,446 L959,545 L1167,539 L1200,476 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="428" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">東周列國志</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回　伍員吹簫乞吳市　專諸進炙刺王僚</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說掩餘、燭庸困在潛城，日久救兵不至，正在躊</tspan><tspan x="90" dy="34">躇脫身之計，忽聞姬光弒主奪位，二人放聲大哭，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>