<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○○回：漢兵劫寨破曹真，武侯鬥陣辱仲達</text>
<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孔明坐於帳中，左右將張虎、戴凌、樂琳拼九十個</tspan><tspan x="90" dy="34">軍，皆縛在帳下。孔明笑曰：「吾縱然捉得汝等，</tspan></text>
<g transform="translate(1070,545)">
