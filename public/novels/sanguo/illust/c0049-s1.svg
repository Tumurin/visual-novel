<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十九回：七星壇諸葛祭風，三江口周瑜縱火</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">周瑜正在帳中坐議，探子來報：「吳侯船隻離寨八</tspan><tspan x="90" dy="34">十五里停泊，只等都督好音。」瑜即差魯肅遍告各</tspan></text>
