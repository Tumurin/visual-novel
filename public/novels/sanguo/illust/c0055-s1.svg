<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十五回：玄德智激孫夫人，孔明二氣周公瑾</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">權大怒，掣所佩之劍，喚蔣欽、周泰聽令，曰：「</tspan><tspan x="90" dy="34">汝二人將這口劍去取吾妹并劉備頭來！違令者立斬</tspan></text>
