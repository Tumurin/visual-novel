<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回：李傕郭汜大交兵，楊奉董承雙救駕</text>
<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">楊彪與朱雋會合朝廷官僚六十餘人，先詣郭汜營中</tspan><tspan x="90" dy="34">勸和。郭汜竟將眾官盡行監下。眾官曰：「我等為</tspan></text>
