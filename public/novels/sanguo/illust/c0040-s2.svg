<path d="M0,675 L0,413 L0,413 L257,362 L509,382 L732,391 L979,360 L1200,378 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,509 L0,509 L142,395 L383,381 L619,347 L853,381 L996,344 L1161,346 L1200,396 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,570 L0,570 L207,436 L403,528 L547,431 L717,550 L879,542 L1063,397 L1200,548 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
