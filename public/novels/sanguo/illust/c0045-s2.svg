<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回：三江口曹操折兵，群英會蔣幹中計</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">幹下船，飛棹回見曹操。操問：「子翼幹事若何？</tspan><tspan x="90" dy="34">」幹曰：「周瑜雅量高致，非言詞所能動也。」操</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
