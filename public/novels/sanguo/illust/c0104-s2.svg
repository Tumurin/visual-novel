<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○四回：隕大星漢丞相歸天，見木像魏都督喪膽</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說夏侯霸引兵至五丈原看時,不見一人,急回報</tspan><tspan x="90" dy="34">司馬懿曰：「蜀兵已盡退矣。」懿跌足曰：「孔明</tspan></text>
