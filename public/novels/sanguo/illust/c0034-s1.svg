<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十四回：蔡夫人隔屏聽密語，劉皇叔躍馬過檀溪</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">劉表見詩大怒，拔劍言曰：「誓殺此無義之徒！」</tspan><tspan x="90" dy="34">行數步，猛省曰：「吾與玄德相處許多時，不曾見</tspan></text>
