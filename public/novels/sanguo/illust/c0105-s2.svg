<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○五回：武侯預伏錦囊計，魏主拆取承露盤</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">楊儀自以為年宦先於蔣琬，而位出琬下;且自恃功</tspan><tspan x="90" dy="34">高，未有重賞，口出怨言，謂費褘曰：「昔日丞相</tspan></text>
