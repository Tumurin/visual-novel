    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="860" cy="214" r="70" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,445 L0,445 L171,327 L317,373 L542,407 L791,401 L943,354 L1098,397 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,472 L0,472 L234,386 L389,472 L608,378 L759,380 L922,437 L1144,330 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,584 L0,584 L174,385 L432,418 L606,539 L747,483 L925,427 L1103,447 L1200,481 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="426" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十三回：姜伯約歸降孔明，武鄉侯罵死王朗</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孔明卻引兵來攻冀城。城中糧少，軍食不敷。姜維</tspan><tspan x="90" dy="34">在城上，見蜀軍大車小輛，搬運糧草，入魏延寨中</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>