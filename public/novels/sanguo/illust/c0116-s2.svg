<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一六回：鍾會分兵漢中道，武侯顯聖定軍山</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">僉大怒，厲聲罵曰：「忘恩背義之賊，有何面目見</tspan><tspan x="90" dy="34">天子乎！」撥回馬復與魏兵接戰。魏兵四面合來，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
