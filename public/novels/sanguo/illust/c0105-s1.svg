<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○五回：武侯預伏錦囊計，魏主拆取承露盤</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說何平引兵逕到南谷之後，擂鼓吶喊。哨馬飛報</tspan><tspan x="90" dy="34">魏延，說楊儀令先鋒何平引兵自槎山小路抄來搦戰</tspan></text>
