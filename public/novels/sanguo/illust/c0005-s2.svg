    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="808" cy="179" r="66" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,441 L0,441 L184,336 L326,361 L472,401 L689,343 L941,318 L1154,370 L1200,369 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,503 L0,503 L185,452 L341,459 L592,455 L829,372 L1017,461 L1200,360 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,560 L0,560 L200,560 L399,494 L603,482 L854,396 L1037,521 L1200,462 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="380" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回：發矯詔諸鎮應曹公，破關兵三英戰呂布</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">呂布見了，棄了公孫瓚，便戰張飛。飛抖擻精神，</tspan><tspan x="90" dy="34">酣戰呂布。連鬥五十餘合，不分勝負。雲長見了，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>