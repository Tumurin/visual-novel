<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○八回：丁奉雪中奮短兵，孫峻席間施密計</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">酒至數巡，吳主孫亮託事先起。孫峻下殿，脫了長</tspan><tspan x="90" dy="34">服，著短衣，內披環甲，手提利刃上殿大呼曰：「</tspan></text>
