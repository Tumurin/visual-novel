<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回：禰正平裸衣罵賊，吉太醫下毒遭刑</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">人報黃祖斬了禰衡，表問其故。對曰：「黃祖與禰</tspan><tspan x="90" dy="34">衡共飲，皆醉。祖問衡曰：『君在許都有何人物？</tspan></text>
