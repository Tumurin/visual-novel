<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回：戰猇亭先主得讎人，守江口書生拜大將</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說章武二年春正月，武威後將軍黃忠隨先主伐吳</tspan><tspan x="90" dy="34">；忽聞先主言老將無用，即提刀上馬，引親隨五六</tspan></text>
