<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">紹怒，立斬之。郭圖恐張郃、高覽回寨證對是非，</tspan><tspan x="90" dy="34">先於袁紹前譖曰：「張郃、高覽見主公兵敗，心中</tspan></text>
