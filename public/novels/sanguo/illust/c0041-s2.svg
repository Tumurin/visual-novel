    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="831" cy="215" r="49" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,438 L0,438 L227,321 L476,403 L657,339 L875,352 L1117,365 L1200,308 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,498 L0,498 L169,347 L337,349 L568,428 L774,451 L979,354 L1142,335 L1200,363 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L236,527 L413,427 L648,397 L847,546 L1046,537 L1200,484 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="409" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十一回：劉玄德攜民渡江，趙子龍單騎救主</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說趙雲自四更時分，與曹軍廝殺，往來衝突，殺</tspan><tspan x="90" dy="34">至天明，尋不見玄德，又失了玄德老小。雲自思曰</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>