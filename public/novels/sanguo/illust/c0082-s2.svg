<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十二回：孫權降魏受九錫，先主征吳賞六軍</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">先主怒曰：「汝東吳害了朕弟，今日敢以巧言來說</tspan><tspan x="90" dy="34">乎！」謹曰：「臣請以輕重大小之事，與陛下論之</tspan></text>
