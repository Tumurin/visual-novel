<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十一回：曹操煮酒論英雄，關公賺城斬車胄</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說玄德正行之間，只見後面塵頭驟起，謂關，張</tspan><tspan x="90" dy="34">曰：「此必曹兵追至也。」遂下了營寨，令關，張</tspan></text>
