<path d="M0,675 L0,401 L0,401 L197,400 L357,388 L532,386 L693,326 L885,315 L1142,317 L1200,326 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,487 L0,487 L201,396 L400,416 L590,408 L733,475 L921,355 L1171,453 L1200,337 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,574 L0,574 L155,411 L356,527 L581,503 L759,456 L954,425 L1098,459 L1200,402 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="422" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回：李傕郭汜大交兵，楊奉董承雙救駕</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當下列開陣勢。汜將崔勇出馬，大罵楊奉反賊。奉</tspan><tspan x="90" dy="34">大怒，回顧陣中曰：「公明何在？」一將手執大斧</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>