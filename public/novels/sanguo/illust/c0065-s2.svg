<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十五回：馬超大戰葭萌關，劉備自領益州牧</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時孫乾已回。玄德復命霍峻，孟達守關，便撤兵來</tspan><tspan x="90" dy="34">取成都。趙雲，黃忠接入綿竹。人報「蜀將劉晙，</tspan></text>
