<path d="M0,675 L0,460 L0,460 L198,303 L376,400 L608,371 L844,366 L1071,399 L1200,398 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,503 L0,503 L159,411 L419,342 L661,383 L857,467 L1023,401 L1200,356 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,563 L0,563 L211,556 L372,543 L544,452 L702,463 L928,416 L1188,499 L1200,537 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="446" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回：廢漢帝陳留為皇，謀董賊孟德獻刀</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李儒讀策畢，卓叱左右扶帝下殿，解其璽綬，北面</tspan><tspan x="90" dy="34">長跪，稱臣聽命。又呼太后去服候敕。帝后皆號哭</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>