<path d="M0,675 L0,419 L0,419 L220,340 L381,328 L565,305 L784,340 L1026,329 L1200,317 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,510 L0,510 L253,382 L462,389 L670,358 L889,446 L1066,464 L1200,457 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,598 L0,598 L204,556 L374,559 L524,397 L774,427 L973,405 L1157,556 L1200,523 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
