<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十一回：趙雲截江奪阿斗，孫權遺書退老瞞</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二人對舞於筵前。魏延目視劉封，封亦拔劍助舞，</tspan><tspan x="90" dy="34">於是劉瑰、冷苞、鄧賢各掣劍出曰：「我等當群舞</tspan></text>
