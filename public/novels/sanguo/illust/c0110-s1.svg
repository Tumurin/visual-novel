<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一○回：文鴦單騎退雄兵，姜維背水破大敵</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">眾將一齊奮力殺回，魏兵大敗。張翼、夏侯霸抄在</tspan><tspan x="90" dy="34">魏兵之後，分兩路殺來，把魏兵困在垓心。維奮武</tspan></text>
