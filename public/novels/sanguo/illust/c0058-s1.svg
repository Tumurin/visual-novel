    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="708" cy="136" r="47" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,434 L0,434 L199,365 L379,407 L552,355 L763,375 L976,380 L1187,362 L1200,334 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,503 L0,503 L249,449 L442,384 L590,391 L757,440 L933,437 L1169,408 L1200,449 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,553 L0,553 L184,427 L379,423 L523,440 L738,469 L918,505 L1121,556 L1200,523 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="389" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十八回：馬孟起興兵雪恨，曹阿瞞割鬚棄袍</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說罷，挺鎗直殺過來。曹操背後于禁出迎。兩馬交</tspan><tspan x="90" dy="34">戰，鬥得八九合，于禁敗走。張郃出迎，戰二十合</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>