    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="975" cy="186" r="47" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,449 L0,449 L181,406 L395,326 L650,358 L800,381 L1018,388 L1175,376 L1200,311 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,487 L0,487 L153,424 L405,345 L582,385 L803,477 L955,404 L1114,386 L1200,408 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,554 L0,554 L184,517 L331,533 L546,436 L757,389 L991,420 L1134,515 L1200,537 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="396" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回：張翼德大鬧長板橋，劉豫州敗走漢津</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說鍾縉、鍾紳，二人攔住趙雲廝殺。趙雲挺槍便</tspan><tspan x="90" dy="34">刺。鍾縉當先揮大斧來迎。兩馬相交，戰不三合，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>