<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回：諸葛亮智算華容，關雲長義釋曹操</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操見前軍停馬不進，問是何故。回報曰：「前面山</tspan><tspan x="90" dy="34">僻路小，因早晨下雨，坑塹內積水不流，泥陷馬蹄</tspan></text>
