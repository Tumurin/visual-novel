<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回：三江口曹操折兵，群英會蔣幹中計</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">肅愕然。忽報曹操遣使送書至，瑜喚入。使者呈上</tspan><tspan x="90" dy="34">書看時，封面上判云：「漢大丞相付周都督開拆。</tspan></text>
