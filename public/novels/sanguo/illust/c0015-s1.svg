<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回：太史慈酣鬥小霸王，孫伯符大戰嚴白虎</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說張飛拔劍要自刎，玄德向前抱住，奪劍擲地曰</tspan><tspan x="90" dy="34">：「古人云：『兄弟如手足，妻子如衣服。衣服破</tspan></text>
