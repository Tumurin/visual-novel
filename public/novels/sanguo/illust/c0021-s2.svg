<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十一回：曹操煮酒論英雄，關公賺城斬車胄</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張飛聽得，便要去廝殺。雲長曰：「他伏甕城邊待</tspan><tspan x="90" dy="34">我，去必有失。我有一計，可殺車冑：乘夜扮入曹</tspan></text>
