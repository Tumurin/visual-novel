<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="762" cy="155" r="58" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,434 L0,434 L205,380 L423,379 L633,408 L836,346 L1027,347 L1173,355 L1200,317 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,526 L0,526 L168,438 L338,369 L530,449 L721,404 L978,351 L1198,381 L1200,356 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,591 L0,591 L176,467 L421,558 L572,397 L801,398 L992,554 L1200,502 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="461" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回：曹阿瞞許田打圍，董國舅內閣受詔</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">玄德背後雲長大怒，剔起臥蠶眉，睜開丹鳳眼，提</tspan><tspan x="90" dy="34">刀拍馬便出，要斬曹操。玄德見了，慌忙搖手送目</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>