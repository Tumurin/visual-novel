    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1024" cy="207" r="57" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,448 L0,448 L260,333 L497,409 L711,316 L859,315 L1049,334 L1200,335 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,523 L0,523 L239,429 L470,441 L713,404 L883,406 L1061,353 L1200,359 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,610 L0,610 L242,527 L491,508 L699,416 L889,495 L1074,397 L1200,390 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="395" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回：曹仁大戰東吳兵，孔明一氣周公瑾</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說孔明欲斬雲長。玄德曰：「昔吾三人結義時，</tspan><tspan x="90" dy="34">誓同生死。今雲長雖犯法，不忍違卻前盟。望權記</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>