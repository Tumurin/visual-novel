<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回：徐公明大戰沔水，關雲長敗走麥城</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說關平聞徐晃自引兵至，遂提本部兵迎敵。兩陣</tspan><tspan x="90" dy="34">對圓，關平出馬，與徐商交鋒，只三合，商大敗而</tspan></text>
