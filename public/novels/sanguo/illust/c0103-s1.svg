<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○三回：上方谷司馬受困，五丈原諸葛禳星</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">是夜二更時分，張球、滿寵，各引軍悄悄望湖口進</tspan><tspan x="90" dy="34">發﹔將近水寨，一齊吶喊刷殺入。吳兵慌亂，不戰</tspan></text>
