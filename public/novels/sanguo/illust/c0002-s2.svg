<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二回：張翼德怒鞭督郵，何國舅謀誅宦豎</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不五十日，報捷，江夏平。詔封堅為烏程侯；封劉</tspan><tspan x="90" dy="34">虞為幽州牧，領兵往漁陽征張舉、張純。代州劉恢</tspan></text>
