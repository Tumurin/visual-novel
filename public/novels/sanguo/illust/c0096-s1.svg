<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回：孔明揮淚斬馬謖，周魴斷髮賺曹休</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽報馬謖、王平、魏延、高翔至，孔明先喚王平入</tspan><tspan x="90" dy="34">帳責之曰：「吾令汝與馬謖同守街亭，汝何不諫之</tspan></text>
