<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回：焚金闕董卓行兇，匿玉璽孫堅背約</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說董卓行至滎陽地方，太守徐榮出接。李儒曰：</tspan><tspan x="90" dy="34">「丞相新棄洛陽，防有追兵。可教徐榮伏軍滎陽城</tspan></text>
