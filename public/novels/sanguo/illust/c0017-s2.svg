<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七回：袁公路大起七軍，曹孟德會合三將</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">是夜二更時分，韓暹、楊奉，分兵到處放火，接應</tspan><tspan x="90" dy="34">呂家軍入寨。勳軍大亂。呂布乘勢掩殺，張勳敗走</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
