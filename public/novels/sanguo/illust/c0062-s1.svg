<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十二回：取涪關楊高授首，攻雒城黃魏爭功</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張肅見了，大驚曰：「吾弟作滅門之事，不可不首</tspan><tspan x="90" dy="34">。」連夜將書見劉璋，具言弟張松與劉備同謀，欲</tspan></text>
