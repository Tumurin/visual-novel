    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="766" cy="123" r="52" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,444 L0,444 L244,385 L402,358 L600,389 L751,302 L929,312 L1168,305 L1200,391 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,489 L0,489 L197,406 L410,386 L653,355 L863,451 L1045,419 L1200,458 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,552 L0,552 L246,492 L491,538 L691,419 L907,399 L1059,547 L1200,433 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="443" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○○回：漢兵劫寨破曹真，武侯鬥陣辱仲達</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">曹真正奔走，忽然喊聲大震，一彪軍殺到。真膽戰</tspan><tspan x="90" dy="34">心驚；視之，乃司馬懿也。懿大戰一場，蜀兵方退</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>