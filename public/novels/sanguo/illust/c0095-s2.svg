<path d="M0,675 L0,422 L0,422 L150,327 L317,408 L543,344 L802,348 L949,372 L1093,318 L1200,325 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,514 L0,514 L205,370 L418,425 L611,477 L851,449 L1065,374 L1200,389 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,601 L0,601 L259,434 L436,390 L643,490 L810,510 L1015,515 L1166,518 L1200,471 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="423" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回：馬謖拒諫失街亭，武侯彈琴退仲達</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說司馬懿分兵而進，此時蜀兵盡回漢中去了。懿</tspan><tspan x="90" dy="34">引一軍復到西城，因問遺下居民及山僻隱者，皆言</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>