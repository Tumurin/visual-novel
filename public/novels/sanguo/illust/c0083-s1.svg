<path d="M0,675 L0,419 L0,419 L146,334 L334,402 L504,370 L736,382 L992,391 L1200,333 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L230,394 L444,395 L690,480 L883,354 L1127,365 L1200,347 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,604 L0,604 L244,466 L410,471 L624,408 L877,460 L1040,445 L1200,497 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
