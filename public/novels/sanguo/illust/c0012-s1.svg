<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十二回：陶恭祖三讓徐州，曹孟德大戰呂布</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說呂布回報陳宮。宮曰：「操多詭計，不可輕敵</tspan><tspan x="90" dy="34">。」布曰：「吾用火攻，可破伏兵。」乃留陳宮、</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
