<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一○回：文鴦單騎退雄兵，姜維背水破大敵</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來文鴦軍馬先到，一擁而進；在寨中左衝右突，</tspan><tspan x="90" dy="34">所到之處，人不敢當；有相拒者，槍搠鞭打，無不</tspan></text>
