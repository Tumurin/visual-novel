<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十四回：孔明定計捉張任，楊阜借兵破馬超</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">約會已定。次日，張任引數千人馬，搖旗吶喊，出</tspan><tspan x="90" dy="34">城搦戰。張飛上馬出迎，更不打話，與張任交鋒。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
