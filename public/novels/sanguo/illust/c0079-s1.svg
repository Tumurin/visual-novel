<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回：兄逼弟曹植賦詩，姪陷叔劉封伏法</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孟達知劉封扯書斬使，勃然大怒，亦領兵出迎。兩</tspan><tspan x="90" dy="34">陣對圓，封立馬於門旗下，以刀指罵曰：「背國反</tspan></text>
