<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三國演義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="753" cy="154" r="70" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,406 L0,406 L182,384 L418,310 L663,370 L866,317 L1026,322 L1200,345 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,524 L0,524 L199,360 L442,404 L598,358 L743,476 L908,370 L1072,425 L1200,373 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,584 L0,584 L182,460 L393,560 L618,553 L789,479 L986,498 L1149,400 L1200,555 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="416" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一二○回：薦杜預老將獻新謀，降孫皓三分歸一統</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說晉將王濬，揚帆而行，過三山，舟師曰：「風</tspan><tspan x="90" dy="34">波甚急，船不能行；且待風勢少息行之。」濬大怒</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>