    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="827" cy="212" r="46" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,459 L0,459 L225,395 L409,312 L622,354 L846,339 L1000,400 L1200,387 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,507 L0,507 L176,361 L343,407 L578,338 L745,401 L964,347 L1161,468 L1200,359 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,571 L0,571 L241,507 L447,422 L665,557 L922,495 L1099,464 L1200,535 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="459" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十回：蔡夫人議獻荊州，諸葛亮火燒新野</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">許褚復回坡前，提兵殺入。至林下追尋時，不見一</tspan><tspan x="90" dy="34">人。時日已墜西，許褚方欲前進，只聽得山上大吹</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>