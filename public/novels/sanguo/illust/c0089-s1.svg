<path d="M0,675 L0,431 L0,431 L158,360 L323,385 L514,383 L693,396 L867,377 L1099,343 L1200,312 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,489 L0,489 L212,470 L403,456 L584,344 L750,407 L893,421 L1089,422 L1200,450 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,601 L0,601 L155,466 L298,427 L546,397 L697,404 L844,510 L1005,456 L1165,450 L1200,401 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="396" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十九回：武鄉侯四番用計，南蠻王五次遭擒</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">是日，狂風大起，四壁廂火明鼓響，蜀兵殺到，蠻</tspan><tspan x="90" dy="34">兵獠丁，自相衝突。孟獲大驚，急引宗族洞丁殺開</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>