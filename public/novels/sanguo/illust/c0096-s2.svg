<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回：孔明揮淚斬馬謖，周魴斷髮賺曹休</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">遂令大將張普為先鋒，引兵數千來與吳兵交戰。兩</tspan><tspan x="90" dy="34">陣對圓，張普出馬罵曰：「賊將早降！」徐盛出馬</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
