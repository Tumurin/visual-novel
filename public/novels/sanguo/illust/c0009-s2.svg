<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九回：除暴兇呂布助司徒，犯長安李傕聽賈詡</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王允時在帝側，聞知此言，奏曰：「臣本為社稷計</tspan><tspan x="90" dy="34">。事已至此，陛下不可惜臣，以誤國家。臣請下見</tspan></text>
