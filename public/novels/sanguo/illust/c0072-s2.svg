<path d="M0,675 L0,418 L0,418 L228,371 L426,408 L592,339 L829,360 L995,301 L1192,368 L1200,379 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,513 L0,513 L251,469 L457,440 L689,400 L913,457 L1093,474 L1200,409 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,568 L0,568 L140,512 L288,499 L446,446 L601,387 L758,405 L993,467 L1200,463 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="427" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十二回：諸葛亮智取漢中，曹阿瞞兵退斜谷</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操見彰至，大喜曰：「我黃鬚兒來，破劉備必矣！</tspan><tspan x="90" dy="34">」遂勒兵復回，於斜谷界口安營。有人報玄德，言</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>