<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十二回：諸葛亮智取漢中，曹阿瞞兵退斜谷</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二將正鬥間，曹寨內火起。人報馬超劫了中後二寨</tspan><tspan x="90" dy="34">。操拔劍在手曰：「諸將退後者斬！」眾將努力上</tspan></text>
