<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回：玄德進位漢中王，雲長攻拔襄陽郡</text>
<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，夏侯存軍至，見了雲長，大怒，便與雲長交</tspan><tspan x="90" dy="34">鋒；只一合，被雲長砍死。翟元便走，被關平趕上</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>