<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">雲長領兵而退。黃忠回到城中來見韓玄，玄便喝左</tspan><tspan x="90" dy="34">右捉下黃忠。忠叫曰：「無罪！」玄大怒曰：「我</tspan></text>
