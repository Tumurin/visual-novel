<path d="M0,675 L0,454 L0,454 L169,370 L375,396 L606,390 L776,319 L1005,330 L1149,330 L1200,362 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,511 L0,511 L253,376 L474,426 L686,421 L870,370 L1079,418 L1200,378 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,591 L0,591 L222,550 L422,429 L674,515 L890,551 L1058,389 L1200,383 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
