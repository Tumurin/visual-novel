    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="765" cy="131" r="70" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,430 L0,430 L204,320 L363,405 L571,385 L763,373 L943,405 L1130,381 L1200,380 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,479 L0,479 L199,421 L394,429 L554,463 L772,433 L924,342 L1101,381 L1200,448 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,555 L0,555 L174,482 L419,530 L559,462 L711,513 L887,384 L1043,490 L1193,546 L1200,421 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="420" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一二回：救壽春于詮死節，取長城伯約鑿兵</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說姜維令人於艾寨中下戰書，約來日大戰，艾佯</tspan><tspan x="90" dy="34">應之。次日五更，維令三軍造飯，平明布陣等候。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
