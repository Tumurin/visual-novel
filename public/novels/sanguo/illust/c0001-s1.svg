<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三國演義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="956" cy="212" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,450 L0,450 L176,400 L321,302 L575,377 L724,332 L956,405 L1113,369 L1200,383 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,492 L0,492 L235,379 L390,348 L586,366 L739,404 L944,457 L1142,375 L1200,343 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,605 L0,605 L145,545 L341,527 L583,535 L789,428 L1034,399 L1200,541 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="425" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一回：宴桃園豪傑三結義，斬黃巾英雄首立功</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">眾賊見程遠志被斬，皆倒戈而走。玄德揮軍追趕，</tspan><tspan x="90" dy="34">投降者不計其數，大勝而回。劉焉親自迎接，賞勞</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>