<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十九回：諸葛亮大破魏兵，司馬懿入寇西蜀</text>
<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來司馬懿亦恐中孔明之計，沿途不住的令人傳報</tspan><tspan x="90" dy="34">。懿正催戰間，忽流星馬飛報，言蜀兵兩路逕取大</tspan></text>
