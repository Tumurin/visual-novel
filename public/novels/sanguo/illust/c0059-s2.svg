<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十九回：許褚裸衣鬥馬超，曹操抹書間韓遂</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">夏侯淵聽了，心中氣忿，厲聲曰：「吾寧死於此地</tspan><tspan x="90" dy="34">，誓滅馬賊！」遂引本部千餘人，大開寨門，直趕</tspan></text>
