<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回：卜周易管輅知機，討漢賊五臣死節</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說曹洪領兵到漢中，令張郃，夏侯淵各據險要。</tspan><tspan x="90" dy="34">曹洪親自進兵拒敵。時張飛自與雷同守巴西。馬兵</tspan></text>
<g transform="translate(1070,545)">
