<path d="M0,675 L0,458 L0,458 L185,324 L442,361 L631,397 L856,321 L1016,379 L1200,368 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,474 L0,474 L249,370 L447,410 L655,447 L909,340 L1149,450 L1200,442 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,603 L0,603 L252,398 L419,508 L655,486 L850,521 L1107,465 L1200,443 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="457" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回：玄德進位漢中王，雲長攻拔襄陽郡</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孫權用其謀，先送滿寵回許都；卻遣諸葛瑾為使，</tspan><tspan x="90" dy="34">投荊州來。入城見雲長禮畢。雲長曰：子瑜此來何</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>