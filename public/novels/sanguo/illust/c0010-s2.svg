<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回：勤王室馬騰舉義，報父讎曹操興師</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">眾皆應允。是夜風雨未息，曹嵩正坐，忽聞四壁喊</tspan><tspan x="90" dy="34">聲大舉。曹德提劍出看，就被搠死。曹嵩忙引一妾</tspan></text>
<g transform="translate(1070,545)">
