<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回：曹操平定漢中地，張遼威震逍遙津</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張魯依言，遣大將楊昂，楊任，與其弟即日起程。</tspan><tspan x="90" dy="34">軍馬到陽平關，下寨已定。夏侯淵，張郃，前軍隨</tspan></text>
