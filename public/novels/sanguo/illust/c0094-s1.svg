<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回：諸葛亮乘雪破羌兵，司馬懿剋日擒孟達</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說曹真連日望羌人消息，忽有伏路軍來報說：蜀</tspan><tspan x="90" dy="34">兵拔寨收拾起程。」郭淮大喜曰：「此因羌兵攻擊</tspan></text>
