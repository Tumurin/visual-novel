    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="709" cy="196" r="62" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,423 L0,423 L197,406 L375,355 L594,314 L840,407 L1013,317 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,517 L0,517 L249,370 L462,476 L690,416 L844,351 L1059,404 L1200,474 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,561 L0,561 L235,387 L435,516 L617,553 L764,434 L939,473 L1124,543 L1200,388 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="434" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十七回：討魏國武侯再上表，破曹兵姜維詐獻書</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說謝雄引軍前行，正遇王雙；戰不三合，被雙一</tspan><tspan x="90" dy="34">刀劈死。蜀兵敗走。雙隨後趕來。龔起接者，交馬</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>