<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回：勤王室馬騰舉義，報父讎曹操興師</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">馬騰、韓遂見軍糧已盡，內應又泄，只得拔寨退軍</tspan><tspan x="90" dy="34">。李傕、郭汜令張濟引軍趕馬騰，樊稠引軍趕韓遂</tspan></text>
