<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回：廢漢帝陳留為皇，謀董賊孟德獻刀</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">歌罷，相抱而哭。李儒叱曰：「相國立等回報，汝</tspan><tspan x="90" dy="34">等俄延，望誰救耶？」太后大罵：「董賊逼我母子</tspan></text>
