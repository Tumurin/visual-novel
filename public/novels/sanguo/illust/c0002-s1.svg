<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二回：張翼德怒鞭督郵，何國舅謀誅宦豎</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">玄德聽令，撥關公、張飛各引軍一千，伏於山後高</tspan><tspan x="90" dy="34">岡之上，盛豬羊狗血並穢物準備。次日，張寶搖旗</tspan></text>
