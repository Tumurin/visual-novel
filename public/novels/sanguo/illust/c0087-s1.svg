<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回：征南寇丞相大興師，抗天兵蠻王初受執</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說趙雲引兵殺到阿會喃寨後之時，馬忠已殺至寨</tspan><tspan x="90" dy="34">前。兩下夾攻，，蠻兵大敗。阿會喃乘亂走脫，各</tspan></text>
