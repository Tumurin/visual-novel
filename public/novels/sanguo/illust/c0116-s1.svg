<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三國演義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="999" cy="199" r="65" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,451 L0,451 L164,410 L421,375 L655,348 L882,345 L1073,322 L1200,332 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,520 L0,520 L230,396 L477,434 L672,360 L830,340 L1042,388 L1200,455 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,564 L0,564 L149,441 L356,456 L586,413 L831,543 L1045,556 L1200,430 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="470" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一六回：鍾會分兵漢中道，武侯顯聖定軍山</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">維大怒，挺槍縱馬，直取王頎。戰不三合。頎大敗</tspan><tspan x="90" dy="34">而走。姜維驅兵追殺，至二十里，只聽得金鼓齊鳴</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>