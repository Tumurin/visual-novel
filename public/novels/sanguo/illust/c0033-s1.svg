<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回：曹丕乘亂納甄氏，郭嘉遺計定遼東</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">百姓皆垂淚而去。袁譚引兵出城，與曹軍相敵。兩</tspan><tspan x="90" dy="34">陣對圓，操出馬以鞭指譚而罵曰：「吾厚待汝，汝</tspan></text>
