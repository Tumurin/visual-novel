<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回：曹操大宴銅雀臺，孔明三氣周公瑾</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說周瑜被諸葛亮預先埋伏關公，黃忠，魏延三枝</tspan><tspan x="90" dy="34">軍馬，一擊大敗。黃蓋、韓當急救下船，折卻水軍</tspan></text>
