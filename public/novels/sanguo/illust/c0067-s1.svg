<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回：曹操平定漢中地，張遼威震逍遙津</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說曹操提軍將進，先令夏侯淵領五千軍，往南鄭</tspan><tspan x="90" dy="34">路上哨探，正迎著楊任軍馬，兩軍擺開。任遣部將</tspan></text>
