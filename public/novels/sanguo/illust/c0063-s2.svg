<path d="M0,675 L0,447 L0,447 L251,375 L393,313 L560,380 L804,382 L959,375 L1158,385 L1200,308 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,486 L0,486 L188,350 L382,361 L540,465 L746,394 L932,444 L1104,340 L1200,431 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,577 L0,577 L207,467 L391,516 L634,421 L786,424 L1025,401 L1197,516 L1200,391 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="437" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十三回：諸葛亮痛哭龐統，張翼德義釋嚴顏</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當日張任，射死龐統，漢軍擁塞，進退不得，死者</tspan><tspan x="90" dy="34">大半。前軍飛報魏延。魏延忙勒兵欲回，奈山路狹</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>