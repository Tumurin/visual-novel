<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">馬騰兄子馬岱諫曰：「曹操心懷叵測，叔父若往，</tspan><tspan x="90" dy="34">死遭其害。」超曰：「兒願盡起西涼之兵，隨父親</tspan></text>
