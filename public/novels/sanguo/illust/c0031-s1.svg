<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一回：曹操倉亭破本初，玄德荊州依劉表</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行到數里，一棒鼓響，前面擁出一彪人馬。當先大</tspan><tspan x="90" dy="34">將，乃是張郃，大叫：「劉備快下馬受降！」玄德</tspan></text>
