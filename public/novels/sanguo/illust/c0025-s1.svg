<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回：屯土山關公約三事，救白馬曹操解重圍</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說顏良敗軍奔回，半路迎見袁紹，報說被赤面長</tspan><tspan x="90" dy="34">鬚使大刀一勇將，匹馬入陣，斬顏良而去，因此大</tspan></text>
