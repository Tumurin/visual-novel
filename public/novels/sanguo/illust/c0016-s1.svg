<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回：呂奉先射戟轅門，曹孟德拜師淯水</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">酒行數巡，布曰：「你兩家看我面上，俱各罷兵。</tspan><tspan x="90" dy="34">」玄德無語。靈曰：「吾奉主公之命，提十萬之兵</tspan></text>
