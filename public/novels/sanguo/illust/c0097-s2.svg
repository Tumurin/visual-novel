<path d="M0,675 L0,443 L0,443 L160,372 L351,343 L599,348 L809,350 L1066,398 L1200,392 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,516 L0,516 L197,477 L431,407 L614,465 L864,411 L1022,453 L1200,339 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,559 L0,559 L188,497 L430,498 L581,497 L764,455 L1015,506 L1200,550 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
