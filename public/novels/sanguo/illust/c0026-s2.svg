<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回：袁本初敗兵折將，關雲長挂印封金</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">關公因將上項事，細說一遍。乾曰：「近聞玄德公</tspan><tspan x="90" dy="34">在袁紹處，欲往投之，未得其便。今劉、龔二人歸</tspan></text>
