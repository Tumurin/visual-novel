<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九回：除暴兇呂布助司徒，犯長安李傕聽賈詡</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王允聽知西涼兵來，與呂布商議。布曰：「司徒放</tspan><tspan x="90" dy="34">心。量此鼠輩，何足數也！」遂引李肅將兵出敵。</tspan></text>
<g transform="translate(1070,545)">
