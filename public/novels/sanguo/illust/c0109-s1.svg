<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○九回：困司馬漢將奇謀，廢曹芳魏家果報</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">魏左將軍郭淮聞報，飛奏洛陽。司馬師問諸將曰：</tspan><tspan x="90" dy="34">「誰敢去敵蜀兵？」輔國將軍徐質曰：「某願往。</tspan></text>
