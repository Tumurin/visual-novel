<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說孔明歸帳，先喚趙雲、魏延聽令。孔明曰：「</tspan><tspan x="90" dy="34">汝二人各引本部軍去劫魏寨。」魏延進曰：「曹真</tspan></text>
