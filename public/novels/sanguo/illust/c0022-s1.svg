    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="834" cy="178" r="46" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,442 L0,442 L148,392 L352,398 L521,331 L748,337 L929,310 L1183,400 L1200,382 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,511 L0,511 L141,394 L359,420 L499,423 L725,358 L942,350 L1182,335 L1200,334 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,550 L0,550 L219,434 L433,517 L669,439 L869,461 L1074,427 L1200,525 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="469" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回：袁曹各起馬步三軍，關張共擒王劉二將</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">是夜張飛卻分兵三路，中間使三十餘人，劫寨放火</tspan><tspan x="90" dy="34">；卻教兩路軍抄出他寨後，看火起為號，夾擊之。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>