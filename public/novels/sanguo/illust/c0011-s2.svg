<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="781" cy="205" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,423 L0,423 L248,399 L426,351 L607,323 L811,314 L955,314 L1096,340 L1200,365 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,530 L0,530 L226,434 L431,399 L646,434 L798,351 L958,361 L1183,392 L1200,345 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,566 L0,566 L230,559 L489,462 L637,471 L779,510 L946,410 L1150,400 L1200,532 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="418" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一回：劉皇叔北海救孔融，呂溫侯濮陽破曹操</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操指呂布而言曰：「吾與汝自來無讎，何得奪吾州</tspan><tspan x="90" dy="34">郡？」布曰：「漢家城池，諸人有分，偏爾合得？</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>