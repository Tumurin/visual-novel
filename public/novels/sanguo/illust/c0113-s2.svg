<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一三回：丁奉定計斬孫綝，姜維鬥陣破鄧艾</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">尚書桓懿大怒，從班部中挺然而出，指孫綝大罵曰</tspan><tspan x="90" dy="34">：「今上乃聰明之主，汝何敢出此亂言！吾寧死不</tspan></text>
