<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回：宴長江曹操賦詩，鎖戰船北軍用武</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操至水軍中央大戰船上坐定，喚集諸將，各各聽令</tspan><tspan x="90" dy="34">。水旱二軍，俱分五色旗號。水軍中央黃旗毛玠，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
