<path d="M0,675 L0,417 L0,417 L243,397 L435,323 L643,344 L827,397 L980,389 L1200,337 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L229,432 L427,462 L663,335 L860,397 L1050,421 L1200,341 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,567 L0,567 L199,459 L403,455 L547,408 L790,536 L973,501 L1165,397 L1200,532 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="462" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十九回：許褚裸衣鬥馬超，曹操抹書間韓遂</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天色微明，只見李堪引一軍從橋下過，超挺槍縱馬</tspan><tspan x="90" dy="34">逐之。李堪拖槍而走。恰好于禁從馬超背後趕來，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>