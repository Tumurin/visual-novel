<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="三國演義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1049" cy="178" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,403 L0,403 L154,312 L319,380 L475,410 L683,405 L823,308 L1065,391 L1200,399 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,509 L0,509 L206,437 L451,405 L656,459 L824,438 L1056,451 L1200,333 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,550 L0,550 L201,531 L443,434 L603,556 L829,456 L1034,537 L1200,388 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="388" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一七回：鄧士載偷渡陰平，諸葛瞻戰死綿竹</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">瞻看畢，勃然大怒，扯碎其書，叱武士立斬來使，</tspan><tspan x="90" dy="34">令從者持首級回魏營見鄧艾，艾大怒，即欲出戰。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>