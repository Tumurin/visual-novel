<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回：曹仁大戰東吳兵，孔明一氣周公瑾</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">仁從之，令牛金引五百軍出戰。丁奉縱馬來迎。約</tspan><tspan x="90" dy="34">戰四五合，奉詐敗，牛金引軍追趕入陣。奉指揮眾</tspan></text>
<g transform="translate(1070,545)">
