<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○九回：困司馬漢將奇謀，廢曹芳魏家果報</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">芳脫下龍鳳汗衫，咬破指尖，寫了血詔，授與張緝</tspan><tspan x="90" dy="34">，乃囑曰：「朕祖武皇帝誅董承，蓋為機事不密也</tspan></text>
