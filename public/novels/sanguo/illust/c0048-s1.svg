<path d="M0,675 L0,436 L0,436 L167,370 L319,331 L511,396 L663,323 L845,304 L1022,394 L1200,362 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,510 L0,510 L160,355 L329,345 L499,421 L662,412 L870,426 L1130,408 L1200,349 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,605 L0,605 L216,383 L413,394 L636,493 L859,486 L1036,385 L1200,496 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
