<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回：徐公明大戰沔水，關雲長敗走麥城</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">言未畢，關平拔劍而前，欲斬諸葛瑾。公止之曰：</tspan><tspan x="90" dy="34">「彼弟孔明在蜀，佐汝伯父，今若殺彼，傷其兄弟</tspan></text>
