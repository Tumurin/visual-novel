<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十一回：急兄讎張飛遇害，雪弟恨先主興兵</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">飛曰：「吾兄被害，讎深似海；廟堂之臣，何不早</tspan><tspan x="90" dy="34">奏興兵？」使者曰：「多有勸先滅魏而後伐吳者。</tspan></text>
<g transform="translate(1070,545)">
