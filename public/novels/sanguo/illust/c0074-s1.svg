<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回：龐令明臺櫬決死戰，關雲長放水渰七軍</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說關公回寨，謂關平曰：「龐德刀法慣熟，真吾</tspan><tspan x="90" dy="34">敵手。」平曰：「俗云：『初生之犢不懼虎。』父</tspan></text>
