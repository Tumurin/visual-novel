<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回：屯土山關公約三事，救白馬曹操解重圍</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，夏侯惇為先鋒，領兵五千來搦戰。關公不出</tspan><tspan x="90" dy="34">，惇即使人於城下辱罵。關公大怒，引三千人馬出</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
