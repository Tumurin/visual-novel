<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十一回：占對山黃忠逸待勞，據漢水趙雲寡勝眾</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操正奔走間，忽劉封，孟達，率二枝兵，從米倉山</tspan><tspan x="90" dy="34">路殺來，放火燒糧草。操棄了北山糧草，忙回南鄭</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
