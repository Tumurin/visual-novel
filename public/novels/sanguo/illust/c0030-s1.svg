  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="938" cy="218" r="49" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,401 L0,401 L241,375 L486,379 L723,378 L883,331 L1027,308 L1183,398 L1200,390 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,481 L0,481 L175,375 L419,451 L624,374 L801,423 L974,371 L1200,350 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L152,429 L343,419 L589,483 L770,423 L990,480 L1178,486 L1200,396 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="413" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回：戰官渡本初敗績，劫烏巢孟德燒糧</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操怒，使張遼出戰。張郃躍馬來迎。二將鬥了四五</tspan><tspan x="90" dy="34">十合，不分勝負。曹操見了，暗暗稱奇。許褚揮刀</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>