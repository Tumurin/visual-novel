<path d="M0,675 L0,409 L0,409 L247,328 L485,338 L739,332 L960,313 L1196,401 L1200,333 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,517 L0,517 L257,379 L419,439 L591,387 L835,410 L1056,391 L1200,362 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L191,420 L335,387 L503,551 L659,547 L860,434 L1119,477 L1200,519 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="427" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十八回：追漢軍王雙受誅，襲陳倉武侯取勝</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正躊躇間，忽報隴西魏軍運糧數千車於祁山之西，</tspan><tspan x="90" dy="34">運糧官乃孫禮也。孔明曰：「其人如何？」有魏人</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>