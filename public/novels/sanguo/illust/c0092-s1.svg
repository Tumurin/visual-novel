<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回：趙子龍力斬五將，諸葛亮智取三城</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鄧芝見趙雲大勝，率蜀兵掩殺，西涼兵大敗而走。</tspan><tspan x="90" dy="34">韓德險被趙雲擒住，棄甲步行而逃。雲與鄧芝收軍</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
