<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回：議溫明董卓叱丁原，餽金珠李肅說呂布</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時盧植棄官未去，見宮中事變，擐甲持戈，立於閣</tspan><tspan x="90" dy="34">下。遙見段珪擁逼何后過來，植大呼曰：「段珪逆</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
