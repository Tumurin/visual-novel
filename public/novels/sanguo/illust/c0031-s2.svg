<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一回：曹操倉亭破本初，玄德荊州依劉表</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">操然其計。左右各分五隊：左一隊夏侯惇、二隊張</tspan><tspan x="90" dy="34">遼、三隊李典、四隊樂進、五隊夏侯淵；右一隊曹</tspan></text>
