<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八回：王司徒巧使連環計，董太師大鬧鳳儀亭</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">又一日，卓於省臺大會百官，列坐兩行。酒至數巡</tspan><tspan x="90" dy="34">，呂布逕入，向卓耳邊言不數句，卓笑曰：「原來</tspan></text>
