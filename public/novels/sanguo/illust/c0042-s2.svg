<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三國演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回：張翼德大鬧長板橋，劉豫州敗走漢津</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當頭那員大將，手執青龍刀，坐下赤兔馬。原來是</tspan><tspan x="90" dy="34">關雲長，去江夏惜得軍馬一萬，探知當陽長板大戰</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
