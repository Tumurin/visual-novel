<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回：諸葛亮智算華容，關雲長義釋曹操</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正走間，背後一軍趕到，大叫：「曹賊休走！」火</tspan><tspan x="90" dy="34">光中現出呂蒙旗號。操催軍馬向前，留張遼斷後，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
