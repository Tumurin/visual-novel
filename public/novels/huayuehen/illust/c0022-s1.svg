<circle cx="1047" cy="212" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,429 L0,429 L248,369 L441,375 L621,335 L764,326 L958,369 L1167,312 L1200,332 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L200,465 L423,451 L602,478 L793,366 L990,353 L1200,397 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,559 L0,559 L212,539 L378,434 L587,409 L758,435 L945,397 L1087,382 L1200,460 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="417" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">花月痕</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回　秋華堂仙眷慶生辰　採石礬將軍施巧計</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">謖如收隊，坐着原來的小船，從蘆葦淺瀨繞出八卦</tspan><tspan x="90" dy="34">州下流，渡上岸，將二百名兵分作兩處埋伏。此時</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>