<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回　桃葉渡蕭三娘排陣　雨花臺朱九妹顯靈</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">看官聽說：賊以殺戮爲事，其茶毒之慘，衣冠塗炭</tspan><tspan x="90" dy="34">，固不待言，那婦女尤受其茶毒。起先男入男館，</tspan></text>
