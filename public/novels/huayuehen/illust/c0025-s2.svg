    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="835" cy="126" r="50" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,447 L0,447 L190,311 L390,402 L531,307 L780,307 L972,333 L1200,365 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,529 L0,529 L171,473 L401,479 L661,414 L835,349 L1090,473 L1200,343 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,587 L0,587 L177,534 L377,418 L610,466 L787,391 L980,463 L1125,506 L1200,396 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="400" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">花月痕</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回　影中影快談紅樓夢　恨裏恨高詠綺懷詩</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">癡珠神氣，日來自然不好，瞧着荷生、採秋，也不</tspan><tspan x="90" dy="34">似往時神采。三人這會都像有萬千言語，不知從何</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>