    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="885" cy="230" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,419 L0,419 L244,332 L403,410 L552,353 L726,406 L904,309 L1151,323 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,523 L0,523 L255,349 L404,350 L587,408 L808,348 L987,444 L1200,422 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,600 L0,600 L164,533 L401,481 L642,525 L872,537 L1024,474 L1200,483 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="390" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">花月痕</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十二回　宴水榭原士規構釁　砸煙燈錢同秀爭風</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">後來花了五百金，買走一妾。進門那一日，辦了數</tspan><tspan x="90" dy="34">席酒，叫了一班清唱相公，請他那相好的財東和苟</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>