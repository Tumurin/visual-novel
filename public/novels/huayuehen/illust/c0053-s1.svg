<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十九回　舍金報母擔粥賑饑　聚寶奪門借兵證果</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">後來卓然、果齋見說寶書、掌珠都已陣亡，掀髯嘆</tspan><tspan x="90" dy="34">息。瑤華也對人說道：“我一生沒有吊過眼淚。五</tspan></text>
