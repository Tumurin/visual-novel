<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回　桃葉渡蕭三娘排陣　雨花臺朱九妹顯靈</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三月間，女先鋒破蕪湖、無爲、東西梁山、太平關</tspan><tspan x="90" dy="34">，收復了江寧各矚邑，大蠢直達江寧，連營青溪、</tspan></text>
