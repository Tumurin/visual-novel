<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到傍晚時候，畢葉也來雯青處，其時次芳等已經散</tspan><tspan x="90" dy="34">了。畢葉就說起早上的事道：「船主質克另要謝儀</tspan></text>
