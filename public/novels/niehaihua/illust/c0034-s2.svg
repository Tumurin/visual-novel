<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">勝佛忙插言道：「皓兄既說到適合國情，這個合不</tspan><tspan x="90" dy="34">合，倒是一個很有研究的問題。我覺得國人尊君親</tspan></text>
