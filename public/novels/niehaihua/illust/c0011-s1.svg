<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一回    潘尚書提倡公羊學　黎學士狂臚老韃文</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到得潘府門前，見已有好幾輛大鞍車停著，門前幾</tspan><tspan x="90" dy="34">棵大樹上，繫著十來匹紅纓踢胸的高頭大馬，知有</tspan></text>
