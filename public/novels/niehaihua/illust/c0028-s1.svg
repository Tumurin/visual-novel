<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回    棣萼雙絕武士道舍生　霹靂一聲革命團特起</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我的摯愛的弟弟：我想你接到這封信時，一定非常</tspan><tspan x="90" dy="34">的喜歡而驚奇。你歡喜的，是可以相信我沒有去實</tspan></text>
