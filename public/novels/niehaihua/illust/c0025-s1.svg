<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回    疑夢疑真司農訪鶴　七擒七縱巡撫吹牛</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那時，與日本宣戰的明諭早發布了。日公使匡次芳</tspan><tspan x="90" dy="34">也下旗回國了。陸軍方面，言、魯、馬、左四路人</tspan></text>
