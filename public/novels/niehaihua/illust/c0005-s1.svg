<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回    開搏賴有長生庫　插架難遮素女圖</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說雯青升了官，自然有同鄉同僚的應酬，忙了數</tspan><tspan x="90" dy="34">日。這一日，略清靜些，忽想到前日侖樵來賀喜，</tspan></text>
