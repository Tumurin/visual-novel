<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回    獻繩技唱黑旗戰史　聽笛聲追白傅遺蹤</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">有話即長，無話即短。不覺春來秋往，忽忽過了兩</tspan><tspan x="90" dy="34">年。那時正鬧著法、越的戰事，在先秉國鈞的原是</tspan></text>
