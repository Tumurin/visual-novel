<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回    艷幟重張懸牌燕慶裏　義旗不振棄甲雞隆山</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">「在景嵩自以為操縱得法，總可得到兩人的同心協</tspan><tspan x="90" dy="34">力。誰知事實恰與思想相反。只為德義同文魁平常</tspan></text>
