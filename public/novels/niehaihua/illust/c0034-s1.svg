<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十四回    雙門底是烈女殉身處　萬木堂作素王改制談</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了重九，常肅又替勝佛餞行，痛飲了一夜。次日</tspan><tspan x="90" dy="34">勝佛病酒，起得很晚，正在自己屋裏料理行裝，常</tspan></text>
