<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻好齊可大正出來，將蘇氏領到龐氏房內。龐氏連</tspan><tspan x="90" dy="34">忙下地相迎，蘇氏滿面笑容，說道：“我今日是與</tspan></text>
