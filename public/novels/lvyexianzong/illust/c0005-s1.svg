    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="812" cy="215" r="67" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,427 L0,427 L256,396 L435,363 L589,392 L829,326 L1049,361 L1200,341 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,471 L0,471 L206,432 L438,402 L649,363 L900,477 L1041,408 L1200,438 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,606 L0,606 L219,394 L366,490 L542,512 L800,410 L992,480 L1200,540 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="448" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回驚存亡永矢修行志囑妻子割斷戀家心</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說冷於冰料理獻述身後事務。他原是個清閒富戶</tspan><tspan x="90" dy="34">，在家極其受用，今與獻述又住了這二十多天，已</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>