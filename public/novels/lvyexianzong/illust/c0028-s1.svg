<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回會盟兄喜隨新官任入賊巢羞見被劫妻</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，酒食停妥，桂芳向文煒舉手道：“你弟兄兩</tspan><tspan x="90" dy="34">個對面坐，我就僭了罷。”也不謙讓，坐了正面。</tspan></text>
