<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十三回溫如玉時窮尋舊友冷於冰得道繳天罡</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">又問道：“我的木劍，你可曾帶在身邊？”於冰急</tspan><tspan x="90" dy="34">忙取出，放在桌上道：“弟子承師尊恩賜，未嘗片</tspan></text>
