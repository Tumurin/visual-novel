<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回寄私書一紙通倭寇冒軍功數語殺張經</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至二十日，水陸大軍起行，張經親來迎候。二十三</tspan><tspan x="90" dy="34">日，兵至塘西。探子報說：“夷目妙美於昨晚將城</tspan></text>
