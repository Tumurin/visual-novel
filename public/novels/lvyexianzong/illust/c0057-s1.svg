<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回鄭龜婆聞唆拼性命苗禿子懼禍棄傢俬</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩人到西房檐下，蕭麻子又將苗禿一看，見衣服拉</tspan><tspan x="90" dy="34">的千條萬縷，面上帶着四五道大血痕，像個指甲撾</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
