<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十一回信訪查知府開生路走懷仁不換續妻房</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來這知府是江蘇吳縣人，姓王名琬，雖是個兩榜</tspan><tspan x="90" dy="34">出身，卻沒一點書氣，辦事最是明敏，兼好訪查。</tspan></text>
