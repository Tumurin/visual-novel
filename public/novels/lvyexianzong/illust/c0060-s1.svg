<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回鄭婆子激起出首事朱一套審斷箇中由</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到次日，鄭三無奈，只得打發起身。一路行來，入</tspan><tspan x="90" dy="34">了泰安城。到溫如玉家門首，鄭婆子下了車，也不</tspan></text>
