<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十四回囚軍營手足重完聚試降書將帥各成功</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">若實在投降，請二位鎮臺入城安撫。東門少撥人馬</tspan><tspan x="90" dy="34">，留一條走路，讓他逃去，亦不必阻擋。着北門林</tspan></text>
