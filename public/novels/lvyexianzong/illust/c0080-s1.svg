<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十一回跳牆頭男女欣歡會角醋口夫婦怒分居</text>
<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“蕙娘也將舌尖送入，讓他吮咂。蕙娘初經雲雨，</tspan><tspan x="90" dy="34">覺得裏面如火燒着的一般，甚是難忍難受。只因心</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>