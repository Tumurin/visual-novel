    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="754" cy="158" r="67" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,423 L0,423 L204,344 L346,313 L547,305 L732,318 L938,306 L1093,336 L1200,346 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,488 L0,488 L175,427 L359,413 L578,431 L771,420 L1021,375 L1200,463 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,555 L0,555 L190,489 L342,506 L483,485 L629,495 L775,516 L954,550 L1200,523 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="395" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八回冷於冰施法劫貪墨猿不邪採藥寄仙書</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說溫如玉自出了州監，不嫖不賭，安分守己過度</tspan><tspan x="90" dy="34">日月不題。再說冷於冰出了瓊崖洞，走了數里山路</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>