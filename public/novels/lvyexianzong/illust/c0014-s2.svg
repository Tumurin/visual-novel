<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="綠野仙蹤">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="759" cy="237" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,449 L0,449 L183,393 L426,401 L627,347 L843,357 L1063,325 L1200,405 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,500 L0,500 L141,467 L371,332 L619,401 L822,366 L1007,371 L1184,449 L1200,360 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,579 L0,579 L177,555 L397,429 L638,554 L848,486 L1009,529 L1200,549 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="380" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十四回救難友知州遭戲虐醫刑傷城璧走天涯</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">於冰道：“是矣。”將雲光落下，緩步迎了上去。</tspan><tspan x="90" dy="34">少刻，見十數隊馬兵，腰懸弓矢，一個武官領着開</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>