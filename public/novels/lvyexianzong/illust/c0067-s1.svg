<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十八回賞勤勞榮封甘棠鎮坐叛黨戴罪大軍營</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">‘藝文院副學士梅紅亦奏道：’將軍白虎所奏，句</tspan><tspan x="90" dy="34">句忠直。適才展其才所奏，臣深知其事。緣先王升</tspan></text>
