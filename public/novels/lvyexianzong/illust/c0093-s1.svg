<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十七回淫羽士翠黛遭鞭笞戰魔王四友失丹爐</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“又問如玉道：“你兩個如何會在一處？想是未被</tspan><tspan x="90" dy="34">風颳開麼？“正言間，猛聽得滿山裏鑼聲亂響，喊</tspan></text>
