    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="971" cy="127" r="58" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,430 L0,430 L188,307 L447,373 L683,403 L852,334 L1072,360 L1200,345 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,525 L0,525 L142,398 L356,417 L529,413 L764,421 L938,466 L1193,332 L1200,444 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,580 L0,580 L256,520 L403,394 L592,520 L785,436 L999,392 L1200,557 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="470" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回結朱陳嫖客招駙馬受節鉞浪子做元戎</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">馬如龍提斧出陣，大喝道：“那麾蓋下騎自馬的，</tspan><tspan x="90" dy="34">可是溫如玉麼？”只這一聲，與雷霆無異。溫如玉</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
