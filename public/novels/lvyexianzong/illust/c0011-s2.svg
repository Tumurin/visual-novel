<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一回仗仙劍柳社收厲鬼試雷珠佛殿誅妖狐</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奴更有何顏復回故室，惟有刎頸於郎君之前。郎總</tspan><tspan x="90" dy="34">忍奴死，寧不念人命干連耶？“於冰見婦人陡然而</tspan></text>
