<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">值日頭同許氏去了。知縣又問許連升道：“你妻方</tspan><tspan x="90" dy="34">氏已成失節之婦，你還要他不要？”連升道：“方</tspan></text>
