<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回韓鐵頭大鬧泰安州連城璧被擒山神廟</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">揹負他出來，還教他各案攀人麼？“衆人齊聲道：</tspan><tspan x="90" dy="34">”韓大哥說的是。“鐵頭又道：”連二弟、馬大哥</tspan></text>
