<path d="M0,675 L0,401 L0,401 L250,350 L489,334 L729,406 L949,406 L1155,406 L1200,377 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,473 L0,473 L196,367 L367,368 L588,348 L844,450 L1000,469 L1186,440 L1200,416 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,554 L0,554 L158,501 L327,418 L545,537 L690,475 L915,465 L1087,457 L1200,401 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="397" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回議參本一朝膺寵命舉賢才兩鎮各勤王</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">應龍瞑目凝神，想了一會，大笑道：“此本一奏，</tspan><tspan x="90" dy="34">趙文華休矣！只怕嚴嵩也有些不方便！”林潤道：</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>