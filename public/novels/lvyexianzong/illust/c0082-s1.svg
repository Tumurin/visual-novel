<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回捉姦情賊母教淫女論親事悍婦的迂夫</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">貢生道：“你這樣天昏地暗的殺材，理該把你投彼</tspan><tspan x="90" dy="34">豺虎，豺虎不食，投彼有畀，有畀不受，投彼有吳</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
