<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一回克永城陣擒師尚義出夏邑法敗僞神師</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說於冰向林岱道：“此時天色漸晚，可吩咐將士</tspan><tspan x="90" dy="34">，不必卸甲，速刻飽食，聽候將令。”少刻，逐電</tspan></text>
