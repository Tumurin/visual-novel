    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1023" cy="122" r="52" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,404 L0,404 L170,332 L411,368 L588,388 L808,321 L985,381 L1184,311 L1200,394 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L225,478 L436,435 L654,432 L835,336 L1004,382 L1150,372 L1200,350 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,604 L0,604 L145,521 L367,381 L626,395 L862,476 L1052,471 L1200,428 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="383" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十回誅鰲魚姑丈回書字遵仙柬盟弟拜新師</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不邪將劍火齊收，按雲頭，隨落在一深山大澗之傍</tspan><tspan x="90" dy="34">。急看妖魚，被火燒的通身破爛，鱗甲披迷，已死</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>