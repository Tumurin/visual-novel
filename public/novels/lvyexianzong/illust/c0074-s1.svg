<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">過了幾日，丁全、吳自興回來，言夷目妙美定要五</tspan><tspan x="90" dy="34">十萬兩，又與了折斷令箭一枝，仍照昨年行事，約</tspan></text>
