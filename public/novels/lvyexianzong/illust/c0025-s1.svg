    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1031" cy="219" r="69" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,453 L0,453 L194,341 L449,375 L600,379 L792,335 L993,352 L1190,349 L1200,302 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,471 L0,471 L142,374 L336,334 L590,354 L817,384 L977,461 L1128,398 L1200,447 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,583 L0,583 L253,556 L479,553 L653,463 L812,450 L1031,402 L1200,475 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="451" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回出祖居文魁思尋弟見家書卜氏喜留賓</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文魁也無心揀擇吉日，收了銀子，就同李必壽夫妻</tspan><tspan x="90" dy="34">二人，帶了幾件必用的器物，搬入土房內居祝將房</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>