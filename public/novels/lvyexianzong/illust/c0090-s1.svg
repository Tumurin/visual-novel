<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="綠野仙蹤">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="917" cy="166" r="63" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,409 L0,409 L160,321 L319,307 L515,401 L765,305 L992,311 L1181,353 L1200,340 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L190,350 L356,438 L602,438 L796,347 L944,424 L1124,467 L1200,475 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,562 L0,562 L149,479 L359,421 L572,404 L807,480 L1041,425 L1200,537 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="422" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回冷於冰逃生死杖下溫如玉失散遇張華</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我急欲到老君元始前請罪，又被三仙阻隔，不容我</tspan><tspan x="90" dy="34">走。我情急畏死，只得與伊等大戰。被一仙偷用寶</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>