<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一回仗仙劍柳社收厲鬼試雷珠佛殿誅妖狐</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">止砍了五六株，到被他一連大鬧了七八夜，如今連</tspan><tspan x="90" dy="34">一枝柳條也不敢砍了。“於冰聽罷，便不再問。睡</tspan></text>
