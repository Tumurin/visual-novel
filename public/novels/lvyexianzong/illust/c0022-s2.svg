  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="879" cy="204" r="55" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,421 L0,421 L221,334 L440,362 L677,346 L922,394 L1092,327 L1200,360 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L153,341 L355,406 L569,337 L819,420 L1036,462 L1200,375 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,564 L0,564 L174,529 L424,523 L638,414 L795,445 L966,415 L1200,450 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="447" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回斷離異不換遭刑杖投運河沈襄得外財</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那人復將不換一看，說道：“我還怕什麼？我姓沈</tspan><tspan x="90" dy="34">名襄，紹興府秀才，父名沈鍊，做錦衣衛經歷。因</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>