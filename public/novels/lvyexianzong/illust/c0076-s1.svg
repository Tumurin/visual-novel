<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="綠野仙蹤">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1041" cy="161" r="51" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,417 L0,417 L212,336 L379,385 L586,326 L783,311 L1003,394 L1184,339 L1200,381 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L224,413 L437,444 L654,417 L800,340 L973,375 L1196,388 L1200,471 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,603 L0,603 L217,551 L449,479 L702,470 L958,491 L1198,449 L1200,520 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="405" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回讀諭單文華心恐懼問賊情大猷出奇謀</text>
<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">雖是趙文華擁兵不動之故，實爲我等一戰成功之地</tspan><tspan x="90" dy="34">也。兵書雲：‘出其不意，攻其無備。’正在此時</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>