<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回斬金花於冰歸泰嶽殺大雄殷氏出賊巢</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">桂芳道：“這些小術，何足爲奇！日前秦尼姑鬥法</tspan><tspan x="90" dy="34">，方算的大觀。”林岱、文煒各以目相示。桂芳自</tspan></text>
