<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">少刻，探子又來報道：“佳夢關賊兵於昨晚三鼓，</tspan><tspan x="90" dy="34">與鐵裏模糊會合，一同向咱國殺去。打聽得關中止</tspan></text>
