    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="761" cy="175" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,445 L0,445 L175,310 L412,387 L635,325 L852,336 L1103,366 L1200,339 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,480 L0,480 L181,391 L348,444 L499,454 L641,331 L850,475 L1079,460 L1200,409 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,557 L0,557 L169,468 L320,502 L577,556 L733,435 L946,489 L1150,505 L1200,492 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="418" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">綠野仙蹤</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十九回返虞城痛惜親骨肉回懷慶欣遇舊知交</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文煒聽到此處，一腳跌翻在地下，不省人事。林岱</tspan><tspan x="90" dy="34">同衆人攙扶叫喚好半晌，方纔回過氣來，喉嚨中哽</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>