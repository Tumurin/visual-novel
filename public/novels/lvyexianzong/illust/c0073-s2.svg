<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回寄私書一紙通倭寇冒軍功數語殺張經</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">旨意一到，文華率衆謝恩，將張經拿付法常張經沿</tspan><tspan x="90" dy="34">街大叫道：“我張經於未署巡撫之日，前巡撫王忬</tspan></text>
