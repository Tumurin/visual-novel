<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說濟公耍笑廣惠，變了幾個茄子。濟公叫鄭雄：</tspan><tspan x="90" dy="34">"去到裏院把老太太請來，我要變個稀奇戲法，叫</tspan></text>
