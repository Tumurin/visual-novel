<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奉師命趨吉避凶 華雲龍鏢傷三友話說濟公過去一</tspan><tspan x="90" dy="34">腳把棺材踢了。掌櫃的一瞧真急了，要打和尚。書</tspan></text>
