<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">因講和仙翁鬥八魔 六合童子炸碎葫蘆話說老仙翁</tspan><tspan x="90" dy="34">把乾坤奧妙大葫蘆打開，口中唸唸有詞，說聲："</tspan></text>
