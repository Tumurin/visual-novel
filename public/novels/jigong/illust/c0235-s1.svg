<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二百三十五回</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">羣魔怒擺金光陣 道緣偷盜斬魔劍話說八魔擺下魔</tspan><tspan x="90" dy="34">火金光陣。把兩位羅漢煉在當中。忽聽外面一聲"</tspan></text>
