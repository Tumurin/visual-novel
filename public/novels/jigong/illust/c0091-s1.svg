<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">五英雄送友古天山 惡妖道自煉陰風劍話說衆官人</tspan><tspan x="90" dy="34">，各擺兵刃一截華雲龍。這些人如何截的住？華雲</tspan></text>
