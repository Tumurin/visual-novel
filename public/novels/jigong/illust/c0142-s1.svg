<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二妖道貪財施邪術 兩豪傑設計盜魂瓶話說董太清</tspan><tspan x="90" dy="34">拿寶劍出來一瞧，不是別人，正是他師兄張太素，</tspan></text>
