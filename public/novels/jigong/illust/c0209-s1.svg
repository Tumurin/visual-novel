<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說韓棋釋放悟緣僧 鬥濟公暗施陰魂絛話說飛天鬼</tspan><tspan x="90" dy="34">石成瑞受濟公之託，趕緊來到藏珍塢。剛到這裏，</tspan></text>
