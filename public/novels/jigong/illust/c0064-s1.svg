<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李平爲友請濟公 馬靜捉姦毗盧寺話說馬靜見濟公</tspan><tspan x="90" dy="34">給老太太把病治好，心中甚爲喜悅，遵母命給濟公</tspan></text>
