<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說濟公在院中燒香請韋馱，只聽房上一聲喊嚷：</tspan><tspan x="90" dy="34">"吾神來也！"書中交代：來者可並非是真韋馱。</tspan></text>
