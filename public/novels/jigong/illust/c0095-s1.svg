<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三英雄避雨金家莊 猛豪傑正氣驚妖女話說雷鳴、</tspan><tspan x="90" dy="34">陳亮聽外面說生人味，雷鳴也不答話，拉出刀來。</tspan></text>
