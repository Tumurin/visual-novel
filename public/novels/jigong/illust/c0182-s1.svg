<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">吳氏遇害奉偷捉賊 濟公耍笑審問崔玉話說黃義同</tspan><tspan x="90" dy="34">街坊鄰人進到屋中一看，見吳氏在牆上釘子崩着，</tspan></text>
