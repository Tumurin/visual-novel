<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　施禪機趙宅治病 說佛法暗中救人</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">"寫賬罷，改日喫了一同給。"掌櫃的早就在這裏</tspan><tspan x="90" dy="34">留神了，聽說沒錢，掌櫃的過來說："和尚，把喫</tspan></text>
