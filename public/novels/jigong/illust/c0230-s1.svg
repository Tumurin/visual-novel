<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">無空僧功滿歸蓮徑 印鐵牛行賄入靈隱話說濟公彈</tspan><tspan x="90" dy="34">師在錢塘縣衙門喝着酒，忽然想起事來，立刻告辭</tspan></text>
