<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說監寺廣亮聽靜明之言，他要問問活佛是誰。靜</tspan><tspan x="90" dy="34">明說："我要一說，可是你損壽十年。咱們這廟道</tspan></text>
