<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">顯神通戲要雷鳴 舍妙藥義救王忠話說濟公在樓下</tspan><tspan x="90" dy="34">一答，樓上華雲龍是驚弓之鳥，賊人膽虛，一縱身</tspan></text>
