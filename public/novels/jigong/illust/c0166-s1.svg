<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鄭雄也只得陪着。喝到了天交三更，忽見由房上跳</tspan><tspan x="90" dy="34">下一個人來，鄭雄一看，來者正是神拳羅漢法元，</tspan></text>
