<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金公子心迷美妖婦 濟長老慈心救好人話說濟公神</tspan><tspan x="90" dy="34">師由金好善家中出來，一直往北，走了有五六里之</tspan></text>
