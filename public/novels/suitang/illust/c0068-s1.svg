<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十八回　成后志怨女出宫　证前盟阴司定案</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">大家举步前行，忽见一座大城，城门上边写着"幽</tspan><tspan x="90" dy="34">明地府鬼门关"七个大字。崔珏道："微臣在前引</tspan></text>
