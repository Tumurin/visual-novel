<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回　借寇兵义臣灭叛臣　设宫宴曹后辱萧后</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">化及见军士焦头烂额者，后忽然又上吐下泻，一齐</tspan><tspan x="90" dy="34">病倒，便放声大哭，以为天谴灾殃，来夺朕命。昼</tspan></text>
