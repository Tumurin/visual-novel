<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宇文述知道秦琼已被来总管放去，只得先开口遮饰</tspan><tspan x="90" dy="34">道："老夫一路来，闻说本兵前部顿兵平壤，私与</tspan></text>
