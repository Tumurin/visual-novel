    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="729" cy="198" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,431 L0,431 L163,321 L364,326 L546,332 L795,377 L955,318 L1142,408 L1200,322 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,520 L0,520 L234,470 L396,447 L623,356 L787,406 L1028,452 L1190,387 L1200,428 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,581 L0,581 L157,497 L414,482 L626,546 L880,507 L1065,432 L1200,527 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="450" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">隋唐演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　逞雄心李靖诉西岳　造谶语张衡危李渊</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">却说隋主，因梦洪水淹城，心疑有个水傍名姓之人</tspan><tspan x="90" dy="34">为祸。时朝中有老臣成阝国公李浑，原系陈朝勋旧</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>