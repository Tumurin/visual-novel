<text x="90" y="120" font-family="serif" font-size="54" fill="#222">隋唐演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回　安禄山范阳造反　封常清东京募兵</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且说当日禄山反叛，引兵南下，步骑精锐，烟尘千</tspan><tspan x="90" dy="34">里。那时海内承平已久，百姓累世不见兵革，猝然</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
