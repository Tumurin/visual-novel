<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　逞雄心李靖诉西岳　造谶语张衡危李渊</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">仁寿元年六月，隋主第三子蜀王秀，因晋王广为太</tspan><tspan x="90" dy="34">子，心怀不平。太子恐其为患，暗嘱杨素求其过端</tspan></text>
