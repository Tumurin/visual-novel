<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八回　杨义臣出师破贼　王伯当施计全交</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">话说杨义臣得了敕旨，便聚将校，择吉行师。兵行</tspan><tspan x="90" dy="34">数日，直抵济渠口。晓得四十里外，就是张金称在</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
