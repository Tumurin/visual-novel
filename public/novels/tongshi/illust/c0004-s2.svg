<text x="90" y="120" font-family="serif" font-size="54" fill="#222">痛史</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回　罵賊臣張貴發嚴辭　送靈柩韓新當說客</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">城外元兵雖鄉，卻被張世傑一馬在前，宗仁、宗義</tspan><tspan x="90" dy="34">在後，如生尤活虎一般，殺入陣去，盪開一路，殺</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
