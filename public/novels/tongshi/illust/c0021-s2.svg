<circle cx="851" cy="199" r="51" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,412 L0,412 L151,404 L398,330 L551,333 L731,335 L991,405 L1176,401 L1200,390 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,483 L0,483 L225,396 L450,334 L699,400 L858,381 L1056,436 L1200,379 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,600 L0,600 L213,441 L384,553 L625,414 L809,484 L984,524 L1200,516 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
