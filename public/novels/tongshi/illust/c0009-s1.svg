<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回　下江西文丞相建殊勳　度仙霞宗伯成得奇遇</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天祥拱手道：“如此說來，莫非足下已萌悔過之心</tspan><tspan x="90" dy="34">，要投誠反正麼？果是如此，僕當奏聞朝廷，賞一</tspan></text>
