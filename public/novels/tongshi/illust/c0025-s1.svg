<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回　應義舉浙民思故主　假投降宗智下惠州</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說狄琪當夜帶領一千兵，悄悄的行至仙霞關下，</tspan><tspan x="90" dy="34">分五百人攻打韃營，五百人取稅廠。先把稅廠圍住</tspan></text>
