<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二回是海上遇了風</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">處分已畢，方叫提文天祥來。元主道：“你好倔強</tspan><tspan x="90" dy="34">！爲何不投降？如果降了，朕便用你做丞相。”天</tspan></text>
