    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="992" cy="150" r="46" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,407 L0,407 L147,357 L390,383 L598,309 L825,395 L1023,362 L1200,318 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,520 L0,520 L232,449 L489,426 L701,423 L895,363 L1134,411 L1200,452 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L155,518 L300,388 L440,457 L666,463 L809,510 L953,508 L1200,536 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="454" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">痛史</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　忽必烈太子蒙重冤　仙霞嶺義兵張撻伐</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">剛剛渡過黃河，只見漫山遍野，盡是韃兵，急尋小</tspan><tspan x="90" dy="34">路而走，蒙固岱也率兵渡河趕來，俠禪人困馬乏，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>