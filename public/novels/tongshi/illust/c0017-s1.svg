<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回　滅宋室生致文天祥　論圖形氣死張弘範</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了祥興二年，正月元日，朝賀已畢，即奉兩宮，</tspan><tspan x="90" dy="34">舍陸登舟，駛至海口，御舟居中下碇。四面數百號</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
