<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　鬍子忠盜案卷盡悉軍情　鄭虎臣別仙霞另行運動</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說罷，解下包裹，取出文書道：“我在路上，還沒</tspan><tspan x="90" dy="34">有功夫去看呢，打開來大家看吧。”宗仁便去剔亮</tspan></text>
