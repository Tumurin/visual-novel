<text x="90" y="120" font-family="serif" font-size="54" fill="#222">痛史</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回　應義舉浙民思故主　假投降宗智下惠州</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">董賢舉當日原是個海客，從海外販貨回國，遇了鍾</tspan><tspan x="90" dy="34">明亮行劫，賢舉慷慨取出金銀相贈。又勸其改業。</tspan></text>
