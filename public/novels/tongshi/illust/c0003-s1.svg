<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　守樊城範天順死節　戰水陸張世傑設謀</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">世傑即升坐中軍帳，傳衆將聽令。先叫部下水師前</tspan><tspan x="90" dy="34">鋒陳瓚，率領水師三千，乘坐戰船，先到上游楊桑</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
