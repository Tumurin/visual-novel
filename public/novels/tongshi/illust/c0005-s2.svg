<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">韓新道：“這且不忙，還有話商量呢。我打聽得家</tspan><tspan x="90" dy="34">母舅不在城內，我想設法將他請來，我們當面說他</tspan></text>
