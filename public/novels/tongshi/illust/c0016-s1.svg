<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七回　越國公奉駕幸崖山　張弘範率師寇祖國</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">副將宗信，帶領五百名兵士斷後，等李恆兵到，便</tspan><tspan x="90" dy="34">揮兵殺回，直殺入韃兵陣內，左衝右突了一回。後</tspan></text>
