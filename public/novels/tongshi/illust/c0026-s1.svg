<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蒙固岱大怒，問：“誰敢出戰？”二甘道：“未將</tspan><tspan x="90" dy="34">願往。”蒙固岱道：“你二人乃敗兵之將，不可當</tspan></text>
