<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第３３４回　白天王一怒斬差官　餘化虎中途救趙勇</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孔壽、趙勇趕緊往西南就闖，只見迎面來者非別，</tspan><tspan x="90" dy="34">正是連環寨餘家坡的二寨主翻江鰲餘化虎，帶着餘</tspan></text>
