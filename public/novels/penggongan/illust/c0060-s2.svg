<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回  粉金剛大鬧茶樓  歐陽德恩收弟子</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">徐勝立刻手拿單刀，出了明化鎮，竟奔宋家堡而來</tspan><tspan x="90" dy="34">。五六里之遙，片刻已到宋家堡的莊門。見這座堡</tspan></text>
