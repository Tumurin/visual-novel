<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二百零九回  雙俠結義吐真情  定計夜破紙人馬</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日早晨，馬玉龍在帥府傳令，將衆會匪調齊，調</tspan><tspan x="90" dy="34">五千馬步軍隊出戰。馬玉龍仍騎佟金柱的赤炭火龍</tspan></text>
