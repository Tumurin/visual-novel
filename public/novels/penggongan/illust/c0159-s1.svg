<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">勝官保拉出龍頭杆棒，大罵道：“飛雲惡賊，休要</tspan><tspan x="90" dy="34">逞強，小太爺前來拿你！”清風道於常業一瞧是勝</tspan></text>
