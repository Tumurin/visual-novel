<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二五五回  餘化龍公館調兵  金眼雕舍死報仇</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">今天胡牛正在大寨，聽嘍兵來報，趕緊帶着手下親</tspan><tspan x="90" dy="34">兵二百名，出了山寨。來到套口，把船一字擺開，</tspan></text>
