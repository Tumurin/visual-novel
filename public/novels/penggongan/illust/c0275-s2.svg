<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">西邊這座門，是由北往東拐過彎去的，一看陣門是</tspan><tspan x="90" dy="34">綠油漆的，上頭有拳頭大的釘子。這幾個人見裏邊</tspan></text>
