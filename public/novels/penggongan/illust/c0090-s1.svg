<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十回  神手將拿獲淫賊  赤松林路逢衆寇</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">其中一人，見那邊有三人廝殺得難以分解，說：“</tspan><tspan x="90" dy="34">三慶兒，你瞧那邊是路劫麼？咱們去看看。”</tspan></text>
<g transform="translate(1070,545)">
