<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">家人去不多時，張耀宗來了，先給大人請安。彭公</tspan><tspan x="90" dy="34">說：“你可坐下，我同你有話商議。昨日我派三人</tspan></text>
