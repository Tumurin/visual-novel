<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百二十七回  祕香居金口封報應  伍振綱酒店見當今</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那趙七皇上乃著名棍徒，他本是金枝玉葉宗室，因</tspan><tspan x="90" dy="34">不安分，在傢俬自窩娼聚賭，犯了案，發往盛京。</tspan></text>
