<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二四八回  重親情設法救差官  聯新姻趙勇訂俠女</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衆人說：“是。”這才順着山坡一直往北走去，只</tspan><tspan x="90" dy="34">見水八寨那邊燈號齊明，照耀如同白晝。衆人順着</tspan></text>
