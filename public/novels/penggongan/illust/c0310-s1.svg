<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第３２５回　歐陽德公館見欽差　馬玉龍施勇捉刺客</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">歐陽德說：“我看這個陣圖，雖然寫着哪裏有削器</tspan><tspan x="90" dy="34">，哪裏有埋伏，卻沒寫怎麼破法，如何才能破得了</tspan></text>
