<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一八六回  餘金鳳智鬥忠義俠  馬玉龍招親臥龍湖</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我們是口盟的結義兄弟，平常我就知道他的脾氣偏</tspan><tspan x="90" dy="34">頗，只知有己，不知有人。我時常良言相勸，他並</tspan></text>
