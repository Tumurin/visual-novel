<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回  武傑忠勇鬥吳鐸  桑婆害人用巧計</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你道這人是誰？原來正是九花娘。她從老龍背與兩</tspan><tspan x="90" dy="34">個哥哥桑仲、桑義火燒了歐陽德，便收拾細軟到這</tspan></text>
