<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二五四回  世外人一怒開殺戒  金錢豹反目戰孟基</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這邊孟基跟地理鬼動手，老英雄一個反背倒劈勢，</tspan><tspan x="90" dy="34">一刀將地理鬼劈下河去。獨角鬼見焦智兄弟受了傷</tspan></text>
