<ellipse cx="600" cy="411" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二九一回  忠義俠公館見欽差  劉德太頭打木羊陣</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這天有人進來稟報，神手大將紀有德已到公館。衆</tspan><tspan x="90" dy="34">人一聽都要看看，內中有認識的，也有沒見過的。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
