<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二一九回  彭欽差西巡到慶陽  飛雲僧喝令殺大人</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代：這跑馬之人，並不是遠方來的，乃是本</tspan><tspan x="90" dy="34">處府城西門外五里小張家莊的人，姓張名和武，妻</tspan></text>
