<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一九六回  挑先鋒二次選豪傑  報父仇捨命刺反叛</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來，呂壽在前本想奪取都會總的，只因前三場不</tspan><tspan x="90" dy="34">能交代，故此在這裏充當小會總。今天聽說考取前</tspan></text>
