<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十回  彭欽差奉旨西巡  衛輝府捉拿賊寇</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">轉過年來，到了四月初旬光景，有陝西甘肅巡撫大</tspan><tspan x="90" dy="34">人折本進京，言說西夏反王、賀蘭山金斗寨的金槍</tspan></text>
