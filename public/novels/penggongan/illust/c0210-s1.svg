<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二二五回  忠義俠智鬥曾天壽  武國興憤怒見佳人</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說衆差官聞報二莊主爺回來了，武傑一聽，先就</tspan><tspan x="90" dy="34">氣往上衝，拉手中單刀，趕緊撲奔後面。衆人跟隨</tspan></text>
