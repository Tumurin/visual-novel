<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百五十一回  訪刺客誤入福承寺  飛雲僧行刺報前仇</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我妻子跟我母親在東屋，小人在西屋睡。聽外面有</tspan><tspan x="90" dy="34">人叫娘子開門，小人知道我妻子素來安分，並無外</tspan></text>
