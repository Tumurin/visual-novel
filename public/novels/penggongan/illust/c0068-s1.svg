<path d="M0,675 L0,434 L0,434 L248,352 L484,306 L633,370 L827,361 L1054,382 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,512 L0,512 L226,449 L446,429 L604,390 L800,336 L979,331 L1145,364 L1200,466 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,610 L0,610 L153,497 L307,385 L554,412 L797,558 L1037,399 L1183,422 L1200,384 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
