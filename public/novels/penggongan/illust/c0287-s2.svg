<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三百零二回  七豪傑夜探八卦山  神手將捨命捉敵人</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你且帶莊丁去四外搜查搜查，看看各處的削器破了</tspan><tspan x="90" dy="34">沒破。我想他既能上我這裏來，這個人必有驚天動</tspan></text>
