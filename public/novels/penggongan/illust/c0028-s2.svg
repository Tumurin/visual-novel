<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回  招商店訪得實信  劫聖駕打虎成名</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">求萬歲爺賜我一點物件，成我之名，死於九泉之下</tspan><tspan x="90" dy="34">，也感念萬歲爺的皇恩浩蕩。“當今老佛爺聽罷此</tspan></text>
