<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">劉德太因蔡慶走後，他問杜清說：“張耀宗是在哪</tspan><tspan x="90" dy="34">裏丟的金牌呢？”杜清把方纔對蔡慶所說的話，又</tspan></text>
