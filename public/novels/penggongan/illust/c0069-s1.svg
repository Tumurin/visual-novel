<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回  神手將目識豪傑  小方朔義釋英雄</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">案前有八仙桌，兩邊各有太師椅子。衆人看罷落座</tspan><tspan x="90" dy="34">。進來兩個十四五歲、長得俊美的小童，獻上茶來</tspan></text>
