<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回  衆英雄三探畫春園  劉德太中計被賊獲</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">他飛身上牆，站在上面，向東一看，見那裏是一片</tspan><tspan x="90" dy="34">宅院。縱身跳了下去，忽見眼前有一個人立在樹後</tspan></text>
