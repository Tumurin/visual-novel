<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回  鐵羅漢回家祭祖  白如意大鬧昌平</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">劉芳看這和尚定是賊人，見他二目賊光爍爍，就看</tspan><tspan x="90" dy="34">出八九分來了。劉芳在後面跟着，叉恐怕他看出來</tspan></text>
