<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回  劉德太怒打花臉狼  鐵幡杆保府雙賣藝</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說高源、劉芳與張耀宗周濟了劉寡婦母女，僱了</tspan><tspan x="90" dy="34">一輛車，收拾細軟之物，上車走了不遠，只見從正</tspan></text>
