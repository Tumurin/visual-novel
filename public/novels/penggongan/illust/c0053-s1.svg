<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十三回  賽李廣智盜金牌  周應龍割袍斷義</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二人要了酒飯，喫喝已畢。劉世昌留常興在這裏住</tspan><tspan x="90" dy="34">下，自己收拾好了，背插單刀，施展陸地飛騰之法</tspan></text>
