<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十二回  粉金剛逛廟救難女  於秋香舍死罵賊人</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">徐勝帶二人至西院上房，說：“二位兄長，是從汴</tspan><tspan x="90" dy="34">梁來的嗎？”二人見左右無人，說了來歷，並說已</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
