<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三百零七回  高志廣良言勸友  吳佔鰲暗進忠言</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">吳氏聽了，說：“賢弟，依你之見，該當怎麼辦呢</tspan><tspan x="90" dy="34">？”吳佔鰲說：“現在恩公鄧飛雄在彭中堂手下當</tspan></text>
