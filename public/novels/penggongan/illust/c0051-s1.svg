<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回  義士奮勇要金牌  山寇安排使巧計</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不多時，只聽得銅鑼響亮，從山上下來了六十名嘍</tspan><tspan x="90" dy="34">兵，都是青布手巾包頭，身穿青布褲褂，白襪，打</tspan></text>
