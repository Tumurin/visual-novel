<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三一零回  差番官約請彭中堂  帶俠義赴會金家坨</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裏早預備下一隻大虎頭舟，戰船上面有大欽差的</tspan><tspan x="90" dy="34">黃旗，馬玉龍穿好麒麟寶鎧，懷抱湛盧劍，混海金</tspan></text>
