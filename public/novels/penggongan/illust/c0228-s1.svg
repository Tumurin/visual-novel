<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩個人走了有三四個照面，王墩一腳便將李環踢下</tspan><tspan x="90" dy="34">河去，那邊有水鬼撈上去捆了。李佩一瞧哥哥被擒</tspan></text>
