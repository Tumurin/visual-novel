<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">彭公又想起荒草山之賊，即行了一角文書，着副將</tspan><tspan x="90" dy="34">徐光輝，與守備彭雲龍、常興，帶領五哨人馬剿滅</tspan></text>
