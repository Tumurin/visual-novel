<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第３３１回　白天王兵困四絕山　馬副將大戰衆番兵</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩方合約之時，彭中堂要這四個賊人；白天王不肯</tspan><tspan x="90" dy="34">，便把這四人放在木羊陣中，每天有走線木人送飯</tspan></text>
