<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三二一回  鑌鐵塔大獲全勝  忠義俠夜劫番營</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">常清這才一聲喊嚷，說：“老英雄，把這件功勞讓</tspan><tspan x="90" dy="34">與我吧！”老英雄不肯跟常清爭功，往旁邊一閃說</tspan></text>
