<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百五十四回  孔壽趙勇雙中計  欽差恩收二英雄</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來飛雲時常到這裏來，這村莊有兩家大財主，是</tspan><tspan x="90" dy="34">福承寺的會首，那黃臉膛姓孔名壽，綽號人稱金錘</tspan></text>
