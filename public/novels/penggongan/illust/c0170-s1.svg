<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代：這臥龍湖的山上有一位寨主，姓餘名化</tspan><tspan x="90" dy="34">龍，人稱鬧海蛟，原是慶陽府連環寨的二寨主，只</tspan></text>
