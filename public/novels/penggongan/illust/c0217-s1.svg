<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說韓登見他請來的人，不是喫裏扒外，就是無能</tspan><tspan x="90" dy="34">之輩，出去就敗。正在爲難之際，背後一聲喊嚷，</tspan></text>
