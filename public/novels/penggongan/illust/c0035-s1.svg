<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十五回  李公然初試神彈子  黃三太大戰周應龍</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">保高俊二人中了彈子回來，說姓楊的人不少，把我</tspan><tspan x="90" dy="34">倆用彈弓打了，大寨主追下去啦！戴勝其心中一動</tspan></text>
