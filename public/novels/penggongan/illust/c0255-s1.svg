<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二七零回  歐陽德誤走金家莊  金文輝治酒請好漢</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金老丈便吩咐家人擺酒，款待衆差官老爺。大家正</tspan><tspan x="90" dy="34">在開懷飲酒，就聽外面鼓樂聲喧，叩打門環。只見</tspan></text>
