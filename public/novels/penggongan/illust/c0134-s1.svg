<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四十一回  焚山寨玉龍歸山  丟欽差羣雄私訪</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">馬玉龍說：“我久有此心，恨不得其門而入。武國</tspan><tspan x="90" dy="34">興說：”我回去稟明大人，這份功勞多是你一人的</tspan></text>
