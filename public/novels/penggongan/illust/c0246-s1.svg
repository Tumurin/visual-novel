    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1041" cy="189" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,458 L0,458 L192,350 L338,363 L594,346 L758,339 L976,386 L1148,404 L1200,376 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,529 L0,529 L258,376 L405,368 L637,391 L781,429 L960,467 L1133,376 L1200,410 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,553 L0,553 L175,396 L343,492 L492,483 L729,512 L877,464 L1124,420 L1200,484 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="458" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二六一回  忠義俠巧遇猛漢  賽達摩憐惜孤兒</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孫寶元把馬玉龍讓到廟裏。馬玉龍一看這本書，已</tspan><tspan x="90" dy="34">把孫寶元家內的緣由看得明明白白。馬玉龍看罷，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>