<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正說着話，就聽前面大殿上一嚷：“小蠍子快來救</tspan><tspan x="90" dy="34">命！”石鑄同大衆進三層殿，一瞧紀逢春這個樣，</tspan></text>
