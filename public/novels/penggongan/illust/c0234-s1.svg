<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二四九回  送差官指引迷途  觀演武又惹是非</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這座山寨原來就是孟家嶺，那男子是打虎將孟達，</tspan><tspan x="90" dy="34">正同胞妹七星秀枝孟巧雲在一處比武。那四十多名</tspan></text>
