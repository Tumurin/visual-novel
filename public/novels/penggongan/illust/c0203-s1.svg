<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來是劉玉瓶在後面跟他哥哥說了，這馬玉龍名揚</tspan><tspan x="90" dy="34">四海，要跟他比比武藝。劉雲說：“那如何使得？</tspan></text>
