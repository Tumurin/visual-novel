<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十回  惡法師古廟行刺  鑌鐵塔施勇擒賊</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">周應龍收拾好細軟之物，即帶家人與一干人等，放</tspan><tspan x="90" dy="34">火燒了房舍，便到了河南紫金山。就在此處立旗招</tspan></text>
