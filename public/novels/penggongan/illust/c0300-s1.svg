<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三一五回  金景虎連捉四將  碧眼蟬夜探番營</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說趙文升栽倒戰場，金景虎剛舉棍要打，金景龍</tspan><tspan x="90" dy="34">吩咐先綁了，番兵用鉤杆子搭過去，繩縛二臂，綁</tspan></text>
