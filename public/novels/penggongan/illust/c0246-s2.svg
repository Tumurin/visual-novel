<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代：馬玉龍從何而來呢？那一天，他來探連</tspan><tspan x="90" dy="34">環寨，大戰金清，中了謊軍之計，進到臥龍塢，那</tspan></text>
