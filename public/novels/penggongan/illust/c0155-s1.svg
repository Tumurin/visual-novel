<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">石鑄往圈外一跳，老道剛要上來，只見由正東跑來</tspan><tspan x="90" dy="34">一個小孩，說：“石大爺，你在這裏，我找你半天</tspan></text>
