<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">前者，周應龍用藥酒將歐陽德治住，用黃絨繩捆好</tspan><tspan x="90" dy="34">，收在後面空房之內，又在鼻中塗了一粒迷魂丹，</tspan></text>
