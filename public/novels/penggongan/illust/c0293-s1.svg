<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三百零八回  笑面虎復探八卦山  周百靈變目殺內弟</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">周百靈來到上房，叫家人把拿住的人帶上來，一抬</tspan><tspan x="90" dy="34">頭看見邱明月年有半百，背插單刀，麪皮微紫，雄</tspan></text>
