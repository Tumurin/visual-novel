<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第３３２回　五天王齊集四絕山　馬妖道施法戰官兵</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來簡壽童自從前番大戰金家坨，便逃到安定山內</tspan><tspan x="90" dy="34">的玉皇觀來。這廟中的老道本是遼東人氏，因爲犯</tspan></text>
