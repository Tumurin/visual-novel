<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回  四霸天頭探北邱山  俠良姑單身盜金牌</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">走了多時，往北是一條大路，見北面這山比別的山</tspan><tspan x="90" dy="34">高出一頭，上邊燈光閃閃，更鼓齊鳴。二人順着山</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
