<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十一回  彭欽差調兵剿賊  銀頭叟慈心惹禍</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">焦振遠心裏總想贏邱爺，他父子六人練了六條杆棒</tspan><tspan x="90" dy="34">，那一日趁着請邱大哥在家中喫酒，喫了就要和邱</tspan></text>
