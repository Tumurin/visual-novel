<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十二回  吳太山暗獻機謀  歐陽德山寨被困</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">寨主之恨彭朋，也不是爲張耀聯一人。只因他縱黃</tspan><tspan x="90" dy="34">三太、楊香武二人盤算寨主，害得寨主無立足之地</tspan></text>
