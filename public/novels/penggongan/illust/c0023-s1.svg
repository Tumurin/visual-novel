<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回  德州郡三太打墩  河間府二墩報仇</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正在商議之際，此時竇二墩早已聽見，是在樹林中</tspan><tspan x="90" dy="34">打劫他的那竇二羔的聲音。他自己偷着出了西房門</tspan></text>
