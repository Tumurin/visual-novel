<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回  採花蜂夜入勝家寨  蘇永祿設計捉淫賊</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來，採花蜂尹亮見勝玉環帶着丫頭上茅房裏去，</tspan><tspan x="90" dy="34">他在後窗戶瞧得明白，見人出來，便把窗戶一推，</tspan></text>
