<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一放手中單刀，說：“你不怕死，只管前來！”韓</tspan><tspan x="90" dy="34">成掄鞭照李七侯就是一鞭，李七侯急架相迎，二人</tspan></text>
