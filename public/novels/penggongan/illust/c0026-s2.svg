<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回  論英雄激惱黃三太  賭閒氣搶劫補秤銀</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">答話說：“黃三哥，你老人家還不知道他的外號兒</tspan><tspan x="90" dy="34">，人人稱他懈怠鬼，最愛說懈怠話，咱們這些年的</tspan></text>
