<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二九九回  簡天雄爲友死沙場  閃電神敗陣請恩師</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">自那日馬玉龍劍斬了簡天雄，閃電神趕緊給簡壽童</tspan><tspan x="90" dy="34">送信，順便邀請金氏三傑。此時西洋山的曹氏兄弟</tspan></text>
<g transform="translate(1070,545)">
