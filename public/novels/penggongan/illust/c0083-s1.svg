<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回  武國興大鬧勝家樓  銀頭叟親傳驚人藝</text>
<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">勝奎迴歸勝家寨，把武傑留在內院，將書房三間叫</tspan><tspan x="90" dy="34">他居住，又派書童耘田去伺候他。武傑瞧那書房之</tspan></text>
