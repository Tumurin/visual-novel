<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說那店家正在房中，看着二兩銀子歡喜，聽見外</tspan><tspan x="90" dy="34">面有人叫門，連忙把銀子放在抽屜之內，出來將門</tspan></text>
