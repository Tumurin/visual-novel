<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二三三回  趙文升飛叉取勝  滋毛虎獨鬥英雄</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">老英雄這條槍蓋世無雙，一出來真象是張牙的猛虎</tspan><tspan x="90" dy="34">。王德鎧心想，要憑能爲贏他，只怕不行，還是先</tspan></text>
