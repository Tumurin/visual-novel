<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">人不分高低上下。走了十幾個照面，高通海累得渾</tspan><tspan x="90" dy="34">身是汗，撒腿就跑，焦禮隨後追趕。高通海說：“</tspan></text>
