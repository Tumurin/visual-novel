<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三百零二回  七豪傑夜探八卦山  神手將捨命捉敵人</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">現已有兩月之久，聽說就打了一回，由東門進去，</tspan><tspan x="90" dy="34">破了一兩道削器埋伏，雖說有兩位有能爲的，也沒</tspan></text>
