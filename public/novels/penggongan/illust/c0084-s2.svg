<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="彭公案">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1028" cy="178" r="54" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,403 L0,403 L217,380 L475,367 L665,312 L806,378 L972,320 L1185,368 L1200,394 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,492 L0,492 L235,359 L477,430 L617,331 L830,470 L1018,470 L1183,410 L1200,451 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,551 L0,551 L260,426 L412,436 L575,542 L825,406 L1066,482 L1200,467 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="415" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十四回  採花蜂大鬧上蔡縣  蘇永祿巡捕惡淫賊</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那日東關外又出一案，裁縫鋪楊五之妻夜內被殺，</tspan><tspan x="90" dy="34">也留一朵鮮花，上落一個蜜蜂兒，是先奸後殺的。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>