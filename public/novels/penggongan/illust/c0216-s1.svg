<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天有巳正，就聽外面一陣大亂，原來是蝴蝶張四帶</tspan><tspan x="90" dy="34">着前部先鋒刺兒山的五位寨主和一百嘍兵趕到。蝴</tspan></text>
