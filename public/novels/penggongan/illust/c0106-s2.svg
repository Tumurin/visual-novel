<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十三回  勝奎智請金眼雕  邱成禮服活閻王</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">邱成說：“老二，我今天前來，就爲你與三弟之事</tspan><tspan x="90" dy="34">。他因你我三人同結金蘭，故在彭大人跟前苦苦哀</tspan></text>
