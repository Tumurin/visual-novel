<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二八七回  追風俠獨赴賀蘭山  白天王見信起兵端</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說劉雲在掛號房外面坐定，只見由裏面出來一員</tspan><tspan x="90" dy="34">番將說：“我家元帥傳你進見。”劉雲這才揹着文</tspan></text>
