<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二三四回  金眼雕力劈飛雲僧  衆差官退敵捉韓登</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話猶未了，西北一片吶喊，金眼雕、伍氏三雄、邱</tspan><tspan x="90" dy="34">明月、追風俠劉雲、醉尉遲劉天雄帶着二百子弟兵</tspan></text>
