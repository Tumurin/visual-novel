<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說吳佔魁兄弟，帶領高志廣、張文彩和兩個小童</tspan><tspan x="90" dy="34">，回至八卦山，來到了藏書樓。這個地方，乃是周</tspan></text>
