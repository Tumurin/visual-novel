<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回  朱桂芳公館送信  定妙策共破賊巢</text>
<text x="90" y="531" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蘇永祿說：“你別說大話，我有人拿你。”說着，</tspan><tspan x="90" dy="34">背後跳出一人，照尹亮就是一掌。尹亮一閃身要想</tspan></text>
