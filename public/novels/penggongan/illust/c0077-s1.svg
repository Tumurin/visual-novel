<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回  老龍背火燒歐陽德  靠山莊淫婦暫避難</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代：這廟是九花娘的兩個胞兄桑仲、桑義所</tspan><tspan x="90" dy="34">佔，他二人也是綠林中人，會使薰香、蒙汗藥，借</tspan></text>
