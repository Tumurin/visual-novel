<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二一二回  忠義俠初會八卦幡  鄧飛雄倒反天地會</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">徐勝說：“衆位差官！現在佟金柱率衆逃走，必然</tspan><tspan x="90" dy="34">去之不遠，只在深山幽谷之中避兵，哪位差官前去</tspan></text>
