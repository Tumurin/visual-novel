<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">餘化龍告了座，說：“欽差大人在上，草民來此非</tspan><tspan x="90" dy="34">爲別故，因有一件大事，要在大人臺前告稟。”大</tspan></text>
