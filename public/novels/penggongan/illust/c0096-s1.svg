<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回  審淫賊罷結大案  俠義女探畫春園</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">姑娘回至房中，帶上各樣暗器，換上鐵鞋，背插單</tspan><tspan x="90" dy="34">刀，暗暗出了上房，飛身上屋，躥房越脊，順馬道</tspan></text>
