<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十四回  鐵幡杆夜探宋家堡  歐陽德巧得珍珠衫</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至天晚，又高搭法臺，宋仕奎要看仙師請天兵天將</tspan><tspan x="90" dy="34">如何請法。他因不知歐陽德是真是假，便叫他的心</tspan></text>
