<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二二一回  羣雄奮勇拿飛雲  豪傑奉命捉刺客</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">飛雲因惦記張秋娘，哪裏睡得着？翻來覆去，直候</tspan><tspan x="90" dy="34">到二鼓以後，自己起來慢慢地穿好衣服，拿單刀往</tspan></text>
