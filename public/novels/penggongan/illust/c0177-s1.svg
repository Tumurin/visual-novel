<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說勝昆正在教軍場發威，藐視天下英雄，只聽得</tspan><tspan x="90" dy="34">東北一聲喊嚷，出來一人，正是打虎太保紀逢春。</tspan></text>
