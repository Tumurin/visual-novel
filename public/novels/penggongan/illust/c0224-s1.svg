<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">把守頭道套口的寨主，姓胡名牛，人稱銅頭胡牛，</tspan><tspan x="90" dy="34">手下管着二千嘍兵，一百隻飛虎舟大戰船。他一聽</tspan></text>
