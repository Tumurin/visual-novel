<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二百零二回 鄧飛雄訪友走天涯  黃花鋪救人打惡棍</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鄧飛雄說：“你這惡霸欺壓良善，勒索鄉人，你是</tspan><tspan x="90" dy="34">太歲，我就在太歲頭上動土。”說着話，拉出了寶</tspan></text>
