<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">去不多時，那二位寨主帶手下人催馬來到樹林內，</tspan><tspan x="90" dy="34">看那位老英雄正把黑雄摔於馬下。李七侯催馬掄刀</tspan></text>
