<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十七回  仇桑店太保捉賊  二山營俠義出世</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正在動手之際，瞧熱鬧的已將劉家店圍滿。忽然一</tspan><tspan x="90" dy="34">陣大亂，從房上跳下一人，身穿紫花布褲褂，足登</tspan></text>
