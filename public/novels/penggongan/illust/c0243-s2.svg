<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二五八回  孽龍潭石鑄撈印  臥龍塢餘氏祭夫</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">自己心想：“須要小心！我自生人以來，還未曾遇</tspan><tspan x="90" dy="34">見敵手，今天遇見金清這廝，真有萬將難敵之勇。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
