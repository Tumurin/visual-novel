<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百二十三回  哭喪計捉拿石鑄  遇故友義結金蘭</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">石鑄與伍氏三雄便裝打扮，傢伙都放在車上，由三</tspan><tspan x="90" dy="34">仙莊起身，曉行夜住，飢餐渴飲，非止一日，來到</tspan></text>
