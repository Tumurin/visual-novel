<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十七回  仇桑店太保捉賊  二山營俠義出世</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">放你過去。“飛雲說：”你不必管，騎驢的不是外</tspan><tspan x="90" dy="34">人，是我嫂子往孃家去，她母親病了，家裏沒人接</tspan></text>
