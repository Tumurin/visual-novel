<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩旁人答應，就將石鑄、魏國安搭了上來，此時還</tspan><tspan x="90" dy="34">人事不知。白天王說：“真人！他二人怎麼還不知</tspan></text>
