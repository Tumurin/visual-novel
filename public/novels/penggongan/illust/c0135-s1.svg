<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四十二回  楊香武細說隱情  霍秉齡探訪機關</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">老道翻身躥到外面，把長大衣服甩去，進西廂房拿</tspan><tspan x="90" dy="34">出一把刀來。武傑告訴李環、李佩，快拉兵刃拿賊</tspan></text>
