<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二三五回  追清風誤入全真觀  設詭計活埋金眼雕</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代：這全真觀主姓趙，名叫智全，綽號人稱</tspan><tspan x="90" dy="34">金須道，武藝超羣，乃是清風惡道於常業的師父。</tspan></text>
