<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三二四回  追刺客巧得真消息  歐陽德三打木羊陣</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代，歐陽德去朝了一次崑崙山，那時節大人</tspan><tspan x="90" dy="34">正大戰金家坨。他打崑崙山回頭，走到青陽驛，正</tspan></text>
