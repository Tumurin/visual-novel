<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蘇永福說：“你我就此前往，不必多講。”來到店</tspan><tspan x="90" dy="34">門首，小夥計正在大門邊坐定，一瞧本地面帶着三</tspan></text>
