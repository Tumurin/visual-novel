<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一六五回  邱成威名驚羣寇  徐勝剿滅荒草營</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日徐勝帶着一千步隊，列開隊伍，遣人前去討戰</tspan><tspan x="90" dy="34">。只聽裏面響了三聲大炮，由山口內閃出兩杆白旗</tspan></text>
