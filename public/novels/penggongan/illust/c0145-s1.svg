<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百五十二回  識破機關捉刺客  武傑三人被賊擒</text>
<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">等到晚上，二人換了夜行衣，背插單刀，直奔靈寶</tspan><tspan x="90" dy="34">縣公館，瞧見東廂北里間隱隱射出燈光，北上房東</tspan></text>
