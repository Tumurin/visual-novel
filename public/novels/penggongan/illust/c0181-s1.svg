<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王家兄弟四人相陪，馬玉龍推杯換盞，喝了幾杯，</tspan><tspan x="90" dy="34">問道：“王家千歲打算以什麼武藝來拔取呢？”佟</tspan></text>
