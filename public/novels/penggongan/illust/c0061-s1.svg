<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那些莊兵，先各練了一趟拳腳，又叫衆寇各人施展</tspan><tspan x="90" dy="34">能爲，他要瞧瞧。黑心狼戚順說：“我練一路短拳</tspan></text>
