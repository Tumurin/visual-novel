<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說喬家五虎正在那裏發威，聽外面一陣大亂，由</tspan><tspan x="90" dy="34">外面進來了趙文升和段文龍，一個擎着叉，一個拿</tspan></text>
