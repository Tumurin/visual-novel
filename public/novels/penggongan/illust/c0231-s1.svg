<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">打虎將孟達洋洋得意，說：“對面小輩，哪個不怕</tspan><tspan x="90" dy="34">死的過來，跟你家少寨主爺比並三合。”這邊怒惱</tspan></text>
