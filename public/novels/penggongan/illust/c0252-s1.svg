<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">書中交代，他說的這是江湖黑話，說的是看臺上有</tspan><tspan x="90" dy="34">個美貌婦人，晚上三更天去採花。石鑄一瞧，正是</tspan></text>
