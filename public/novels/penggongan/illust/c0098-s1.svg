<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">陳山說：“告坐。”大人說：“這磨盤山方圓有多</tspan><tspan x="90" dy="34">大地方？你手下有多少嘍兵？除此之外，那裏還有</tspan></text>
