<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正說着，忽聽樓下有人說：“瞧見上來啦！必是在</tspan><tspan x="90" dy="34">樓上，我瞧瞧哪裏去啦。”這一夥有七八個人，都</tspan></text>
