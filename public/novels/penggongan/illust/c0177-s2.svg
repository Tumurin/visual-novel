<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一九二回  勝官保誤言泄機  餘化龍夜探帥府</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話猶未了，只聽東邊有人說：“對面小輩休要誇口</tspan><tspan x="90" dy="34">，我來也！你們可知道玉面哪吒馬士傑的厲害？”</tspan></text>
