<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋仕奎吩咐擺酒，給兩位教習壓驚。衆人正在飲酒</tspan><tspan x="90" dy="34">，又見家人來報，說：“外面又來了四位應招之人</tspan></text>
