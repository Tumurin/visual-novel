<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">段文龍一瞧哥哥敗了下來，說：“好一個老匹夫，</tspan><tspan x="90" dy="34">待我前來拿你。”一順斬虎刀，照着金亮就砍。金</tspan></text>
