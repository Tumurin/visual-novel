<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第３３１回　白天王兵困四絕山　馬副將大戰衆番兵</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衆人說：“是。”馬玉龍吩咐把隊伍列開，往對面</tspan><tspan x="90" dy="34">一看：這些番兵有如一座兵山，七星幡、北斗幡、</tspan></text>
