<text x="90" y="120" font-family="serif" font-size="54" fill="#222">彭公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二九九回  簡天雄爲友死沙場  閃電神敗陣請恩師</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說蕭金保與孫寶元大戰，正未分勝負，只聽得一</tspan><tspan x="90" dy="34">聲喊嚷，來了一人。衆人閃目一看，見這人身軀高</tspan></text>
