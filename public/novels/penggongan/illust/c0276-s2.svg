<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二九一回  忠義俠公館見欽差  劉德太頭打木羊陣</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說李環在勝家寨多年，又跟這些英雄久在一處，</tspan><tspan x="90" dy="34">總是藝高人膽大，心想當初畫春園也無非是削器埋</tspan></text>
