<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十五回  高家莊羣雄聚會  玉面虎二盜金牌</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">他們因方纔見面，分外親近，情同手足，正飲酒敘</tspan><tspan x="90" dy="34">談別後的事，忽聽杜清與蔡慶提說彭巡撫如何丟金</tspan></text>
