<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">紅毛太歲呂壽一聲喊嚷說：“勝會總，待我前去。</tspan><tspan x="90" dy="34">”一擺手中的單刀，來到兩軍陣前。徐勝說：“哪</tspan></text>
