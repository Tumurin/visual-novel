<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回  衆豪傑捉拿武文華  張茂隆定計擒勢棍</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我乃是獨霸山東竇二墩竇二太爺，過了中秋節後，</tspan><tspan x="90" dy="34">定來訪他。‘其時小侄不敢與他爭鬥，因此回來稟</tspan></text>
