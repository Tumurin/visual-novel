<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">外面有人嚷說：“韓登你出來，你當初是怎麼奪人</tspan><tspan x="90" dy="34">家會仙亭來的，光棍打光棍，一頓還一頓，今天瞧</tspan></text>
