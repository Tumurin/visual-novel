<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">馬德帶着兩個親隨，來到裏面一看，見這院落甚是</tspan><tspan x="90" dy="34">寬大，北上房五間，東西配房各三間，餘化龍兄弟</tspan></text>
