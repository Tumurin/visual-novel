<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一一回     定日盜簪逢場作戲　先期祝壽改扮喬妝</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說丁蔣陸魯四位將白玉堂骨殖盜出，又將埋葬之</tspan><tspan x="90" dy="34">處仍然堆起土丘。收拾已畢，才待回身，只聽那邊</tspan></text>
