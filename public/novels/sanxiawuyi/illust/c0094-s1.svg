<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回     赤子居心尋師覓父　小人得志斷義絕情</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這日天色已晚，忽然下起雨來，既無鎮店，又無村</tspan><tspan x="90" dy="34">莊，無奈何冒雨而行。好容易道旁有個破廟，便奔</tspan></text>
