<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七回     得古今盆完婚淑女　收公孫策密訪奸人</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正談之間，只見外班享道：「劉氏現已傳到。」包</tspan><tspan x="90" dy="34">公吩咐伺候，便叫李才陪侍公孫先生，自己帶了包</tspan></text>
