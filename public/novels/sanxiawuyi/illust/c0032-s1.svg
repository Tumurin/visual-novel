<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回     夜救老僕顏生赴考　晚逢寒士金客揚言</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正在等著，忽聽外面嚷道：「你這地方就敢小看人</tspan><tspan x="90" dy="34">麼？小菜碟兒一個大錢，吾是照顧你，賞你們臉哪</tspan></text>
