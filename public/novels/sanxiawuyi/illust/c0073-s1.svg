<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回     惡姚成識破舊伙計　美絳貞私放新黃堂</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知這些話竟被服侍郭氏的心腹丫頭聽了去了。此</tspan><tspan x="90" dy="34">女名喚絳貞，年方一十九歲，乃舉人朱煥章之女。</tspan></text>
