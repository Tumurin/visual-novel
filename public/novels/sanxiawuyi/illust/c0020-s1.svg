<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回     受魘魔忠良遭大難　殺妖道豪傑立奇功</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說南俠將季婁兒提至曠野，拔劍斬訖。見斜刺裡</tspan><tspan x="90" dy="34">有一婉蜒小路，以為從此可以奔至大路，信步行去</tspan></text>
