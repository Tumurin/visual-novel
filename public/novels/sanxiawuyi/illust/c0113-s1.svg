<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一三回     鍾太保貽書招賢士　蔣澤長冒雨訪賓朋</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說北俠智化二人商議已畢，方才安歇。到了次日</tspan><tspan x="90" dy="34">，鍾雄將軍務料理完時，便請北俠智爺在書房相會</tspan></text>
