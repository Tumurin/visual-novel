<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一四回     忍饑挨餓進廟殺僧　少水無茶開門揖盜</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蔣平這裡向火烘衣，及至衣服快乾，身體暖和，心</tspan><tspan x="90" dy="34">裡卻透出餓來了，暗道：「自我打尖後只顧走路，</tspan></text>
