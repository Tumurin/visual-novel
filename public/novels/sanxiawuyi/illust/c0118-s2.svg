<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一八回     除姦淫錯投大木場　救急困趕奔神樹崗</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時武伯南方問艾虎：「貴姓大名？意欲何往？」</tspan><tspan x="90" dy="34">艾虎也不隱瞞，說了名姓，便將如何要上陳起望尋</tspan></text>
