<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回     設謀誆藥氣走韓彰　遣興濟貧忻逢趙慶</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裡韓爺只顧奔前面樹林，以為蔣平拿了藥去，先</tspan><tspan x="90" dy="34">解救徐慶去了。那裡知道他是奔了開封府呢。韓二</tspan></text>
<g transform="translate(1070,545)">
