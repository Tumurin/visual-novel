<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十八回     花蝶正法展昭完姻　雙俠餞行靜修測字</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時盧方等已迎著韓彰，結義弟兄，彼此相見了，</tspan><tspan x="90" dy="34">自是悲喜交集。南俠見了韓爺，更覺親熱。暫將花</tspan></text>
