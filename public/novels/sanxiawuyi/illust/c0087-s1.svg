<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回     為知己三雄訪沙龍　因救人四義撇艾虎</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蔣爺聽了，暗暗點頭，道：「好小子！拿著廝殺對</tspan><tspan x="90" dy="34">壘當熱鬧兒。真好膽量，好心胸！但只一件，歐陽</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
