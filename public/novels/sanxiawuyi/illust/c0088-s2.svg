<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說艾虎下船之後，一路上想起：「蔣爺在悅來店</tspan><tspan x="90" dy="34">救了自己，蒙他一番好意，帶我上臥虎溝，不想竟</tspan></text>
