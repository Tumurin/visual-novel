<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回     斬龐昱初試龍頭鍘　遇國母晚宿天齊廟</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">畫招後，只見眾人證俱到。包公便叫各家上前廝認</tspan><tspan x="90" dy="34">，也有父認女的，也有兄認妹的，也有夫認妻的，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
