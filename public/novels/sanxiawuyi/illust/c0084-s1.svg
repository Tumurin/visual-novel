<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十四回     復原職倪繼祖成親　觀水災白玉堂捉怪</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文大人吩咐將太守主僕北俠艾虎另在一處候旨，其</tspan><tspan x="90" dy="34">餘案內之人分別收監。共同將復奏折子擬定，連招</tspan></text>
