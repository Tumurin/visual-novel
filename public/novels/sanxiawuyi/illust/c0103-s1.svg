<text x="90" y="531" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說白五爺回到屋內，總覺心神不定，坐立不安，</tspan><tspan x="90" dy="34">自己暗暗詫異道：「今日如何眼跳耳鳴起來？」只</tspan></text>
