<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回     義釋盧方史丹抵命　誤傷馬漢徐慶遭擒</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說著話，伴當在前引路，主僕二人來到下處。盧方</tspan><tspan x="90" dy="34">撢塵淨面之時，酒飯已然齊備。盧方入座，一壁飲</tspan></text>
