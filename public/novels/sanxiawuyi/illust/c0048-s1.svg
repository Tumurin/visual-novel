<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回     訪奸人假公子正法　貶佞黨真義士面君</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">剛來到壽山福海，只見宮殿樓閣，金碧交輝，寶鼎</tspan><tspan x="90" dy="34">香煙，氤氳結綵，丹墀之上，文武排班。忽聽鐘磬</tspan></text>
