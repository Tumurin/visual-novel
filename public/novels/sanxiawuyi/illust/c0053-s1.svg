<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十三回     蔣義士二上翠雲峰　展南俠初到陷空島</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">展爺不由得大怒，暗道：「可惡這些莊丁們，豈有</tspan><tspan x="90" dy="34">此理！這明是白玉堂吩咐，故意激怒於我。諒他縱</tspan></text>
