<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回     獨龍橋盟兄擒義弟　開封府包相保賢豪</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蔣爺笑道：「你願聽，我就說與你聽。你說你到過</tspan><tspan x="90" dy="34">皇宮內院，忠義祠題詩，萬代壽山前殺命，奏折內</tspan></text>
