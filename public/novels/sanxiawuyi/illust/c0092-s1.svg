<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回     小俠揮金貪杯大醉　老葛搶雉惹禍著傷</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你道艾虎如何栽倒？只因葛賊騎馬跑的快，先進了</tspan><tspan x="90" dy="34">山環，便有把守的嘍兵，他就吩咐暗暗埋伏絆腳繩</tspan></text>
