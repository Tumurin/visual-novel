<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十八回     沙龍遭困母女重逢　智化運籌弟兄奮勇</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你道如何？原來藍驍暗令嘍囉圍困沙龍。只要誘敵</tspan><tspan x="90" dy="34">，不准交鋒，心想把他奈何乏了，一鼓而擒之，將</tspan></text>
