<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回     搶魚奪酒少弟拜兄　談文論詩老翁擇婿</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說施俊父名施喬，字必昌，曾作過一任知縣，因</tspan><tspan x="90" dy="34">害目疾失明，告假還鄉。生平有兩個結義的朋友：</tspan></text>
