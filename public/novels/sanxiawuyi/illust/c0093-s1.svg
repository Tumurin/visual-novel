<text x="90" y="120" font-family="serif" font-size="54" fill="#222">三俠五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十三回     辭綠鴨漁獵同合伙　歸臥虎姊妹共談心</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不料藍驍那裡，已知臥虎溝有個鐵面金剛沙龍。他</tspan><tspan x="90" dy="34">卻親身來到臥虎溝，明是索取常例，暗裡要會會沙</tspan></text>
