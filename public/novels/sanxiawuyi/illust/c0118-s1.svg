<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一八回     除姦淫錯投大木場　救急困趕奔神樹崗</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你道此人是誰？真真令人想擬不到。原來正是小俠</tspan><tspan x="90" dy="34">艾虎。自從送了施俊回家，探望父親，幸喜施老爺</tspan></text>
