<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說白玉堂見湯生主僕已然出廟去了，對那大漢執</tspan><tspan x="90" dy="34">手道：「尊兄請了。」大漢道：「請了。請問尊兄</tspan></text>
