<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十一卷　臨安里錢婆留發跡</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說錢鏐打听越州兵去遠，乃引兵而歸，挑選精兵</tspan><tspan x="90" dy="34">千人，假做越州軍旗號，遣顧全武為先鋒，來襲越</tspan></text>
