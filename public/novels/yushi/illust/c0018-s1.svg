<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八卷　楊八老越國奇逢</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說元泰定年間，日本國年歲荒歉，眾倭糾伙，又</tspan><tspan x="90" dy="34">來入寇，也帶楊八老同行。八老心中一則以喜，一</tspan></text>
