<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三卷　新橋市韓五賣春情</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至于唐明皇寵愛楊貴紀之色，春縱春游，夜專夜寵</tspan><tspan x="90" dy="34">。誰想楊紀与安祿山私通，卻抱祿山做孩儿。一日</tspan></text>
