<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十四卷　陳希夷四辭朝命</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">又道：“二十年之后，老夫再來候見圣顏。”太宗</tspan><tspan x="90" dy="34">知不可留，特賜御宴于都堂，使宰相、兩禁官員懼</tspan></text>
