<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十五卷　簡帖僧巧騙皇甫妻</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">白苧輕衫入嫩涼，春蚕食葉響長廊。禹門已准桃花</tspan><tspan x="90" dy="34">浪，月殿先收桂子香。鵬北海，鳳朝陽，又攜書劍</tspan></text>
