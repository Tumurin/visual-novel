<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十九卷　楊謙之客舫遇俠僧</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">薛宣尉看了這銘，說道：“辭旨精拔，愈出愈奇。</tspan><tspan x="90" dy="34">”更加敬服楊公。一連留住五日，每日好筵席款洽</tspan></text>
