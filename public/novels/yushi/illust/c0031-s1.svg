<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一卷　鬧陰司司馬貌斷獄</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">重湘覽畢，呵呵大笑道：“恁樣大事，如何反不問</tspan><tspan x="90" dy="34">決？你們六曹吏司，都該究罪。這都是向來閻君因</tspan></text>
