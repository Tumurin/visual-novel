<text x="90" y="120" font-family="serif" font-size="54" fill="#222">喻世明言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二卷　木綿庵鄭虎臣報冤</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一首詩，是張志遠所作。只為宋朝南渡以后，紹</tspan><tspan x="90" dy="34">興、淳熙年間息兵罷戰，君相自謂太平，縱情佚樂</tspan></text>
