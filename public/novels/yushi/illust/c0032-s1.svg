<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二卷　游酆都胡母迪吟詩</text>
<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">自古机深禍亦深，休貪富貴昧良心。檐前滴水毫無</tspan><tspan x="90" dy="34">錯，報應昭昭自古今。話說宋朝第一個奸臣，姓秦</tspan></text>
