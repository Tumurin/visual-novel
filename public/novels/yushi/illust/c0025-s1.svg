<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五卷　晏平仲二桃殺三士</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">大禹涂山御座開，諸侯玉帛走如雷。防風謾有專車</tspan><tspan x="90" dy="34">骨，何事茲辰最后來？此篇言語，乃胡曾詩。昔三</tspan></text>
