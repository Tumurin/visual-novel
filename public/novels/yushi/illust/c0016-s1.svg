<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六卷　范巨卿雞黍死生交</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這篇言語是《結交行》，言結交最難。今日說一個</tspan><tspan x="90" dy="34">秀才，是漢明帝時人，姓張名劭，字元伯，是汝州</tspan></text>
