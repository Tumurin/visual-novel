<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十卷　沈小霞相會出師表</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">閒向書齋閱古今，偶逢奇事感人心。忠臣翻受奸臣</tspan><tspan x="90" dy="34">制，肮髒英雄淚滿襟。休解綬，慢投簪，從來日月</tspan></text>
