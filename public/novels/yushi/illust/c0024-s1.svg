<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十四卷　楊思溫燕山逢故人</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一夜東風，不見柳梢殘雪。御樓煙暖，對鰲山彩結</tspan><tspan x="90" dy="34">。簫鼓向晚，鳳輦初回宮闕。千門燈火，九衢風月</tspan></text>
