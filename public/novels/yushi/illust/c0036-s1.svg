<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六卷　宋四公大鬧禁魂張</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">錢如流水去還來，恤寡周貧莫吝財。試覽石家金谷</tspan><tspan x="90" dy="34">地，于今荊棘昔樓台。話說晉朝有一人，姓石名崇</tspan></text>
