<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十九卷　月明和尚度柳翠</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">万里新墳盡少年，修行莫待鬢毛斑。前程黑暗路頭</tspan><tspan x="90" dy="34">險，十二時中自著研。這四句詩，單道著禪和子打</tspan></text>
