<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一卷　蔣興哥重會珍珠衫</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話分兩頭。卻說陳大郎有了這珍珠衫儿，每日貼体</tspan><tspan x="90" dy="34">穿著，便夜間脫下，也放在被窩中同睡，寸步不离</tspan></text>
