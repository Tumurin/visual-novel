<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八卷　李秀卿義結黃貞女</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">暇日攀今吊古，從來几個男儿，履危臨難有神机，</tspan><tspan x="90" dy="34">不被他人算計？男子盡多慌錯，婦人反有權奇。若</tspan></text>
