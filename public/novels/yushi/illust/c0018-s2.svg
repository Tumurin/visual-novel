<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八卷　楊八老越國奇逢</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">閒話休題。則今說一節故事，叫做“楊八老越國奇</tspan><tspan x="90" dy="34">逢”。那故事，遠不出漢、唐，近不出二宋，乃出</tspan></text>
