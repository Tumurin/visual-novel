<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十卷　陳從善梅岭失渾家</text>
<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">楊殿干斷曰：“官人且省煩惱，孺人有千日之災。</tspan><tspan x="90" dy="34">三年之后，再遇紫陽，夫婦團圓。”陳巡檢自思：</tspan></text>
