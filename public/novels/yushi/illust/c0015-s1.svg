<text x="90" y="120" font-family="serif" font-size="54" fill="#222">喻世明言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五卷　史弘肇龍虎君臣會</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">其雪轉大。閻待謠見雪下，當日手冷，不做生活，</tspan><tspan x="90" dy="34">在門前閒坐地。只見街上一個大漢過去。閻待謠見</tspan></text>
<g transform="translate(1070,545)">
