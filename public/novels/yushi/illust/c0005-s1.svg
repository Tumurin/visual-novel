<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說大唐貞觀改元，太宗皇帝仁明有道，信用賢臣</tspan><tspan x="90" dy="34">。文有十八學士，武有十八路總管。真個是：鴛班</tspan></text>
