<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九卷　裴晉公義還原配</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說話的，你只道裴晉公是陰德上積來的富貴，誰知</tspan><tspan x="90" dy="34">他富貴以后，陰德更多。則今听我說“義還原配”</tspan></text>
