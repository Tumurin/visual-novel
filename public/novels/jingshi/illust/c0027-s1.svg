<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七卷    假神仙大鬧華光廟</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">吾神訪得真了，先差部下去拿他。二妖神通廣大，</tspan><tspan x="90" dy="34">反為所敗。吾神親往收捕，他兀自假冒呂洞賓、何</tspan></text>
