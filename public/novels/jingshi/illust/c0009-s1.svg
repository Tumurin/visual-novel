<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九卷    李謫仙醉草嚇蠻書</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">渤海國大可毒書達唐朝官家。自你占了高麗，與俺</tspan><tspan x="90" dy="34">國逼近，邊兵屢屢侵犯吾界，想出自宮家之意。俺</tspan></text>
