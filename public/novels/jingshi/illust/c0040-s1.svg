<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十卷    旌陽宮鐵樹鎮妖</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施岑與眄烈從高阜上一望見那妖氣彌天，他兩個少</tspan><tspan x="90" dy="34">年英勇，也不管他勢頭來得大，也不管他黨類來得</tspan></text>
