<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一卷    蘇知縣羅衫再合</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩聲破鼓響，一棒碎鑼鳴。監斬官如十殿閻王，劊</tspan><tspan x="90" dy="34">子手似飛天羅剎。刀斧劫來財帛，萬事皆空；江湖</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
