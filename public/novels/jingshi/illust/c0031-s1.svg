<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一卷    趙春兒重旺曹家莊</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這四句詩是誇獎婦人的。自古道：「有志婦人，勝</tspan><tspan x="90" dy="34">如男子。」且如婦人中，只有娼流最賤，其中出色</tspan></text>
