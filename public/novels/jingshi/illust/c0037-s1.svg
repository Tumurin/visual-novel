<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">萬秀娘哭了，口中不說，心下尋思道：「苗忠底賊</tspan><tspan x="90" dy="34">！你劫了我錢物，殺了我哥哥，又殺了當直周吉，</tspan></text>
