<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七卷    陳可常端陽仙化</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張老只得忍氣吞聲回來，與女兒說知。新荷見說，</tspan><tspan x="90" dy="34">兩淚交流，乃言：「爹娘放心，明日卻與他理會。</tspan></text>
