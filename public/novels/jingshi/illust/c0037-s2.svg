<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十七卷    萬秀娘仇報山亭兒</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">其時合哥兒一行到得苗忠莊上，分付教眾緝捕人：</tspan><tspan x="90" dy="34">「且休來，待我先去探間。」多時不見合哥兒回來</tspan></text>
<g transform="translate(1070,545)">
