<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">知縣大驚，問廟官：「春秋祭賽何物？」廟官復知</tspan><tspan x="90" dy="34">縣：「春間賽七歲花男，秋間賽個女兒。都是地方</tspan></text>
