<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十四卷    玉堂春落難逢夫</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">玉姐回至家中，鴇子見了，欣喜不勝，說：「我兒</tspan><tspan x="90" dy="34">還了願了？」玉姐說：「我還了舊願，發下新願。</tspan></text>
<g transform="translate(1070,545)">
