<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說金家兩個學生，在社學中讀書。放了學時，常</tspan><tspan x="90" dy="34">到庵中頑耍。這一晚，又到庵中。老和尚想道：「</tspan></text>
