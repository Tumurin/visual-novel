<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六卷    俞仲舉題詩遇上皇</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說司馬相如同天使至京師朝見，獻〈上林賦〉一</tspan><tspan x="90" dy="34">篇。天子大喜，即拜為著作郎，待詔金馬門。近有</tspan></text>
