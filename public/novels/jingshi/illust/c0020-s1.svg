<text x="90" y="120" font-family="serif" font-size="54" fill="#222">警世通言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十卷    計押番金鰻產禍</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說天色已曉，人家都開門，只見計押番家靜悄悄</tspan><tspan x="90" dy="34">不聞聲息。鄰舍道：莫是睡殺了也？」隔門叫喚不</tspan></text>
