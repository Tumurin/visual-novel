<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三卷    喬彥杰一妾破家</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當時小二與周氏到家，見了高氏。高氏道：「你如</tspan><tspan x="90" dy="34">今回到家一處住了，如何帶小二回來？何不打發他</tspan></text>
