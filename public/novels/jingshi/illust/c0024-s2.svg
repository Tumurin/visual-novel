<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">工定抬過皮箱打開，盡是金銀首飾器皿等物。王爺</tspan><tspan x="90" dy="34">大怒，罵：「狗畜生！你在那裡偷的這東西？快寫</tspan></text>
