<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十五回　孟良盜回白驥馬　宗保佳遇穆桂英</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宗保率衆軍回見六使曰：“不肖交鋒，誤被穆寨主</tspan><tspan x="90" dy="34">所捉。蒙彼不殺，又與孩兒成親，特來請罪。”六</tspan></text>
