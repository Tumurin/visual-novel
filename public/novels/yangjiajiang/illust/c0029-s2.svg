<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說六使被斬消息傳入佳山寨，嶽勝、孟良等聞知</tspan><tspan x="90" dy="34">，號啕而哭，聲振原野孟良曰：“既本官不幸，我</tspan></text>
