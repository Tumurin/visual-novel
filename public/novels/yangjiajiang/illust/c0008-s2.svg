<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八回　建忠議取接天關　大遼出兵救晉陽</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">贊先引羸卒來接天關攻擊。陸亮方聽知宋兵復來，</tspan><tspan x="90" dy="34">自思：“此必後關難進，故又來攻此地。”乃令部</tspan></text>
