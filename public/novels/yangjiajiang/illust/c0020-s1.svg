<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李濟離了御史臺。次日，以仁美招由，奏知太宗。</tspan><tspan x="90" dy="34">太宗視畢，大怒曰：“朕以仁美先帝功臣，屢恕容</tspan></text>
