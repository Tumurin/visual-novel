<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十一回　楊延朗暗助糧草　八娘子大戰番兵</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">楊宗保見南將連勝番騎，催動後軍追擊。八娘奮勇</tspan><tspan x="90" dy="34">爭先，迎住胡杰交鋒，拋起紅絨套索，將傑捉於馬</tspan></text>
