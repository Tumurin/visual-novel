<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十七回　黃瓊女反投宋營　穆桂英破陣救姑</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說焦贊聽得六使被困，聲震如雷，率兵攻入旁道</tspan><tspan x="90" dy="34">。正遇番將劉珂鎮守虎眼，見宋兵殺來，下臺迎敵</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
