<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十四回　孟良智盜驌驦馬　嶽勝大戰蕭天佑</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孟良回至寨中，見六使，道知蕭天佑之事。六使曰</tspan><tspan x="90" dy="34">：“世上有此異事？吾明日親上陣，便知端的。”</tspan></text>
<g transform="translate(1070,545)">
