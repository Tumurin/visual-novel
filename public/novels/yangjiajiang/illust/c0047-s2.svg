<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回　束天神大戰宋將　百花女錘打張達</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正鬥之間，束天神口唸邪咒，頃刻乾坤黑暗，走石</tspan><tspan x="90" dy="34">飛沙，半空中黑煞魔君，各執利刃殺來。宗保驚異</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>