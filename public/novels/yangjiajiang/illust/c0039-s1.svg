<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宗保既獲全勝，即收軍還營。次日，坐牙帳，調集</tspan><tspan x="90" dy="34">各處軍馬。部卒解進韓延壽。宗保罵曰：“汝誇北</tspan></text>
