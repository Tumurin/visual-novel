<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說蕭天佑分遣已定。人報宋將揚聲溺戰，天佑披</tspan><tspan x="90" dy="34">掛上馬，率番兵列下陣勢。對面嶽勝先出，舞刀大</tspan></text>
