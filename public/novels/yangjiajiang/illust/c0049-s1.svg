<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">緝探報人宋營中：“番人長驅而來，欲與我兵大戰</tspan><tspan x="90" dy="34">。”周夫人聽得，聚集女將議曰：“勝敗在此一舉</tspan></text>
