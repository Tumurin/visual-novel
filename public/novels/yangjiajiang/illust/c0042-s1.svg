<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回　楊郡馬議取北境　重陽女大鬧幽州</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">上萬戶得令，次日平明，一聲炮響，部兵揚旗而出</tspan><tspan x="90" dy="34">。恰遇宋將嶽勝喝曰：“守死之寇，尚不早降何待</tspan></text>
