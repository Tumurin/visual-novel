<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回　講和議楊業回兵　迎鑾駕豪傑施能</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">呼延贊舉槍迎敵。二人戰上數十餘合，不分勝負。</tspan><tspan x="90" dy="34">贊佯輸，走入本陣。党進驟馬追來，綽起鋼刀劈頭</tspan></text>
