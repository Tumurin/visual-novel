<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八回　宗保大破天門陣　五郎降伏蕭天佐</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，鼓罷三通，孟良與焦贊領兵先人，無人敢當</tspan><tspan x="90" dy="34">，直殺近玉皇殿側。孟良奪下珍珠白涼傘，焦贊砍</tspan></text>
