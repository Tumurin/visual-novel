<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八回　宗保大破天門陣　五郎降伏蕭天佐</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說令婆部衆，揚旗鼓譟，殺奔玉皇殿。椿巖即下</tspan><tspan x="90" dy="34">號令，搖動紅旗。梨山老母乃董夫人，拍馬來迎。</tspan></text>
