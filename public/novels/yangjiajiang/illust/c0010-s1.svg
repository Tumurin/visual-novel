<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回　八王進獻反間計　光美奉使說楊業</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，劉鉤遣使徑詣北營中宣召。楊業人至殿前拜</tspan><tspan x="90" dy="34">見畢，劉鈞拔所佩刀，投於階下。兩邊伏兵聽見刀</tspan></text>
