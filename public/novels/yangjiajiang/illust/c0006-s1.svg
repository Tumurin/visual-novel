<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時值太平興國元年二月初一日，太宗視朝畢，下命</tspan><tspan x="90" dy="34">詣太廟行香。時諸臣皆於內前立着起屠碑，以防禦</tspan></text>
