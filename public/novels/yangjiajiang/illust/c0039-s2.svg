<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說王樞密已進幽州，先着近臣奏知。次早朝見蕭</tspan><tspan x="90" dy="34">後。蕭後一見王欽，怒氣衝冠，拍案罵曰：“好佞</tspan></text>
