<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">哨馬報入殷元帥軍中，道知森羅、黑水二國所部，</tspan><tspan x="90" dy="34">大勝宋兵一陣，斬其戰將二員。殷奇大喜，與三太</tspan></text>
