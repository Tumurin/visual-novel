<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時值九月天氣，但見：寒鳳落葉秋容淡，鴻雁聲悲</tspan><tspan x="90" dy="34">旅思中。遼兵進發數日，始至遂城西北五十里下寨</tspan></text>
