<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　金頭娘徵場鬥藝　高懷德大戰潞州</text>
<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">贊乃隨母入軍中見馬忠。畢，忠曰：“聞汝在耿忠</tspan><tspan x="90" dy="34">寨裏，誰知在此相鬥？馬坤是我結義兄弟，汝即宜</tspan></text>
