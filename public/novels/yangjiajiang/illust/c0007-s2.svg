<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七回　北漢主議守河東　呼延贊力擒敵將</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">消息傳入汴京，太宗會羣臣議徵河東之策。楊光美</tspan><tspan x="90" dy="34">奏曰：“河東預備堅完，未可卒下。陛下欲圖之，</tspan></text>
