<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回　達達國議舉伐宋　楊宗保兵徵西夏</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日平明，於城下揚威耀武搦戰。忽東門一聲炮響</tspan><tspan x="90" dy="34">，呼延顯、周福厲聲罵曰：“背逆醜賊，不即返兵</tspan></text>
