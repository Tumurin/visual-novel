<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回　五臺山孟良借兵　三關寨五郎觀象</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">將近平明，孟良恰與九妹相會，說知盜得萬里雲馬</tspan><tspan x="90" dy="34">而來。九妹喜曰：“既得此馬，君往五臺山求五哥</tspan></text>
