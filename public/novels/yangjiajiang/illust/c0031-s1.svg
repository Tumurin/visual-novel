<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">番將耶律慶列陣先戰。嶽勝大罵：“天兵已到，醜</tspan><tspan x="90" dy="34">賊尚不遠遁，是欲自促其亡乎？”耶律慶怒曰：“</tspan></text>
