<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六回　宗保部衆看天陣　真宗築壇封將帥</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">平明鼓罷三通，宗保全身貫帶，揚旗鼓譟而出。對</tspan><tspan x="90" dy="34">壘番將馬韃令公韓延壽，耀武揚威，跑出陣前，見</tspan></text>
