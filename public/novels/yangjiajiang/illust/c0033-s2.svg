<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回　呂軍師布南天陣　楊六使明下三關</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">呂軍師又令蕭後單陽公主率兵五千，各穿五色袈裟</tspan><tspan x="90" dy="34">，按爲迷魂陣。內雜番僧五百，爲迷魂長老。密取</tspan></text>
