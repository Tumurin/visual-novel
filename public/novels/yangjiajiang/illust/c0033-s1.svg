<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回　呂軍師布南天陣　楊六使明下三關</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，椿巖以師父陣囹已完，與韓延壽議曰：“今</tspan><tspan x="90" dy="34">宋兵列營於對壘，可令人下戰書與知，看他如何出</tspan></text>
