<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二回　李建忠力救義士　呼延贊夢神教武</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">排開陣勢，贊喝問：“前面強賊何人？”張吉認得</tspan><tspan x="90" dy="34">是贊，乃曰：“好好放出羅寨主還我，饒你性命；</tspan></text>
