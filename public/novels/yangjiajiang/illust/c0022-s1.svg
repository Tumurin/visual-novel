<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回　楊家將晉陽鬥武　楊郡馬領鎮三關</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">招吉欲衝宋陣，宋隊中走出一女將，乃八娘也。跳</tspan><tspan x="90" dy="34">上青驄，出與招吉交鋒。鬥不數合，八娘拋起紅絛</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
