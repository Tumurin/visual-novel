<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說宋兵各要爭功，如潮湧而進。鄧文在後看見，</tspan><tspan x="90" dy="34">亟向前諫曰：“賊兵不作妖法，見陣輒輸，必有埋</tspan></text>
