<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">分遣已定。次日，鼓罷三通，列陣於幽州城下，宋</tspan><tspan x="90" dy="34">軍北向，遼軍南迎。遼將耶律奚底全身披掛，躍馬</tspan></text>
