<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八回　建忠議取接天關　大遼出兵救晉陽</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">太公聽罷，笑曰：“此處乃是河東咽喉之地，今前</tspan><tspan x="90" dy="34">關與我相爲聲勢，以拒宋師。若許汝進兵，則是割</tspan></text>
