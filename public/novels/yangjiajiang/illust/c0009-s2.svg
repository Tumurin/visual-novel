<text x="90" y="120" font-family="serif" font-size="54" fill="#222">楊家將傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九回　郭進大破耶律沙　劉鈞敕書召楊業</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說敵烈不聽耶律沙之勸，率衆渡澗。衆未及岸，</tspan><tspan x="90" dy="34">忽正東金鼓齊嗚，喊聲震死之寇，尚敢來惹速亡之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
