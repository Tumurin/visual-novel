<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">西營潘仁美探知呼延贊已回汴京，不勝之喜，因與</tspan><tspan x="90" dy="34">衆將商議出戰。米教練進曰：“招討可發戰書於番</tspan></text>
