<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回　樵夫詭計捉孟良　六使單騎收焦贊</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一伏時，六郎引嶽勝等都到巖上，叫孟良曰：“此</tspan><tspan x="90" dy="34">一番在天上捉汝，還不伏乎？”良曰：“汝詭計算</tspan></text>
