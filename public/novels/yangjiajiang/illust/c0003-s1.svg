<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋前鋒高懷德已列下陣勢，兩軍對壘。懷德橫槍立</tspan><tspan x="90" dy="34">馬於陣前，北陣中趙遂躍馬而出，手捻銅刀，厲聲</tspan></text>
