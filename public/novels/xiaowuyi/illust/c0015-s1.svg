<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="小五義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="740" cy="151" r="66" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,409 L0,409 L250,327 L455,385 L671,370 L884,334 L1089,340 L1200,319 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,527 L0,527 L227,405 L486,337 L663,467 L866,417 L1097,371 L1200,368 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,605 L0,605 L223,467 L378,448 L527,471 L756,500 L907,451 L1105,440 L1200,513 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="415" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回 挖雙睛鄧車吸呼死  祭拜弟俠義墜牢籠</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一聲，兩個人一齊墜落下去。你道展爺聽蔣四爺說</tspan><tspan x="90" dy="34">過，怎麼會忘了？皆因是一見玉堂之墓，肝腸慟斷</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>