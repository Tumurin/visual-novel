<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十三回衆嘍兵撥雲見日分水獸棄暗投明</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說大人到了棄岸登船的時節，坐了三號太平船，</tspan><tspan x="90" dy="34">知府總鎮在第二隻船上，文武的小官在第三隻船上</tspan></text>
