<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百一回龍姚追朋玉貪功受險智化遇魏真奮勇傷刀</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說這龍滔、姚猛兩個本是渾人，對着山賊也不明</tspan><tspan x="90" dy="34">白。前頭已經說過，是賊都有他得力的地方，怕是</tspan></text>
