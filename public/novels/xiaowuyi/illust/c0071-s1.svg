<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張豹答言：“我們細軟東西已經包好，下餘讓家人</tspan><tspan x="90" dy="34">分散。文書交與我兄弟收訖。我同着我馬大哥，上</tspan></text>
