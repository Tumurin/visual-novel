<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="小五義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="722" cy="132" r="51" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,417 L0,417 L148,392 L406,366 L574,365 L744,313 L925,337 L1078,397 L1200,362 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,493 L0,493 L235,474 L465,460 L691,366 L900,378 L1044,426 L1200,367 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,582 L0,582 L206,495 L440,506 L680,477 L863,434 L1115,474 L1200,441 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="465" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十二回追周瑞葦塘用計殺小寇放火燒房</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">單說徐良追下週瑞，緊趕緊追，始終不捨，恨不得</tspan><tspan x="90" dy="34">一時把他追上，結果性命，以與一方除害。焉知周</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>