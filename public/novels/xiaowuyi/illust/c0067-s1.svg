<path d="M0,675 L0,454 L0,454 L144,313 L354,303 L539,360 L712,370 L923,319 L1116,316 L1200,397 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,478 L0,478 L147,364 L323,464 L524,392 L672,370 L818,455 L999,427 L1177,334 L1200,401 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,558 L0,558 L227,456 L484,532 L686,473 L930,551 L1120,483 L1200,472 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
