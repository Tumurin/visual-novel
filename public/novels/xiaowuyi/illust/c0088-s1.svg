<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">尼姑左手還有件兵器，其名叫輪，就是一個扁鋼圈</tspan><tspan x="90" dy="34">子，裏外的有刃。在圈子裏頭手拿之處，又有一個</tspan></text>
