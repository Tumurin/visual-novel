<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">艾虎又問盧珍：“怎麼同韓大哥走到一塊了？”盧</tspan><tspan x="90" dy="34">珍就把奉母命，會同了大叔，半路遇天錦，打虎，</tspan></text>
