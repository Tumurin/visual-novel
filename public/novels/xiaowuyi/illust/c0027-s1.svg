<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鍾雄說：“若要棄嫌我是個山賊，二位身價甚重，</tspan><tspan x="90" dy="34">就不必了。”智爺說：“我們是不敢高攀，要論我</tspan></text>
