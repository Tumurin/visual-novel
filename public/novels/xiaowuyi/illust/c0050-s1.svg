<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回張家莊三人重結拜華容縣二友問牧童</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你說我可交，你愛我罷？咱們交一交罷，我可是愛</tspan><tspan x="90" dy="34">你。“馬爺說：”住了，你不會講話。艾兄，你要</tspan></text>
