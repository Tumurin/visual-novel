<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回盧珍假充小義士張英被哄錯磕頭</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">故此將你讓到這邊。論錯，是哥哥你錯了，也搭着</tspan><tspan x="90" dy="34">過賣沒說明白。你也該想一想，你也該看一看，就</tspan></text>
