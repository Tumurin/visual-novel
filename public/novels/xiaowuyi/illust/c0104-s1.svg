<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百五回魯員外被傷嘔血範天保棄家逃生</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說喜鳳本是賣藝出身，專會打流星，百發百中。</tspan><tspan x="90" dy="34">一根絨繩上頭，拴着個鐵甜瓜頭兒，打將出去，往</tspan></text>
