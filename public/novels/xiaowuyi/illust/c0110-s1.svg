<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="小五義">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="789" cy="165" r="67" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,429 L0,429 L144,365 L345,344 L502,303 L723,304 L892,380 L1097,401 L1200,335 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,489 L0,489 L246,476 L481,451 L681,412 L914,357 L1150,337 L1200,383 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,577 L0,577 L172,523 L391,470 L620,494 L872,468 L1022,457 L1200,462 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="459" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十一回柳青倒取蟠蛇嶺蔣平大戰黑水湖</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">柳員外知道我的事情。不敢回家，怕讓老爺們生氣</tspan><tspan x="90" dy="34">。我走在黑水湖，讓他們截上山來，吳源愛惜我，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>