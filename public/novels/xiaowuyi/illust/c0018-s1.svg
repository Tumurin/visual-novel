<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回 徐三爺鬼眼川發燥  無鱗鰲在水寨追人</text>
<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">由那邊來了一隻小船，船頭上格着個燈籠，馬紮上</tspan><tspan x="90" dy="34">坐着個嘍兵，卷檐藍氈帽，青袍套半褂，前後的白</tspan></text>
