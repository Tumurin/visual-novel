<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回知縣臨險地遇救江樊到絕處逢生</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">豈知壞了事了。這日正對着月娘兒買絨線，正遇着</tspan><tspan x="90" dy="34">九天廟的和尚打後門一過，可巧被月娘看了他一眼</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
