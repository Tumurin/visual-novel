<path d="M0,675 L0,453 L0,453 L254,405 L411,308 L596,342 L761,344 L1012,353 L1200,325 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,472 L0,472 L167,399 L336,442 L569,400 L808,385 L1029,333 L1200,367 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,602 L0,602 L140,508 L371,505 L525,397 L715,505 L895,436 L1104,399 L1200,456 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
