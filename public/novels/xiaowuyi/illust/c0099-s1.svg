<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百回智化放火燒大寨嘍兵得命上君山</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">看看臨近，來了一家寨主，帶着數十名嘍兵，嘍兵</tspan><tspan x="90" dy="34">一字排開，每人拿着兵器，有雙刀的，有單刀的。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
