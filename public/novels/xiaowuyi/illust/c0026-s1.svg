<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回 削剛刀毛保甘受苦  論寶劍智化暗罵人</text>
<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">每遇出征之時，跨上此刀，伐梆點名，掌號起隊，</tspan><tspan x="90" dy="34">此刀由鞘中自己出來寸許光景，今日出徵必是大獲</tspan></text>
