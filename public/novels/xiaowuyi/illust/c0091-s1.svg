    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="926" cy="129" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,453 L0,453 L240,343 L492,333 L706,330 L902,337 L1090,335 L1200,330 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L252,391 L463,337 L632,367 L815,403 L1038,362 L1200,377 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,556 L0,556 L207,525 L460,531 L624,397 L803,384 L1049,384 L1200,458 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="413" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回丁二爺獨受蒙汗藥鄧飛熊逃命奔他方</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">北俠以爲是暗器，原來是他把半截峨眉枝子扔將過</tspan><tspan x="90" dy="34">來。北俠微須一閃身，他就從北俠旁邊躥過去了。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
