<text x="90" y="120" font-family="serif" font-size="54" fill="#222">小五義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十二回打虎將有心結拜盧公子無意聯姻</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不多時請來，進書房與天錦診脈。大夫說：“就是</tspan><tspan x="90" dy="34">停食。”開了個方兒。大夫去後，天光已亮。抓了</tspan></text>
