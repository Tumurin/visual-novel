<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十九回 入水寨吸呼廢命 到大關受險擔驚</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那船走不到一里，後面鑼聲震耳，除麻陽大戰船一</tspan><tspan x="90" dy="34">隻，數十隻小巡船趕下來了。若問大衆如何，且聽</tspan></text>
