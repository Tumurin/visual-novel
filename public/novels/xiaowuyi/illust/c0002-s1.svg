<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">智爺意欲向前，忽然聽東南“颼”的一聲，由風火</tspan><tspan x="90" dy="34">家人進來一條黑影。智爺喫驚，伏身細看，原來是</tspan></text>
