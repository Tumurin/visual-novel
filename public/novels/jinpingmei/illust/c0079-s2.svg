<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回　西門慶貪欲喪命　吳月娘失偶生兒</text>
<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">過了兩日，月娘痴心，只指望西門慶還好，誰知天</tspan><tspan x="90" dy="34">數造定，三十三歲而去。到於正月二十一日，五更</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
