<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回　苗青貪財害主　西門枉法受贓</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">常言道：火到豬頭爛，錢到公事辦。西門慶、夏提</tspan><tspan x="90" dy="34">刑已是會定了。次日到衙門裡升廳，那提控、節級</tspan></text>
