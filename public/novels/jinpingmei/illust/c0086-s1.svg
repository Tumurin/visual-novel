<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十六回　雪娥唆打陳敬濟　金蓮解渴王潮兒</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到次日，飯時已後，月娘埋伏了丫鬟媳婦七八個人</tspan><tspan x="90" dy="34">，各拿短棍棒槌。使小廝來安兒請進陳敬濟來後邊</tspan></text>
