<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回　逞豪華門前放煙火　賞元宵樓上醉花燈</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一丈五高花樁，四周下山棚熱鬧。最高處一隻仙鶴</tspan><tspan x="90" dy="34">，口裡銜著一封丹書，乃是一枝起火，一道寒光，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
