<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回　傻幫閑趨奉鬧華筵　痴子弟爭鋒毀花院</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">光陰似箭，不覺又是十一月下旬。西門慶在常峙節</tspan><tspan x="90" dy="34">家會茶散的早，未掌燈就起身，同應伯爵、謝希大</tspan></text>
<g transform="translate(1070,545)">
