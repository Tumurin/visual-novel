<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，換了衣服，與伯爵手拉著手兒同步出來。路</tspan><tspan x="90" dy="34">上撞著謝希大，笑道：“哥們，敢是來看打虎的麽</tspan></text>
