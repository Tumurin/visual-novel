<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回　赴巫山潘氏幽歡　鬧茶坊鄆哥義憤</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話分兩頭。且說本縣有個小的，年方十五六歲，本</tspan><tspan x="90" dy="34">身姓喬，因為做軍在鄆州生養的，取名叫做鄆哥。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
