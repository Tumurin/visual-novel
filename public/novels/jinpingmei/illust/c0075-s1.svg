<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十五回　因抱恙玉姐含酸　為護短金蓮潑醋</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當下月娘自知屋裡說話，不防金蓮暗走到明間簾下</tspan><tspan x="90" dy="34">，聽覷多時了，猛可開言說道：“可是大娘說的，</tspan></text>
