<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回　苗青貪財害主　西門枉法受贓</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">玳安一直來家，交進氈包。等的西門慶睡了一覺出</tspan><tspan x="90" dy="34">來，在廂房中坐的。這玳安慢慢走到跟前，說：“</tspan></text>
