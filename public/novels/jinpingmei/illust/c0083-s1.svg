<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回　秋菊含恨泄幽情　春梅寄柬諧佳會</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說秋菊在那邊屋裡，忽聽見這邊屋裡恰似有男子</tspan><tspan x="90" dy="34">聲音說話，更不知是那個。到天明雞叫時分，秋菊</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
