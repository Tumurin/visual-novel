<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回　西門慶貪欲喪命　吳月娘失偶生兒</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來金蓮從後邊來，還沒睡，渾衣倒在炕上，等待</tspan><tspan x="90" dy="34">西門慶。聽見來了，連忙一骨碌扒起來，向前替他</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
