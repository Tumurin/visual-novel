    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="754" cy="208" r="59" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,448 L0,448 L207,326 L370,358 L532,322 L740,316 L914,310 L1097,312 L1200,398 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,476 L0,476 L158,393 L393,331 L573,342 L790,365 L935,424 L1095,475 L1200,422 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,599 L0,599 L140,450 L294,455 L517,495 L664,521 L899,423 L1043,504 L1195,412 L1200,437 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="453" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五回　吳月娘春晝鞦韆　來旺兒醉中謗仙</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">西門慶至晚來家，只見金蓮在房中雲鬟不整，睡搵</tspan><tspan x="90" dy="34">香腮，哭的眼壞壞的。問其所以，遂把來旺兒醉酒</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>