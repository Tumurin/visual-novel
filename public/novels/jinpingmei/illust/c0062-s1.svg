<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十二回　潘道士法遣黃巾士　西門慶大哭李瓶兒</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">潘道士進入角門，剛轉過影壁，將走到李瓶兒房穿</tspan><tspan x="90" dy="34">廊台基下，那道士往後退訖兩步，似有呵叱之狀，</tspan></text>
