<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾唱畢，放下樂器。吳銀兒先問月娘：“爹今日</tspan><tspan x="90" dy="34">請那幾位官客吃酒？”月娘道：“你爹今日請的都</tspan></text>
