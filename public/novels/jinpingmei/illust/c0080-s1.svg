<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十回　潘金蓮售色赴東床　李嬌兒盜財歸麗院</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來出殯之時，李桂卿同桂姐在山頭，悄悄對李嬌</tspan><tspan x="90" dy="34">兒如此這般：“媽說，你摸量你手中沒甚細軟東西</tspan></text>
