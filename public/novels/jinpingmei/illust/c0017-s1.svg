<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七回　宇給事劾倒楊提督　李瓶兒許嫁蔣竹山</text>
<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奉聖旨：“蔡京姑留輔政。王黼、楊戩著拿送三法</tspan><tspan x="90" dy="34">司，會問明白來說。欽此欽遵。”續該三法司會問</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
