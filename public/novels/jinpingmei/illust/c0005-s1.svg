<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回　捉姦情鄆哥定計　飲鴆藥武大遭殃</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說鄆哥提著籃兒，走入茶坊里來，向王婆罵道：</tspan><tspan x="90" dy="34">“老豬狗！你昨日為甚麼便打我？”那婆子舊性不</tspan></text>
