<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回　春梅嬌撒西門慶　畫童哭躲溫葵軒</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李嬌兒、孟玉樓眾人，都在月娘房裡裝定果盒，搽</tspan><tspan x="90" dy="34">抹銀器。因說：“大娘，你頭裡還要不出去，怎麼</tspan></text>
