<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十一回　兩孩兒聯姻共笑嬉　二佳人憤深同氣苦</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">頭裡兩個排軍，打著兩個大紅燈籠；後邊又是兩個</tspan><tspan x="90" dy="34">小廝，打著兩個燈籠。吳月娘在頭裡，李嬌兒、孟</tspan></text>
<g transform="translate(1070,545)">
