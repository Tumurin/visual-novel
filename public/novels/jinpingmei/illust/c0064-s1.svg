<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十四回　玉簫跪受三章約　書童私掛一帆風</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說眾人散了，已有雞唱時分，西門慶歇息去了。</tspan><tspan x="90" dy="34">玳安拿了一大壺酒、幾碟下飯，在鋪子里還要和傅</tspan></text>
