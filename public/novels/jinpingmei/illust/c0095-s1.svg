<text x="90" y="120" font-family="serif" font-size="54" fill="#222">金瓶梅詞話</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回　玳安兒竊玉成婚　吳典恩負心被辱</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">傅伙計拿狀子到巡簡司，實承望吳典恩看舊時分上</tspan><tspan x="90" dy="34">，領得頭面出來，不想反被吳典恩老狗奴才儘力罵</tspan></text>
