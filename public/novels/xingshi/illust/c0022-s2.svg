<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">師曰：「第一件，到中原之地，休尋和尚鬧，依得</tspan><tspan x="90" dy="34">麼？」洞賓曰：「依得。」師曰：「第二件，將吾</tspan></text>
