<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不數日，忽中夜聞外切切有聲。帝急起，衣冠御內</tspan><tspan x="90" dy="34">殿，坐未久，左右伏兵俱起。司馬德戡攜白刃向帝</tspan></text>
