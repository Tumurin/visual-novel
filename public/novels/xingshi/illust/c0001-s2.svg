<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一卷</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話休絮煩。再說月香小姐自那日進了鍾離相公衙內</tspan><tspan x="90" dy="34">，次日，夫人吩咐新來婢子，將中堂打掃。月香領</tspan></text>
