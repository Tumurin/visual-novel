<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說朱常引家人媳婦，扛著尸首趕到趙家，一路打</tspan><tspan x="90" dy="34">將進去。直到堂中，見四面門戶緊閉，并無一個人</tspan></text>
