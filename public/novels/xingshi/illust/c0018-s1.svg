<text x="90" y="120" font-family="serif" font-size="54" fill="#222">醒世恆言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八卷</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">今年看了十五筐，這園上桑又不曾增一棵兩棵，如</tspan><tspan x="90" dy="34">今夠了自家，尚餘許多，卻好又濟了老哥之用。這</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
