<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">可憐張藎從小在綾羅堆裡滾大的，就捱著線結也還</tspan><tspan x="90" dy="34">過不去，如何受得這等刑罰。夾棍剛套上腳，就殺</tspan></text>
