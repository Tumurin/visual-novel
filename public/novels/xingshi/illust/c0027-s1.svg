<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七卷</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不則一日，已至陝西地面，安營下寨，等大軍到來</tspan><tspan x="90" dy="34">，一齊進發。與賊兵連戰數陣，互相勝負。到七月</tspan></text>
