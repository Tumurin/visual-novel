<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">五鼓時，美娘酒醒，已知鴇兒用計，破了身子。自</tspan><tspan x="90" dy="34">憐紅頻命薄，遭此強橫，起來解手，穿了衣服，自</tspan></text>
