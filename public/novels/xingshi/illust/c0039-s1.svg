<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">汪大尹見事已定，差刑房吏帶領兵快，到監查驗，</tspan><tspan x="90" dy="34">將應有兵器，盡數搜出，當堂呈看。汪大尹大怒，</tspan></text>
