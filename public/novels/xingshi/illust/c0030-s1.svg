<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">但他來時，合衙門人通曉得，明日不見了，豈不疑</tspan><tspan x="90" dy="34">惑？況那尸首也難出脫。」貝氏道：「這個何難？</tspan></text>
