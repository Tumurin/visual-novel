<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到明早起身，程萬里思想：「張萬戶教他來試我，</tspan><tspan x="90" dy="34">我今日偏要當面說破，固住了他的念頭，不來提防</tspan></text>
