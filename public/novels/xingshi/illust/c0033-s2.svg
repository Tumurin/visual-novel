<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到得劉官人門首，好一場熱鬧。小娘子入去看時，</tspan><tspan x="90" dy="34">只見劉官人斧劈倒在地死了，床上十五賞錢分文也</tspan></text>
