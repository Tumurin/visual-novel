<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">王臣吃了夜飯，到房中安息。自想野狐忍痛來掇賺</tspan><tspan x="90" dy="34">這冊書，必定有些妙處，愈加珍秘。至三更時分，</tspan></text>
