<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">子春暗暗喜道：「如今天色已霽，想再沒有甚麼驚</tspan><tspan x="90" dy="34">嚇我了。」豈知前次那金甲大將軍，依舊帶領人馬</tspan></text>
