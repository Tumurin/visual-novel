<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">少時，一干百姓都喘喘跪下稟道：“這火是焦家一</tspan><tspan x="90" dy="34">個學生好放花炮，將炮紙落在草垛上，烘的着了。</tspan></text>
