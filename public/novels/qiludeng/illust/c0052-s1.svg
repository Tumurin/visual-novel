<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十二回　譚紹聞入夢遭嚴譴　董縣主受賄徇私情</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">桌上殘燈未熄，孤焰閃閃，譙樓更鼓頻擊，遙聽鼕</tspan><tspan x="90" dy="34">鼕，已交三更。方覺睡魔來襲，只聽得有人拍門，</tspan></text>
