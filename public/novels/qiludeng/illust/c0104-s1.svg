<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一〇四回　譚貢士籌兵煙火架　王都堂破敵普陀山</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">將近冬月，譚紹聞吩咐，明年新正元宵節，要在定</tspan><tspan x="90" dy="34">海寺門前放煙火架，請本省最好的煙火匠來問話。</tspan></text>
