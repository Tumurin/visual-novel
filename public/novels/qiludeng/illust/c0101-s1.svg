<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一〇一回　盛希瑗觸忿邯鄲縣　婁厚存探古趙州橋</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">午後，到臨洺關，同謁冉伯牛祠，還說有伯牛墓。</tspan><tspan x="90" dy="34">譚紹聞道：“‘伯牛有疾’，見於《魯論》。伯牛</tspan></text>
