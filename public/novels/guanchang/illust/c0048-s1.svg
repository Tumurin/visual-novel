<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十九回    焚遣財傷心說命婦　造揭帖密計遣群姬</text>
<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張守財一介武夫，本元雖足，到底年輕的時候，打</tspan><tspan x="90" dy="34">過仗，受過傷，到了中年，斫喪過度，如今已是暮</tspan></text>
