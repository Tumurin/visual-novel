<text x="90" y="120" font-family="serif" font-size="54" fill="#222">官場現形記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回    老吏斷獄著著爭先　捕快查贓頭頭是道</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說建德縣知縣莊大老爺自在統領船上赴宴之後，</tspan><tspan x="90" dy="34">辭別進城。一到衙前，果見人頭擁擠。剛才進得大</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
