<text x="90" y="120" font-family="serif" font-size="54" fill="#222">官場現形記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回    急張羅州官接巡撫　少訓練副將降都司</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">閑話休題。但說那撫院轎子上得演武廳，大小官員</tspan><tspan x="90" dy="34">接著。撫院下轎，先到後面歇息。營務處上洪大人</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
