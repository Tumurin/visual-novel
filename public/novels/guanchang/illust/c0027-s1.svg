<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回    待罪天牢有心下石　趨公郎署無意分金</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孔、王兩個這日見軍門進監之後，內外膜不通氣，</tspan><tspan x="90" dy="34">諒係人情未曾托到，一時走頭無路，便急急奔到順</tspan></text>
