<text x="90" y="120" font-family="serif" font-size="54" fill="#222">官場現形記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十二回    設陷阱借刀殺人　割靴腰隔船吃醋</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說龍珠走進中艙之後，別人還不關心，只有文七</tspan><tspan x="90" dy="34">爺的眼尖，頭一個先望見。陡見龍珠兩只眼睛哭的</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
