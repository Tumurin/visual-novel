<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">各位司、道下來之後，齊巧有兩個新到的候補道上</tspan><tspan x="90" dy="34">來稟見。這兩個候補道，一個姓劉，是南京人。他</tspan></text>
