<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二回    叩轅門蕩婦覓情郎　奉板輿慈親勖孝子</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">停了一刻，湯升穿了長褂子上來。傅撫院正要問他</tspan><tspan x="90" dy="34">，一想守著多少人，說出來不便，便起身要帶湯升</tspan></text>
