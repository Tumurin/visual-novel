<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">公陰與謀，馳書與所善之王太史，而致九郎焉。王</tspan><tspan x="90" dy="34">會其意，大設，招撫公飲。命九郎飾女郎，作天魔</tspan></text>
