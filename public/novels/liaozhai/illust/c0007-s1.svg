<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">過歲將如江西，投臬司幕。詣柳問蔔，柳言：“大</tspan><tspan x="90" dy="34">吉！”周笑曰：“我意無他，但薄有所獵，當購佳</tspan></text>
