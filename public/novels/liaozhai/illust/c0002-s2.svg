<text x="90" y="180" font-family="serif" font-size="30" fill="#555">卷二</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">生乘間語父，欲往相之，而隱饋金不敢告。翁自度</tspan><tspan x="90" dy="34">無資，以是故止之。生又婉言：“試可乃已。”翁</tspan></text>
