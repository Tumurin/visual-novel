<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">生少年負義，憤不自持，大呼曰：“慘毒如此，成</tspan><tspan x="90" dy="34">何世界！”鬼王驚起，暫命止割，蹺履迎生。生忿</tspan></text>
