<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">異史氏曰：“陰司之刑慘於陽世，責亦苛於陽世。</tspan><tspan x="90" dy="34">然關說不行，則受殘酷者不怨也。誰謂夜台無天日</tspan></text>
