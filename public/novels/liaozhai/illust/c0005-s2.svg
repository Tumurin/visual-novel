<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">轉思秋月，想念頗煩，遂複南下至舊閣，秉燭久待</tspan><tspan x="90" dy="34">，女竟不至。朦朧欲寢，見一婦人來，曰：“秋月</tspan></text>
