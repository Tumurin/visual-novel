<text x="90" y="120" font-family="serif" font-size="54" fill="#222">聊齋誌異</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">卷五</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">陳歡樂，潞之長治人，有女慧美。一道士行乞，睨</tspan><tspan x="90" dy="34">之而去。由是日持缽近廛間。適一瞽人自陳家出，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>