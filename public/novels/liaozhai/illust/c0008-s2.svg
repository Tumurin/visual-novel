<text x="90" y="180" font-family="serif" font-size="30" fill="#555">卷八</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一日，自外至，潛聽久之，乃開鎖啟扉，惟恐其響</tspan><tspan x="90" dy="34">，悄然掩入。見一男子貂冠臥床上，忿怒，取刀奔</tspan></text>
<g transform="translate(1070,545)">
