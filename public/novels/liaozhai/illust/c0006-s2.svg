<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">楊萬石，大名諸生也，生平有“季常之懼”。妻尹</tspan><tspan x="90" dy="34">氏，奇悍，少迕之，輒以鞭撻從事。楊父年六十餘</tspan></text>
