<text x="90" y="180" font-family="serif" font-size="30" fill="#555">卷七</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鞏道人，無名字，亦不知何里人。嚐求見魯王，閽</tspan><tspan x="90" dy="34">人不爲通。有中貴人出，揖求之，中貴見其鄙陋，</tspan></text>
