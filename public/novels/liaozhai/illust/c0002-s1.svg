<text x="90" y="180" font-family="serif" font-size="30" fill="#555">卷二</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誠漸長，性孝友，不忍兄劬，陰勸母；母弗聽。一</tspan><tspan x="90" dy="34">日訥入山樵，未終，值大風雨，避身岩下，雨止而</tspan></text>
