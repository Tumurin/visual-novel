<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">吳藩未叛時，嚐諭將士：有獨力能擒一虎者，優以</tspan><tspan x="90" dy="34">廪祿，號“打虎將”。將中一人名保住，健捷如猱</tspan></text>
