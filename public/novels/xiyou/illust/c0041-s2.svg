<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四一回     心猿遭火敗　木母被魔擒</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">大聖道：「等我捻著訣，鑽入火中。」掄鐵棒，尋</tspan><tspan x="90" dy="34">妖要打。那妖見他來到，將一口煙劈臉噴來。行者</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
