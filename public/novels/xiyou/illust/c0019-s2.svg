<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十九回     雲棧洞悟空收八戒　浮屠山玄奘受心經</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者聞言，收了鐵棒道：「獃子不要說嘴，老孫把</tspan><tspan x="90" dy="34">這頭伸在那裏，你且築一下兒，看可能魂消氣泄？</tspan></text>
