<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二七回     屍魔三戲唐三藏　聖僧恨逐美猴王</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三藏自此一言，就是晦氣到了。果然信那獃子攛唆</tspan><tspan x="90" dy="34">，手中捻訣，口裏念咒。行者就叫：「頭疼，頭疼</tspan></text>
