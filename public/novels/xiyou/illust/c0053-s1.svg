<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五三回     禪主吞餐懷鬼孕　黃婆運水解邪胎</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">真仙聞言，喜孜孜滿懷春意，笑盈盈一陣威風，挺</tspan><tspan x="90" dy="34">如意鉤子，走出門來喝道：「潑猢猻！你又來作甚</tspan></text>
