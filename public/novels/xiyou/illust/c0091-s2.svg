<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九一回     金平府元夜觀燈　玄英洞唐僧供狀</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此夜正是十五元宵。眾僧道：「老師父，我們前晚</tspan><tspan x="90" dy="34">只在荒山與關廂看燈，今晚正節，進城看看金燈如</tspan></text>
