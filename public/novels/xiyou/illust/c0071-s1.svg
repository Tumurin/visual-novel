<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七一回     行者假名降怪　觀音現像伏妖王</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者笑道：「你這個誑上欺君的潑怪，原來沒眼。</tspan><tspan x="90" dy="34">想我五百年前大鬧天宮時，九天神將見了我，無一</tspan></text>
