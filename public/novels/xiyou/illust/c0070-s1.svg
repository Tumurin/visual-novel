<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者見了，公然傲慢那妖精，更不循一些兒禮法：</tspan><tspan x="90" dy="34">調轉臉，朝著外，只管敲鑼。妖王問道：「你來了</tspan></text>
