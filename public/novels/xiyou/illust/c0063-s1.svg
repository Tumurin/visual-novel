<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六三回     二僧蕩怪鬧龍宮　群聖除邪獲寶貝</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一場，被八戒把玳瑁屏打得粉碎，珊瑚樹摜得凋</tspan><tspan x="90" dy="34">零。那九頭蟲將公主安藏在內，急取月牙鏟，趕至</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
