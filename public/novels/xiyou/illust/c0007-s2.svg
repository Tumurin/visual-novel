<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話表齊天大聖被眾天兵押去斬妖臺下，綁在降妖柱</tspan><tspan x="90" dy="34">上，刀砍斧剁，槍刺劍刳，莫想傷及其身。南斗星</tspan></text>
