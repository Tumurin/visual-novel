<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八○回     女育陽求配偶　心猿護主識妖邪</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說大聖縱觔斗，到了半空，定雲光，回頭觀看，</tspan><tspan x="90" dy="34">只見松林中祥雲縹緲，瑞靄氤氳。他忽失聲叫道：</tspan></text>
