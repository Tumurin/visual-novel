<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回     四海千山皆拱伏　九幽十類盡除名</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">下面又有葛仙翁天師啟奏道：「萬歲，有冥司秦廣</tspan><tspan x="90" dy="34">王?奉幽冥教主地藏王菩薩表文進上。」傍有傳言</tspan></text>
