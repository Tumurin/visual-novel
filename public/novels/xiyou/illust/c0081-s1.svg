<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八一回     鎮海寺心猿知怪　黑松林三眾尋師</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說行者鬥得心焦性燥，閃一個空，一棍把那妖精</tspan><tspan x="90" dy="34">打落下來，乃是一隻花鞋。行者曉得中了他計，連</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
