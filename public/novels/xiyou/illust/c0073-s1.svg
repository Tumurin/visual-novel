<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者止不住腳，近前叫道：「毘藍婆菩薩，問訊了</tspan><tspan x="90" dy="34">。」那菩薩即下榻，合掌回禮道：「大聖，失迎了</tspan></text>
