<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四六回     外道弄強欺正法　心猿顯聖滅諸邪</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">慌得那兩班文武上前來奏道：「萬歲，那和尚不曾</tspan><tspan x="90" dy="34">死，又在油鍋裏鑽出來了。」監斬官恐怕虛誑朝廷</tspan></text>
