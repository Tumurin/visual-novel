<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回     官封弼馬心何足　名注齊天意未寧</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">悟空迎近前來問曰：「你是誰家小哥？闖近吾門，</tspan><tspan x="90" dy="34">有何事幹？」哪吒喝道：「潑妖猴！豈不認得我？</tspan></text>
