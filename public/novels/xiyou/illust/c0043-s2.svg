<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四三回     黑河妖孽擒僧去　西洋龍子捉鼉回</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那怪喝道：「是甚人在此打我門哩？」沙僧道：「</tspan><tspan x="90" dy="34">我把你個無知的潑怪！你怎麼弄玄虛，變作梢公，</tspan></text>
