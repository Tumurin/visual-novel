<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八一回     鎮海寺心猿知怪　黑松林三眾尋師</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者聽得此言，忍不住呵呵大笑道：「師父，你忒</tspan><tspan x="90" dy="34">不濟，略有些些病兒，就起這個意念。你若是病重</tspan></text>
