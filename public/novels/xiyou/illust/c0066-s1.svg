<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六六回     諸神遭毒手　彌勒縛妖魔</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說那黃眉大王聚眾怪在寶閣下說：「孫行者這兩</tspan><tspan x="90" dy="34">日不來，又不知往何方去借兵也。」說不了，只見</tspan></text>
