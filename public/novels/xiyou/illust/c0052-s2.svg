<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五二回     悟空大鬧金洞　如來暗示主人公</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者見他關防得緊，寶貝又隨身，不肯除下，料偷</tspan><tspan x="90" dy="34">他的不得。跳下床來，還變做促織兒，出了房門，</tspan></text>
