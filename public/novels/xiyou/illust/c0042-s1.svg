<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不多時，早到了本處。快如風、急如火撞進洞裏：</tspan><tspan x="90" dy="34">「報大王：老大王爺爺來了。」妖王歡喜道：「你</tspan></text>
