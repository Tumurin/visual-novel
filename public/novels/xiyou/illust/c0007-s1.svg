<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七回     八卦爐中逃大聖　五行山下定心猿</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那二聖得了旨，徑到靈山勝境雷音寶剎之前，對四</tspan><tspan x="90" dy="34">金剛、八菩薩禮畢，即煩轉達。眾神隨至寶蓮臺下</tspan></text>
