<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二五回     鎮元仙趕捉取經僧　孫行者大鬧五莊觀</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你看那些道童害怕，丟了皮鞭，報道：「師父呵，</tspan><tspan x="90" dy="34">為頭打的是大唐和尚，這一會打的都是柳樹之根。</tspan></text>
