<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八○回     女育陽求配偶　心猿護主識妖邪</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">唐僧回至林裏，教八戒解了上半截繩子，用鈀築出</tspan><tspan x="90" dy="34">下半截身子。那怪跌跌鞋，束束裙，喜孜孜跟著唐</tspan></text>
