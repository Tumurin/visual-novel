<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七六回     心神居舍魔歸性　木母同降怪體真</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">好大聖，把鐵棒一路丟開解數，打將出去。那獃子</tspan><tspan x="90" dy="34">忍著麻，只得跟定他。只看見二門下靠著的是他的</tspan></text>
