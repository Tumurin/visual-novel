<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回     觀音赴會問原因　小聖施威降大聖</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這大聖與惠岸戰經五六十合，惠岸臂膊酸麻，不能</tspan><tspan x="90" dy="34">迎敵，虛幌一幌，敗陣而走。大聖也收了猴兵，安</tspan></text>
