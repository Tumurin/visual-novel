<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六八回     朱紫國唐僧論前世　孫行者施為三折肱</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說那樓下眾人見風起時，各各蒙頭閉眼。不覺風</tspan><tspan x="90" dy="34">過時，沒了皇榜，眾皆悚懼。那榜原有十二個太監</tspan></text>
<g transform="translate(1070,545)">
