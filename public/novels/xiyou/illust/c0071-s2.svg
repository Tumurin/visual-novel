<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七一回     行者假名降怪　觀音現像伏妖王</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那妖王聽他說出悟空行者，遂道：「你原來是大鬧</tspan><tspan x="90" dy="34">天宮的那廝。你既脫身保唐僧西去，你走你的路去</tspan></text>
