<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六六回     諸神遭毒手　彌勒縛妖魔</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者稱謝，即同四將並小張太子，又駕雲回小西天</tspan><tspan x="90" dy="34">，直至小雷音寺。小張太子使一條楮白槍，四大將</tspan></text>
