<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二八回     花果山群妖聚義　黑松林三藏逢魔</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說那大聖雖被唐僧逐趕，然猶思念感嘆不已，早</tspan><tspan x="90" dy="34">望見東洋大海，道：「我不走此路者，已五百年矣</tspan></text>
