<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九七回     金酬外護遭魔蟄　聖顯幽魂救本原</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且不言唐僧等在華光破屋中苦耐夜雨存身。卻說銅</tspan><tspan x="90" dy="34">臺府地靈縣城內有夥兇徒，因宿娼、飲酒、賭博，</tspan></text>
