<text x="90" y="120" font-family="serif" font-size="54" fill="#222">西遊記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九八回     猿熟馬馴方脫殼　功成行滿見真如</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">頂摩霄漢中，根接須彌脈。巧峰排列，怪石參差。</tspan><tspan x="90" dy="34">懸崖下瑤草琪花，曲徑傍紫芝香蕙。仙猿摘果入桃</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
