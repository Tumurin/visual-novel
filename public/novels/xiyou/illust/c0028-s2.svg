<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二八回     花果山群妖聚義　黑松林三藏逢魔</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這獃子認真就要進去。沙僧一把扯住道：「哥呵，</tspan><tspan x="90" dy="34">他哄你哩，你幾時又吃人肉哩？」獃子卻才省悟，</tspan></text>
