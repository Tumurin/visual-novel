<text x="90" y="120" font-family="serif" font-size="54" fill="#222">西遊記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六一回     豬八戒助力敗魔王　孫行者三調芭蕉扇</text>
<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那八戒抖搜精神，束一束皂錦直裰，搴著鈀，即與</tspan><tspan x="90" dy="34">土地縱起雲霧，徑回東方而去。正行時，忽聽得喊</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
