<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一○回     老龍王拙計犯天條　魏丞相遺書託冥吏</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至次日，點札風伯、雷公、雲童、電母，直至長安</tspan><tspan x="90" dy="34">城九霄空上。他挨到那巳時方布雲，午時發雷，未</tspan></text>
