<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七四回     長庚傳報魔頭狠　行者施為變化能</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不數里，忽見一座筆峰。何以謂之筆峰？那山頭上</tspan><tspan x="90" dy="34">長出一條峰來，約有四五丈高，如筆插在架上一般</tspan></text>
