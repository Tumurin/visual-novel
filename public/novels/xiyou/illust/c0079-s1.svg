<text x="90" y="120" font-family="serif" font-size="54" fill="#222">西遊記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七九回     尋洞擒妖逢老壽　當朝正主救嬰兒</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻抽身，騰雲就起，被行者翻觔斗，跳在空中喝道</tspan><tspan x="90" dy="34">：「那裏走？吃吾一棒。」那國丈即使蟠龍拐杖來</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
