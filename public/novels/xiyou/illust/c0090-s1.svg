<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那宮門立著一個穿霓帔的仙童，忽見孫大聖，即入</tspan><tspan x="90" dy="34">宮報道：「爺爺，外面是鬧天宮的齊天大聖來了。</tspan></text>
