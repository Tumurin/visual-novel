<text x="90" y="120" font-family="serif" font-size="54" fill="#222">西遊記</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一七回     孫行者大鬧黑風山　觀世音收伏熊羆怪</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說行者攻門不開，也只得回觀音院。那本寺僧人</tspan><tspan x="90" dy="34">已葬埋了那老和尚，都在方丈裏伏侍唐僧。早齋已</tspan></text>
