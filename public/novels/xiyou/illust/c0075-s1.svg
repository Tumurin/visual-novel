<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七五回     心猿鑽透陰陽體　魔王還歸大道真</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說大聖到了瓶中，被那寶貝將身束得小了，索性</tspan><tspan x="90" dy="34">變化，蹲在當中。半晌，那邊蔭涼，忽失聲笑道：</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
