<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五九回     唐三藏路阻火焰山　孫行者一調芭蕉扇</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那師父爬上馬，與八戒、沙僧，復東來有二十餘里</tspan><tspan x="90" dy="34">，方才歇下，道：「悟空，如何了呀？」行者丟下</tspan></text>
