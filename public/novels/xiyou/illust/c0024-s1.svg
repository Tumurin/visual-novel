<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二四回     萬壽山大仙留故友　五莊觀行者竊人參</text>
<text x="90" y="562" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三藏離鞍下馬，又見那山門左邊有一通碑，碑上有</tspan><tspan x="90" dy="34">十個大字，乃是「萬壽山福地，五莊觀洞天」。長</tspan></text>
