<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者道：「你說他是馬哩，他不是凡馬，本是西海</tspan><tspan x="90" dy="34">龍王敖閏之子，喚名龍馬三太子。只因縱火燒了殿</tspan></text>
