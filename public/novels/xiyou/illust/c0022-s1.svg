<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二二回     八戒大戰流沙河　木叉奉法收悟淨</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一場，來來往往，鬥經三十回合，不見強弱。八</tspan><tspan x="90" dy="34">戒又使個佯輸計，拖了鈀走。那怪隨後又趕來，擁</tspan></text>
