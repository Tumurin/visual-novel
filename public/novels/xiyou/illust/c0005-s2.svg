<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回     亂蟠桃大聖偷丹　反天宮諸神捉怪</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那四大天王收兵罷戰，眾各報功：有拿住虎豹的，</tspan><tspan x="90" dy="34">有拿住獅象的，有拿住狼蟲狐?的。更不曾捉著一</tspan></text>
