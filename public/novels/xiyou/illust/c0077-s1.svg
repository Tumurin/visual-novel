<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七七回     群魔欺本性　一體拜真如</text>
<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">大聖即按雲頭，徑至城上，腳踏著垛兒罵道：「潑</tspan><tspan x="90" dy="34">孽畜！快出來與老孫交戰。」慌得那城樓上小妖急</tspan></text>
