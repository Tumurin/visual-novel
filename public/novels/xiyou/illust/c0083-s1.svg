<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八三回     心猿識得丹頭　姹女還歸本性</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者真個隨著金星，縱雲頭，早至雲樓宮。原來是</tspan><tspan x="90" dy="34">天王住宅，號雲樓宮。金星見宮門首有個童子侍立</tspan></text>
