<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回     觀音院唐僧脫難　高老莊大聖除魔</text>
<text x="90" y="562" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行者暗喜道：「那怪卻也老實，不用動刑，就供得</tspan><tspan x="90" dy="34">這等明白。既有了地方、姓名，不管怎的也拿住他</tspan></text>
