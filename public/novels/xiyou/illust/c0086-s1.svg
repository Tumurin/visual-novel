<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八六回     木母助威征怪物　金公施法滅妖邪</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這大聖與八戒急退幾步，到那山場平處，抵住群妖</tspan><tspan x="90" dy="34">，喝道：「那個是出名的頭兒？那個是拿我師父的</tspan></text>
