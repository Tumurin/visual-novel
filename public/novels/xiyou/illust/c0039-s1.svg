<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三九回     一粒丹砂天上得　三年故主世間生</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">好大聖，此時有半夜時分，別了他師徒三眾，縱觔</tspan><tspan x="90" dy="34">斗雲，只入南天門裏。果然也不謁靈霄寶殿，不上</tspan></text>
