<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三一回     豬八戒義激猴王　孫行者智降妖怪</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說那八戒停立空中，看見沙僧出洞，即按下雲頭</tspan><tspan x="90" dy="34">，叫聲：「沙兄弟，心忍，心忍。」沙僧見身道：</tspan></text>
