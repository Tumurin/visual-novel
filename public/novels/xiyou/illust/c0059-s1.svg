<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五九回     唐三藏路阻火焰山　孫行者一調芭蕉扇</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那羅剎出門，高叫道：「孫悟空何在？」行者上前</tspan><tspan x="90" dy="34">，躬身施禮道：「嫂嫂，老孫在此奉揖。」羅剎咄</tspan></text>
