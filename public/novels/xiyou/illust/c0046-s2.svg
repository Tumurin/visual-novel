<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三藏正要開言，聽得那羊力大仙道：「貧道先猜，</tspan><tspan x="90" dy="34">是一顆仙桃。」三藏猜道：「不是桃，是個光桃核</tspan></text>
