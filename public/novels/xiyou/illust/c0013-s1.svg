<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一三回     陷虎穴金星解厄　　雙叉嶺伯欽留僧</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">伯欽的母親聞說，叫道：「孩兒不要與長老閑講，</tspan><tspan x="90" dy="34">我自有素物，可以管待。」伯欽道：「素物何來？</tspan></text>
