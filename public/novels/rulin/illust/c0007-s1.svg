<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">壇話說匡太公自從儿子上府去考，尿屎仍舊在床上</tspan><tspan x="90" dy="34">。他去了二十多日，就如去了兩年的一般，每日眼</tspan></text>
