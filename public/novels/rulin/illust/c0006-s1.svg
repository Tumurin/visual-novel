<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　大柳庄孝子事親　樂清縣賢宰愛士話說匡超人望見自</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">己家門．心里歡喜，兩步做一步，急急走來敲門。</tspan><tspan x="90" dy="34">母親听見是他的聲音，開門迎了出來，看見道：“</tspan></text>
