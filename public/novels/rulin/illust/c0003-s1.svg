<text x="90" y="120" font-family="serif" font-size="54" fill="#222">儒林外史</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回　蘧駪夫求賢問業　馬純上仗義疏財話說婁府兩公子將五百兩銀子送了俠客</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">，与他報謝恩人，把革囊人頭放在家里。兩公子雖</tspan><tspan x="90" dy="34">系相府，不怕有意外之事，但血淋淋一個人頭丟在</tspan></text>
<g transform="translate(1070,545)">
