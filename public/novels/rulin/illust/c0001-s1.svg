<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“人生南北多歧路，將相神仙，也要凡人做。百代</tspan><tspan x="90" dy="34">興亡朝复暮，江風吹倒前朝樹。功名富貴無憑据，</tspan></text>
