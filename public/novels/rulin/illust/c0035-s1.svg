<text x="90" y="120" font-family="serif" font-size="54" fill="#222">儒林外史</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回　敦友誼代兄受過　講堪輿回家葬親</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">睡到四更時分，門外一片聲大喊，兩弟兄一齊惊覺</tspan><tspan x="90" dy="34">，看見窗外通紅，知道是對門失火。慌忙披了衣裳</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
