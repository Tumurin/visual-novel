<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十三回　嶽元帥大破五方陣楊再興誤走小商河</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">前言不表，閒話慢提。單說岳元帥帶領大兵，齊出</tspan><tspan x="90" dy="34">潭州城外，紮下大營。是日，元帥升帳，聚集一班</tspan></text>
