<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裏宗澤見李綱覆命，慌忙差人打聽動靜。早已報</tspan><tspan x="90" dy="34">知，朝廷現將王鐸拿下天牢，今李綱復來宣召。只</tspan></text>
