<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說馮忠、馮孝，解了岳家家屬，到了臨安，安頓</tspan><tspan x="90" dy="34">驛中，即來報知秦檜。秦檜假傳一道旨意出來，把</tspan></text>
