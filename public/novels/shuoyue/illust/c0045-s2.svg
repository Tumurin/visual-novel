<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回　掘通老鶴河兀朮逃生遷都臨安郡岳飛歸裏</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">八盤山戰敗，青龍山戰敗，渡黃河至愛華山戰敗，</tspan><tspan x="90" dy="34">被嶽南蠻追至長江，死了多少兵將，逃命過江，回</tspan></text>
