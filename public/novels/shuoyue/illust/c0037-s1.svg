<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十七回　五通神顯靈航大海宋康王被困牛頭山</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日早上，衆將到靈官殿前，但見掛着一張榜</tspan><tspan x="90" dy="34">文，上寫着：武昌開國公少保統屬文武都督大元帥</tspan></text>
