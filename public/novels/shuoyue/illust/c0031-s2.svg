<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，嶽元帥率領衆將帶領大兵，直至康郎山下，</tspan><tspan x="90" dy="34">三聲炮響，列成陣勢。羅、萬二頭領亦領衆嘍羅下</tspan></text>
