<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回　施岑收服烏靈聖母牛皋氣死完顏兀朮</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">嶽雷方欲上前，旁邊閃過關鈴，大叫：“元帥請住</tspan><tspan x="90" dy="34">馬，待小將去擒來。”舉起青龍僵月刀，跑動赤兔</tspan></text>
