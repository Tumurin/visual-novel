<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回　山獅駝兵阻界山楊繼周力敵番將</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一陣，殺得那些金兵馬仰人翻，尋爹覓子。五十</tspan><tspan x="90" dy="34">萬金兵，倒殺去大半。兀朮大敗虧輸，帶領殘兵敗</tspan></text>
