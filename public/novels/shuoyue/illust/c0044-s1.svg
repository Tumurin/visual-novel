<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">元帥因走了兀朮，退回後營，悶悶不樂。梁夫人道</tspan><tspan x="90" dy="34">：“兀朮雖敗，糧草無多，必然急速要回。乘我小</tspan></text>
