<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回　劉豫恃寵張珠蓋曹榮降賊獻黃河</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">先有探軍報至朝中，奏道：“岳飛出城，那一班人</tspan><tspan x="90" dy="34">不戰而自綁。”不多時，嶽爺來至午門，進朝上殿</tspan></text>
