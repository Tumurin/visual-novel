<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不多一會，週三畏取出監中各犯，到大理寺堂上綁</tspan><tspan x="90" dy="34">起，判了“斬”字。劊子手左右服侍，軍校在前，</tspan></text>
