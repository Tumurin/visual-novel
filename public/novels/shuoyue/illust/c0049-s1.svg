<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三人俱打得頭青臉腫，冒着險拚命跑出大門外邊。</tspan><tspan x="90" dy="34">雷家五將左右殺來。嶽爺三人正在招架廝殺，忽聽</tspan></text>
