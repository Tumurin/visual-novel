<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回　兀朮施恩養秦檜苗傅銜怨殺王淵</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">劉正彥辭了苗傅，上馬回衙，暗傳號令，命本部兵</tspan><tspan x="90" dy="34">卒準備器械，飽食酒飯。到了三更時分，二人率領</tspan></text>
