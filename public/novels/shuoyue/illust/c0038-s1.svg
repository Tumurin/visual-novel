<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說話的，那牛皋來時是連夜走的，故此來得快。此</tspan><tspan x="90" dy="34">時回去有了糧車，須要晝行夜住，那能就到。這日</tspan></text>
