<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　下假書哈迷蚩割鼻破潞安陸節度盡忠</text>
<text x="90" y="531" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">哈迷蚩得了性命，奔過吊橋，掩面回營，來見兀朮</tspan><tspan x="90" dy="34">。兀朮見他渾身血跡，問道：“軍師爲何如此？”</tspan></text>
