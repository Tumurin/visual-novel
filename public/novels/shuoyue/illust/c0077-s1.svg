<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">牛皋上馬提鐧，一路迎將上去。那河間守備孫蘭，</tspan><tspan x="90" dy="34">正與金將尤可榮廝殺，正在危急，牛皋上前大喝一</tspan></text>
