<path d="M0,675 L0,439 L0,439 L166,405 L333,406 L548,398 L779,407 L954,368 L1114,338 L1200,303 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,507 L0,507 L142,444 L332,408 L517,394 L724,388 L955,341 L1200,460 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,596 L0,596 L144,538 L325,425 L525,507 L737,389 L997,543 L1149,393 L1200,479 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="451" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">說岳全傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回　牛皋酒醉破番兵金節夢虎諧婚匹詞曰：這香醪，調和麴櫱多加料。須知不飲旁人笑。杯翻囗例，酣醉破番獠。</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金節上城觀看，那牛皋坐在馬上，猶如死的一般。</tspan><tspan x="90" dy="34">只見金邦元帥斬着摩利之身長一丈，用一條渾鐵棍</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>