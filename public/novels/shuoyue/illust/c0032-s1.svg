<text x="90" y="120" font-family="serif" font-size="54" fill="#222">說岳全傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回　牛皋酒醉破番兵金節夢虎諧婚匹詞曰：這香醪，調和麴櫱多加料。須知不飲旁人笑。杯翻囗例，酣醉破番獠。</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">莊丁聽了，慌忙進來報與太公。孟太公聞言想道：</tspan><tspan x="90" dy="34">“劉豫這奸臣投了外邦，他兒子連父親的相知都不</tspan></text>
<g transform="translate(1070,545)">
