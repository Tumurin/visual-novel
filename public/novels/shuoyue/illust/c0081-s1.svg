<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十回　表精忠墓頂加封證因果大鵬歸位</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">先說那嶽雷追殺金兵一陣，鳴金收軍。陸文龍擒得</tspan><tspan x="90" dy="34">哈迷蚩來獻，關鈴擒得金將白眼骨都來獻，伍連取</tspan></text>
