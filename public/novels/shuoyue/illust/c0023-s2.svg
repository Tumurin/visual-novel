<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回　胡先奉令探功績岳飛設計敗金兵</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">銅先文郎保着粘罕，拚命逃出谷口，卻是一條大路</tspan><tspan x="90" dy="34">。這時已是五更時分了，粘罕出得夾山道，不覺仰</tspan></text>
