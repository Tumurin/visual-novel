<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回　破兵船岳飛定計襲洞庭楊虎歸降</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那邊小嘍羅飛報上山，兩個大王仍命餘化龍下山討</tspan><tspan x="90" dy="34">戰。嶽元帥命衆將士一齊放箭，堅守營寨，不與交</tspan></text>
