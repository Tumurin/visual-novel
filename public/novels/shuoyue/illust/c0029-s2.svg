<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="說岳全傳">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="754" cy="221" r="63" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,420 L0,420 L161,368 L356,409 L540,323 L692,338 L929,378 L1154,383 L1200,303 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,501 L0,501 L187,420 L396,397 L597,394 L802,354 L977,380 L1158,421 L1200,456 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,594 L0,594 L200,409 L402,527 L561,531 L756,554 L909,433 L1080,444 L1200,499 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="421" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">說岳全傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十九回　嶽元帥單身探賊耿明達兄弟投誠詞曰：世事有常有變，英雄能弱能強。從來海水斗難量。壯懷昭日月，浩氣凜秋霜。</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那一年來了這個楊虎，聚集人衆，霸佔了洞庭山，</tspan><tspan x="90" dy="34">就不容人在湖內打魚。因此小人和他打過了幾仗。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>