<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奉令把守天長關，因拿了一個假兀朮，故此綁在這</tspan><tspan x="90" dy="34">裏要處斬。”韓元帥道：“刀下留人！不許動手！</tspan></text>
