<text x="90" y="120" font-family="serif" font-size="54" fill="#222">說岳全傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十回　靈隱寺進香瘋僧遊戲衆安橋行刺義士捐軀</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">秦檜看罷，大怒道：“你這狗才！日前拿道悅和尚</tspan><tspan x="90" dy="34">，你卻賣放。今又放走了瘋行者，卻將這區兒來搪</tspan></text>
