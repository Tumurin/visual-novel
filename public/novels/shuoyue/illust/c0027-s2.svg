<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說吉青也不知兀朮在那裏，肚內尋思：“叫我何</tspan><tspan x="90" dy="34">處尋他？”蹲着頭只望着大路上走去。忽聽前邊馬</tspan></text>
