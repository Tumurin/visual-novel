<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　述往事王佐獻圖明邪正曹寧弒父</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當時惱了小將張憲，請令出戰，元帥應允。張憲提</tspan><tspan x="90" dy="34">槍上馬，來至陣前討戰，坐名要曹寧出馬。曹寧得</tspan></text>
