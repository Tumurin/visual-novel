<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日，萬汝威與羅輝傳令衆嘍羅緊守三關，專</tspan><tspan x="90" dy="34">候二位大王親自下山與岳飛決戰。且說楊虎不走旱</tspan></text>
