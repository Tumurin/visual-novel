<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說岳爺打了岳雲，又戰不下楊再興，心中悶悶不</tspan><tspan x="90" dy="34">樂，就在帳中靠着桌上矇矓睡去。忽見小校報說：</tspan></text>
