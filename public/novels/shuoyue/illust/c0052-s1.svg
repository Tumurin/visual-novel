<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十二回　嚴成方較錘結義戚統制暗箭報仇詞曰</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說岳公子收兵回城，進帥府來見元帥道：“爹爹</tspan><tspan x="90" dy="34">，該斬孩兒之首。”元帥問道：“你卻爲着何事？</tspan></text>
