<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十八回　再放報仇箭戚方殞命大破金龍陣關鈴逞能</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只一陣，殺得那兀朮大敗虧輸，往下敗走。衆營頭</tspan><tspan x="90" dy="34">立腳不住，一齊棄寨而逃，亂亂竄竄，敗走二十餘</tspan></text>
