<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說岳雲往金門鎮轉來，將近番營，推開戰馬，擺</tspan><tspan x="90" dy="34">着雙錘，打進粘罕營中，撞着錘的就沒命，旁若無</tspan></text>
