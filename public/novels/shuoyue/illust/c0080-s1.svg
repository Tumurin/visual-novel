<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回　施岑收服烏靈聖母牛皋氣死完顏兀朮</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">嶽霖應聲：“得令！”提槍上馬，出營來到陣前，</tspan><tspan x="90" dy="34">喝道：“妖婦慢來，我四公子來取你的首級也！”</tspan></text>
