<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">屈原公奏道：“臣已定下一計在此。明日大王可命</tspan><tspan x="90" dy="34">王佐差人前去請岳飛來赴席，那岳飛無有不來的。</tspan></text>
