<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">高宗道：“卿之前罪免究，今獻玉璽有功，官封右</tspan><tspan x="90" dy="34">丞相之職。”邦昌謝恩而退。到了次日，邦昌上殿</tspan></text>
