<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說岳雷營中軍士，見牛通喫了飯上岡子去，一夜</tspan><tspan x="90" dy="34">不回，到了天明，到口子上來，一路找尋不着。直</tspan></text>
