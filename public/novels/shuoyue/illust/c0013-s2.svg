<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說岳大爺等出了城門，加鞭拍馬，急急而行。牛</tspan><tspan x="90" dy="34">皋道：“到了此外還怕他怎的。要如此忙忙急急的</tspan></text>
