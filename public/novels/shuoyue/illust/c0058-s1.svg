<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日，孟邦傑、張顯、張立、張用各將所練的</tspan><tspan x="90" dy="34">槍牌已熟，前來繳令。元帥就命四將去破番陣，又</tspan></text>
