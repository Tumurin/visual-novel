<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回　伍尚志火牛衝敵陣鮑方祖贈寶破妖人</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那王佐來見楊幺，說：“火燒君山，又被岳飛逃去</tspan><tspan x="90" dy="34">。”楊幺道：“你領了家小回去，記你功勞便了。</tspan></text>
