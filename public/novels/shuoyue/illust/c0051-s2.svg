<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">尚未交鋒，伍尚志將火牛燒着。那牛疼痛，便望宋</tspan><tspan x="90" dy="34">營中衝來，勢不可擋。元帥看見，大叫：“衆將快</tspan></text>
