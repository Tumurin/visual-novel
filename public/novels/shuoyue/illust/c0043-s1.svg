<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十三回　送客將軍雙結義贈囊和尚泄天機</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一聲喊，早驚得三人飛馬便走。不道山路高低，</tspan><tspan x="90" dy="34">一將坐馬失足，連人掀下。彥直舉槍便刺。兀朮舉</tspan></text>
