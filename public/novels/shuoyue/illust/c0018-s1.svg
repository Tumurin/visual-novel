<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回　金兀朮冰凍渡黃河張邦昌奸謀傾社稷</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裏小番報入牛皮帳中。黑風高喫了一驚，連忙起</tspan><tspan x="90" dy="34">來，已不見了，只得收拾屍首，安置受傷小卒。又</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
