<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那強盜卻認得我。”那廟門原是破的，就向那破縫</tspan><tspan x="90" dy="34">中一張，原來不是別人，卻是相州節度使劉光世手</tspan></text>
