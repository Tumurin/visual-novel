<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日，元帥升帳，衆將站立兩旁聽令。元帥高</tspan><tspan x="90" dy="34">聲問道：“今糧草雖到，金兵困住我兵在此，恐一</tspan></text>
