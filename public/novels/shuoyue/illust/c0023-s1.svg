<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說岳爺領兵前行，又至一山，名爲青龍山。嶽爺</tspan><tspan x="90" dy="34">左顧右盼，吩咐將人馬紮住，對吉青道：“這座山</tspan></text>
