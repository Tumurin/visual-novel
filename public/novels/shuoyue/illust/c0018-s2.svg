<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那蒲蘆溫來至帳前，把殿下放了，誰知趙王早已驚</tspan><tspan x="90" dy="34">死！兀朮見了大怒，喝道：“誰叫你去拿他？把他</tspan></text>
