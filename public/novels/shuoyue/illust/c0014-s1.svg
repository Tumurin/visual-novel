<path d="M0,675 L0,460 L0,460 L165,366 L340,360 L537,395 L733,300 L971,380 L1162,339 L1200,363 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,518 L0,518 L145,406 L334,477 L497,425 L750,456 L902,349 L1112,356 L1200,376 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,578 L0,578 L242,489 L477,424 L646,540 L826,418 L1004,508 L1200,434 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="390" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">說岳全傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十四回　岳飛破賊酬知己施全剪徑遇良朋轅門昨日感深恩，報效捐軀建上勳。白鵲旗邊懸賊首，紅羅山下識良朋。</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">恰好嶽大爺等四個人一齊都到，看見湯懷戰那人不</tspan><tspan x="90" dy="34">下，張顯把鉤連槍一擺，喝道：“我來也！”話聲</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>