<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一場大戰，殺得那金兵大敗虧輸，望西北而逃。</tspan><tspan x="90" dy="34">嶽元帥在後邊催動人馬，急急追趕，直殺得屍橫遍</tspan></text>
