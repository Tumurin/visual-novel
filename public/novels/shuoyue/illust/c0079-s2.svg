<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十八回　黑風珠四將喪命白龍帶伍連遭擒</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當時山獅駝按不住心頭火起，把馬一拍，舉起溜金</tspan><tspan x="90" dy="34">釒黨，望歐陽從善頂門上蓋來。楊繼周見了，手挺</tspan></text>
