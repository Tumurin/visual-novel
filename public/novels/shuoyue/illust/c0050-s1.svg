<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回　打酒罈福將遇神仙探君山元戎遭厄難詞曰</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">進了洞門，見了老祖道：“我肚中飢餓，可有酒飯</tspan><tspan x="90" dy="34">，拿些來與我充飢。”老祖叫道童拿出些素飯來與</tspan></text>
