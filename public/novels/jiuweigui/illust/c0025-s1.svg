<path d="M0,675 L0,435 L0,435 L218,378 L423,328 L678,384 L931,302 L1088,352 L1200,354 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,502 L0,502 L258,336 L514,464 L703,413 L919,421 L1155,417 L1200,408 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,570 L0,570 L254,559 L418,460 L655,400 L883,396 L1058,535 L1200,443 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
