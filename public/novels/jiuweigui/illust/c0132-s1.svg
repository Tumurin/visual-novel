<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說陸韻仙聽了馬山甫回得這樣斬鋼截鐵，料想是</tspan><tspan x="90" dy="34">不肯借的了，一時間由不得心中大怒，蛾眉倒豎，</tspan></text>
