<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那時臺上正在演那《翠屏山》，周鳳林扮着潘巧雲</tspan><tspan x="90" dy="34">，雖然年紀大些，臺容倒還不錯。筱榮祥扮的楊雄</tspan></text>
