<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">上回書中說到辛修甫同着陳海秋等在天仙看戲，忽</tspan><tspan x="90" dy="34">然頭包裏頭一個少年女子和那二包裏頭的姚月仙大</tspan></text>
