<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　林黛玉春宵引鳳　王雲生黑夜捉姦</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時茶房已經被王雲生踢門驚醒，隔壁房門也還有</tspan><tspan x="90" dy="34">未睡的客人，聽見外邊大鬧起來，大家出來看視。</tspan></text>
