<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　論妍媸暢談電氣　談嫖界痛罵官場</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">下文章秋谷識破仙人跳，張書玉大鬧味蓴園，倒脫</tspan><tspan x="90" dy="34">一靴，兩番騙局，康伯宣帷薄不修，留學生彈打章</tspan></text>
