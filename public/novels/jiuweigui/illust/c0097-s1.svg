<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回　借洋錢硬捉瘟生　呼將伯欣逢故友</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">看官且住，陶觀察雖然糊塗，究竟也是個人，天下</tspan><tspan x="90" dy="34">那有倌人將要嫁人的時候，還要和客人借錢的道理</tspan></text>
