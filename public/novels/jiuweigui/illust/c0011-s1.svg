    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="952" cy="160" r="65" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,422 L0,422 L151,396 L308,339 L509,329 L695,386 L908,353 L1158,410 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,501 L0,501 L216,355 L402,362 L652,405 L823,354 L992,336 L1186,336 L1200,396 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,564 L0,564 L187,468 L359,388 L581,384 L726,545 L887,411 L1062,449 L1200,522 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="405" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">九尾龜</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回　兆貴裏劉厚卿行令　吉升棧張書玉發標</text>
<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那曉得張書玉性情本來悍潑，淫惡非常；又因厚卿</tspan><tspan x="90" dy="34">跳槽到洪笑梅家，天天擺酒碰和的報效，眼睜睜看</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>