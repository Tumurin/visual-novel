<text x="90" y="120" font-family="serif" font-size="54" fill="#222">九尾龜</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十四回　辦交涉庸奴降秩　諂大官觀察欺貧</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">劉大老爺攆走了侄兒，把這個丫環叫到面前痛打了</tspan><tspan x="90" dy="34">一頓，叫了一個家人、一個僕婦進來，叫他們帶着</tspan></text>
