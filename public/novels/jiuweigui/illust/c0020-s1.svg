<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十九回　闖房間莽客怒生波　圓好夢良宵花解語</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">和甫正要開口，忽然有一個帶來的流氓，走過來在</tspan><tspan x="90" dy="34">和甫耳邊低低說了幾句，和甫登時大怒，問寶珠姐</tspan></text>
