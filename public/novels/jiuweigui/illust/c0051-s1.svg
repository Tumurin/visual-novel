<text x="90" y="120" font-family="serif" font-size="54" fill="#222">九尾龜</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回　巧姻緣良夜渡銀河　殺風景三更飛黑索</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">霍春榮出得臺來，秋谷定睛凝視，只見他穿一件織</tspan><tspan x="90" dy="34">金雲緞玄色夾衣，內襯繡花短襖，繡花叉褲，渾身</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
