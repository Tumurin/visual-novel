<path d="M0,675 L0,429 L0,429 L179,399 L376,334 L543,352 L718,320 L891,318 L1137,371 L1200,351 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,525 L0,525 L157,368 L355,381 L529,386 L708,470 L851,374 L1111,343 L1200,400 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,590 L0,590 L174,518 L409,388 L585,396 L746,507 L986,553 L1135,552 L1200,485 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
