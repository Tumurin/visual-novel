    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="946" cy="239" r="68" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,400 L0,400 L148,383 L358,392 L527,351 L679,395 L876,309 L1022,363 L1200,396 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,487 L0,487 L234,355 L427,341 L627,455 L797,378 L1034,430 L1200,348 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,553 L0,553 L218,493 L362,535 L609,520 L757,452 L964,421 L1193,551 L1200,537 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="422" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">九尾龜</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十二回　章秋谷名花成眷屬　張書玉陌上遇蕭郎</text>
<text x="90" y="552" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">有一天，書玉坐着轎子在一品香出局回來，轎子走</tspan><tspan x="90" dy="34">到大新街口，忽然迎面撞過一個客人，正在四馬路</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
