<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只說金觀察邀着大家坐下，先拿過戲目來看時，只</tspan><tspan x="90" dy="34">見戲目上排着男伶高福安的《金錢豹》、青菊花的</tspan></text>
