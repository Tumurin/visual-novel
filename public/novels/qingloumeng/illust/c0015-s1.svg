<text x="90" y="120" font-family="serif" font-size="54" fill="#222">青樓夢</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回　扮乞兒奇逢雙美　遇之子巧訂三生</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">挹香見書後，吩咐門公：“說我隨即就來。”門公</tspan><tspan x="90" dy="34">領命而去。挹香即換了衣服，往愛芳家去。愛芳接</tspan></text>
<g transform="translate(1070,545)">
