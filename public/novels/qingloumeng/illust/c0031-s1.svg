<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一回　綴巍科才人弛譽　作幻夢美女飛仙</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">拜林等三人雖然嘗見，餘卻未曾識面，依舊大鬧，</tspan><tspan x="90" dy="34">甚至鬧到挹香命小素相見後方罷。衆人見了，暗暗</tspan></text>
