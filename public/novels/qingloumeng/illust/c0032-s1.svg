<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回　備列小星團圓五美　折磨中道疾病旬朝</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說拜林等九人出了沁香居，又往媚紅軒、步嬌館</tspan><tspan x="90" dy="34">琴、素兩處大鬧，鬧得六缸水渾，豁將臺醉了，周</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
