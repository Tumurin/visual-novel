<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五卷    	襄敏公元宵失子　十三郎五歲朝天</text>
<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">詞云：瑞煙浮禁苑。正絳闕春回，新正方半，冰輪</tspan><tspan x="90" dy="34">桂華滿。溢花衢歌市，芙蓉開遍。龍樓兩觀，見銀</tspan></text>
