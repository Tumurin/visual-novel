<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十四卷    	庵內看惡鬼善神　井中譚前因後果</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">自實只道是水淹將來，立刻可死。誰知道井中可煞</tspan><tspan x="90" dy="34">作怪，自實腳踏實地，點水也無。伸手一模，兩邊</tspan></text>
