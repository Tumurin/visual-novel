<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七卷    	同窗友認假作真　女秀才移花接木</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">小姐仍舊帶了聞龍夫妻跟隨，同杜子中到成都來。</tspan><tspan x="90" dy="34">認著前日飯店，歇在裡頭了。杜子中叫聞龍拿了帖</tspan></text>
