<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七卷    	偽漢裔奪妾山中　假將軍還姝江上</text>
<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一日出行，過一富翁之門，正撞著強盜四十余人在</tspan><tspan x="90" dy="34">那裡打劫他家。將富翁捆縛住，著一個強盜將刀加</tspan></text>
