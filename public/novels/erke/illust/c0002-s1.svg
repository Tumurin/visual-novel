<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只說那時遼國圍棋第一稱國手的乃是一個女子，名</tspan><tspan x="90" dy="34">為妙觀。有親王保舉，受過朝廷冊封為女棋童。設</tspan></text>
