<text x="90" y="120" font-family="serif" font-size="54" fill="#222">二刻拍案驚奇</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一卷    	滿少卿饑附飽颺　焦文姬生讎死報</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">滿生與朱氏門當戶對，年貌相當，你敬我愛，如膠</tspan><tspan x="90" dy="34">似漆。滿生心裡反悔著鳳翔多了焦家這件事，卻也</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>