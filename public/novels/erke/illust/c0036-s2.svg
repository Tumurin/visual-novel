<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六卷    	王漁翁捨鏡崇三寶　白水僧盜物喪雙生</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說行者真空偷竊了住持東西，逃出山門。且不顧</tspan><tspan x="90" dy="34">師父目前死活，一逕打點他方去享用。把目前寄頓</tspan></text>
