<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">五載之內，世名已得游泮，做了秀才，妻俞氏又生</tspan><tspan x="90" dy="34">下一兒。世名對俞氏道：「有此狐狐，王氏之脈不</tspan></text>
