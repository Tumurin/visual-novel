<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十五卷    	徐茶酒乘鬧劫新人　鄭蕊珠鳴冤完舊案</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，天已大明，謝家父子教眾人帶了徐達，寫了</tspan><tspan x="90" dy="34">一紙狀詞，到縣堂上告准，面稟其故。知縣驚異道</tspan></text>
