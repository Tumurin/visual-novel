<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六卷    	王漁翁捨鏡崇三寶　白水僧盜物喪雙生</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知這個法輪是個奸狡有餘的僧人，明知道鏡是至</tspan><tspan x="90" dy="34">寶，王甲巨富皆因於此。見說肯捨在佛寺，已有心</tspan></text>
