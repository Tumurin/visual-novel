<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回    冀州侯蘇護伐西岐</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說鄭倫大戰哪吒，恐哪吒先下手，把杵一擺，烏</tspan><tspan x="90" dy="34">鴉兵如長蛇陣一般，都拿著撓鉤套索前來等著。哪</tspan></text>
