<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說子牙吩咐：「誰去澠池縣取頭一功？」南宮适</tspan><tspan x="90" dy="34">應聲願往，領令出營，至城下搦戰。張奎聞報，問</tspan></text>
