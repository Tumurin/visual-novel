<text x="90" y="120" font-family="serif" font-size="54" fill="#222">封神演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十一回    子牙潼關遇痘神</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說子牙又見折了蘇護，著實傷悼。蘇護長子蘇全</tspan><tspan x="90" dy="34">忠聞報痛哭。上帳欲報父仇；子牙不得已，許之。</tspan></text>
<g transform="translate(1070,545)">
