<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說西岐旁晚，將近黃昏時候，三路兵收拾出城埋</tspan><tspan x="90" dy="34">伏。伺至二更時分，一聲砲響，黃飛虎父子兵衝進</tspan></text>
