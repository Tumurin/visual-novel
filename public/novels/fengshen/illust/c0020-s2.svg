<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回    散宜生私通費尤</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不說紂王不赦姬昌，且說邑考從人已知紂王將公子</tspan><tspan x="90" dy="34">醢為肉醬，星夜逃回，進西岐來見二公子姬發。姬</tspan></text>
