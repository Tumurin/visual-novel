<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文殊廣法天尊騎獅子，普賢真人騎白象，慈航道人</tspan><tspan x="90" dy="34">騎金毛犼：三位大士各現出化身，衝將進去。靈寶</tspan></text>
