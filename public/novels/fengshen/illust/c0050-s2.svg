<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回    三姑計擺黃河陣</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">菡芝仙放出黑風。子牙急睜眼看時，又被彩雲仙子</tspan><tspan x="90" dy="34">一戳目珠打傷眼目，幾乎落騎。瓊霄發劍衝殺，幸</tspan></text>
