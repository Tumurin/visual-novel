<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">普賢真人歌罷，袁天君怒氣紛紛，持劍而至。普賢</tspan><tspan x="90" dy="34">真人曰：「袁角，你何苦作孽，擺此惡陣！貧道此</tspan></text>
