<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回    文王夜夢飛熊兆</text>
<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">樵子歌罷，把一擔柴放下，近前少憩，問子牙曰：</tspan><tspan x="90" dy="34">「老丈，我常時見你在此，執竿釣魚，我和你像一</tspan></text>
