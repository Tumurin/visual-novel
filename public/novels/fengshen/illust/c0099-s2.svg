<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十九回    姜子牙歸國封神</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三姑聽罷封號，叩首謝恩，出壇去了。子牙又命柏</tspan><tspan x="90" dy="34">鑑：「引申公豹至臺下受封。」不一時，只見清福</tspan></text>
