<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說次日，子牙陞帳，問曰：「誰取穿雲關去走一</tspan><tspan x="90" dy="34">遭？」徐蓋應聲曰：「啟元帥：穿雲關主將乃是末</tspan></text>
