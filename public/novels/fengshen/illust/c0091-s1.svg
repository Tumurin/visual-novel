<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說楊任被袁洪打死，兩軍混戰，至天明，子牙鳴</tspan><tspan x="90" dy="34">金，兩下收兵。子牙陞帳，點視軍將，已知楊任陣</tspan></text>
