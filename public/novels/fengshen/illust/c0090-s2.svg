<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說高明等二人進營，來見袁洪曰：「姜尚所仗無</tspan><tspan x="90" dy="34">他，俱倚的是三山五岳門人，故此所在，僥幸成功</tspan></text>
