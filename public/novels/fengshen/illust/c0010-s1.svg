<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回    姬伯燕山收雷震</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說紂王回宮，妲己接見。紂王攜手相攙，並坐龍</tspan><tspan x="90" dy="34">墩之上。王曰：「今日商容撞死，趙啟炮烙，朕被</tspan></text>
