<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回    老子一爇化三清</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說多寶道人見半空中仙樂響亮，如是他師尊來至</tspan><tspan x="90" dy="34">，忙出陣拜迎進了陣，卜了八卦臺坐下，眾門人侍</tspan></text>
