<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說余化一騎向前，此人自不曾會武成王，見來將</tspan><tspan x="90" dy="34">儀容異相，五柳長髯，飄揚腦後，丹鳳眼，臥蠶眉</tspan></text>
