<text x="90" y="120" font-family="serif" font-size="54" fill="#222">封神演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十八回    周武王鹿臺散財</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說眾諸侯同武王往鹿臺而來。上了臺時，見閣聳</tspan><tspan x="90" dy="34">雲端，樓飛霄漢，亭臺疊疊，殿宇巍峨，雕欄玉飾</tspan></text>
