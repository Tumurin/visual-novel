<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回    子牙設計收九公</text>
<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說子牙送太鸞出府歸，與懼留孫商議曰：「必須</tspan><tspan x="90" dy="34">……如此如此，大事可成。」光陰迅速，不覺就是</tspan></text>
