<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回    陸壓獻計射公明</text>
<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說燃燈命：「曹道友，你去破陣走一遭。」曹寶</tspan><tspan x="90" dy="34">曰：「既為真命之主，安得推辭。」忙提寶劍出陣</tspan></text>
