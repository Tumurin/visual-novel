<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回    子牙發柬擒妲</text>
<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">殺氣迷空鎖地，煙塵障嶺漫山。擺列諸侯八百，一</tspan><tspan x="90" dy="34">時地覆天翻。花腔鼓擂如雷震，御林軍展動旗旛。</tspan></text>
