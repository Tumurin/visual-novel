<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回    姜子牙金臺拜將</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奸舌利齒，妄為是非，調撥士卒，互相爭鬥，致亂</tspan><tspan x="90" dy="34">行伍，此為刁軍；犯者斬。</tspan></text>
