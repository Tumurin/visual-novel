<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回    馬元下山助殷洪</text>
<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙至軍前，問曰：「道者何名？」馬元答曰</tspan><tspan x="90" dy="34">：「吾乃一氣仙馬原是也。申公豹請吾下山，來助</tspan></text>
