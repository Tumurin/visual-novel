<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十四回    子牙兵取臨潼關</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說當日卞吉將旛桿豎起，一馬竟至周營轅門前搦</tspan><tspan x="90" dy="34">戰。哨馬報人中軍：「啟元帥：關內有將請戰。」</tspan></text>
