<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十五回    土行孫盜騎陷身</text>
<text x="90" y="562" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">余元不曾提防暗算，被犬一口，把大紅白鶴衣扯了</tspan><tspan x="90" dy="34">半邊。余元又吃了大虧，不能前進：「吾且回去，</tspan></text>
