<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回    周紀激反武成王</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說紂王敗至大殿坐下，懊悔不及。都城百姓官員</tspan><tspan x="90" dy="34">已知武成王反了，家家閉戶，路少人行。又聞天子</tspan></text>
