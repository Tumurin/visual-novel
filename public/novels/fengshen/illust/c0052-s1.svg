<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十二回    絕龍嶺聞仲歸天</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說聞太師見赤精子拿出陰陽鏡，把麒麟一磕，跳</tspan><tspan x="90" dy="34">出圈子外，往燕山下退去。赤精子也不來趕。太師</tspan></text>
