<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十四回    文煥怒斬殷破敗</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">行營方正，遍地兵山。刁斗傳呼，威嚴整肅。長鎗</tspan><tspan x="90" dy="34">列千條柳葉：短劍排萬斤冰魚。瑞彩飄颻，旗旛色</tspan></text>
