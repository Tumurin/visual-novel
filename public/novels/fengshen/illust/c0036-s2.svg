<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六回    張桂芳奉詔西征</text>
<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說哪吒頃刻來到西岐，落了風火輪，找問相府。</tspan><tspan x="90" dy="34">左右指引：「小金橋是相府。」哪吒至相府下輪。</tspan></text>
