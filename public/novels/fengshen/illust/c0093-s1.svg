<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十三回    金吒智取游魂關</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說金吒大戰馬兆，步馬相交，有三二十合，金吒</tspan><tspan x="90" dy="34">祭起遁龍樁，一聲響，將馬兆遁住。竇榮揮動戈，</tspan></text>
