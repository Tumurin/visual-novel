<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十二回    黃天化潼關會父</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黃飛虎坐在殿上，三更時候，只聽得一陣風響</tspan><tspan x="90" dy="34">，從丹墀下直旋到殿東來。飛虎見了，毛骨聳然，</tspan></text>
