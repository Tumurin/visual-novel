<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十九回    殷洪下山收四將</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">黃龍真人用雙劍來迎。呂岳在金眼駝上，現出三頭</tspan><tspan x="90" dy="34">六臂，大顯神通。一位是了道真仙，一位是瘟部鼻</tspan></text>
