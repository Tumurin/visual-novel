<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回    三大師收獅象犼</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">龜靈聖母大呼曰：「你是西方客，當守你巢穴，如</tspan><tspan x="90" dy="34">何敢在此妖言亂語，惑吾清聽！」也不及交手，急</tspan></text>
