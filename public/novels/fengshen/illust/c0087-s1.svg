<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回    土行孫夫妻陣亡</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說鄧嬋玉大戰高蘭英有二十回合，撥馬就走。高</tspan><tspan x="90" dy="34">蘭英不知鄧嬋玉詐敗，便隨後趕來。嬋玉聞腦後鸞</tspan></text>
