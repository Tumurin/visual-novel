<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回    楊戩哪吒收七怪</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說眾諸侯齊殺入成湯營裏，只殺的屍橫綠野，血</tspan><tspan x="90" dy="34">滿成渠，哀聲慘切，不堪聽聞。只見楊戩大戰袁洪</tspan></text>
