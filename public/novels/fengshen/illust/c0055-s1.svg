<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十五回    土行孫歸伏西岐</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說楊戩駕土遁至夾龍山飛龍洞，逕進洞，見了懼</tspan><tspan x="90" dy="34">留孫下拜，口稱：「師伯。」懼留孫忙答禮曰：「</tspan></text>
