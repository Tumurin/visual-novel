<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回    哼哈二將顯神通</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黃天祿弟兄三人裹住陳奇，忽一鎗正中陳奇右</tspan><tspan x="90" dy="34">腿。陳奇將坐騎跳出圈子外邊。黃天祿隨後趕來。</tspan></text>
