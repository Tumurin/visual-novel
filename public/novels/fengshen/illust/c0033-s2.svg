<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回    黃飛虎泗水大戰</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">黃飛虎在傍，見四將把父親圍住，面上甚有怒色，</tspan><tspan x="90" dy="34">沉思曰：「這匹夫可惡！我在此尚，把老爺欺侮。</tspan></text>
