<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十九回    姜子牙冰凍岐山</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話言那道童唱著行來，見李興霸打稽首：「道者請</tspan><tspan x="90" dy="34">了！」興霸答禮。道童曰：「老師那一座名山？何</tspan></text>
