<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回    姬伯燕山收雷震</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且言三位諸侯，久不曾會，重整一席，三人共飲。</tspan><tspan x="90" dy="34">將至二鼓時分，內中有一驛卒，見三位大臣飲酒，</tspan></text>
