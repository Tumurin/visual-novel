<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十四回    土行孫立功顯耀</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當日鄧九公父子著傷，日夜煎熬。四將在營商議：</tspan><tspan x="90" dy="34">「今主帥帶傷，不能取勝西岐，奈何？」正議論間</tspan></text>
