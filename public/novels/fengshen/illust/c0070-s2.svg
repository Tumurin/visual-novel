<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十回    準提道人收孔宣</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">你要成功扶紂王，誰知反中巧中機。孔宣下馬，執</tspan><tspan x="90" dy="34">劍在手，往下砍來。土行孫手中棍望上來迎。二人</tspan></text>
