<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十五回    土行孫盜騎陷身</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說懼留孫將土行孫救出火焰之中，土行孫在內自</tspan><tspan x="90" dy="34">覺得不熱，不知何故。懼留孫來至周營。那夜是南</tspan></text>
