<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十三回    鄧九公奉敕西征</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說鄧九公看子牙兵按五方而出，左右顧盻，進退</tspan><tspan x="90" dy="34">舒徐，紀律嚴肅，井井有條，兵威甚整，真堂堂之</tspan></text>
