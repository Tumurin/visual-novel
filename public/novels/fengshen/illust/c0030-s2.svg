<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回    周紀激反武成王</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說飛虎聽得此信，無語沉吟；又見三子哭得酸楚</tspan><tspan x="90" dy="34">。黃明曰：「兄長不必躊躕。紂王失政，大變人倫</tspan></text>
