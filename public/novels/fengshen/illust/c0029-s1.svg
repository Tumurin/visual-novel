<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說崇侯虎人馬不一日到了崇城。報馬來報黑虎。</tspan><tspan x="90" dy="34">黑虎暗令高定：「你領二十名刀斧手，埋伏於城門</tspan></text>
