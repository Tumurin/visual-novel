<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十二回    張山李錦伐西岐</text>
<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說鄧九公大戰錢保有三十回合，錢保豈鄧九公對</tspan><tspan x="90" dy="34">手，被九公回馬刀劈於馬下，梟首級進城，來見子</tspan></text>
