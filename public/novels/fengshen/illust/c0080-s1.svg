<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說呂岳將子牙困於陣中，復出陣前大呼曰：「姜</tspan><tspan x="90" dy="34">尚已絕於吾陣，叫姬發早早受死！」武王在轅門聞</tspan></text>
