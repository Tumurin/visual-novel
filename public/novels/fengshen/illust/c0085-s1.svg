<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十五回    鄧芮二侯歸周主</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說鄧、芮二侯次日陞殿坐下，眾將來見。鄧昆曰</tspan><tspan x="90" dy="34">：「吾二人奉敕協守此關，以退周兵，昨日會戰，</tspan></text>
