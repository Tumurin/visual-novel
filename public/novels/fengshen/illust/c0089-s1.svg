<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說姚庶良隨後趕來，常昊乃是蛇精，縱馬，腳下</tspan><tspan x="90" dy="34">起一陣旋風，捲起一團黑霧，連人帶馬罩住，方現</tspan></text>
