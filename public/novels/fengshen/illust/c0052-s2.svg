<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十二回    絕龍嶺聞仲歸天</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說二人交鋒，約有二三十合，有辛環氣沖牛斗，</tspan><tspan x="90" dy="34">余慶怒髮沖冠，二將來助太師。黃天化見二將來助</tspan></text>
