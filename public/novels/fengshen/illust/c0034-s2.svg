<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黃滾膝行軍前請罪，見韓榮，口稱：「犯官黃</tspan><tspan x="90" dy="34">滾特來叩見總兵。」韓榮忙答禮曰：「老將軍，此</tspan></text>
