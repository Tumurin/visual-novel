<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回    子牙火燒琵琶精</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">子牙用火煉妖精，燒煉兩個時辰，上下渾身，不曾</tspan><tspan x="90" dy="34">燒枯了些兒。紂王問亞相比干曰：「朕觀烈火焚燒</tspan></text>
