<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙催騎向前，欠背打躬，口稱：「太師，卑</tspan><tspan x="90" dy="34">職姜尚不能全禮。」聞太師曰：「姜丞相，聞你乃</tspan></text>
