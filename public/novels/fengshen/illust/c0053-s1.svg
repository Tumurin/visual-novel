<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說南宮适大呼曰：「來者何人？」太鸞答曰：「</tspan><tspan x="90" dy="34">吾乃三山關總兵鄧麾下，正印先行太鸞是也；今奉</tspan></text>
