<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說東伯侯走馬至軍前，大呼曰：「吾父王姜桓楚</tspan><tspan x="90" dy="34">被你醢屍，吾姐姐姜后被你剜目烙手，俱死於非命</tspan></text>
