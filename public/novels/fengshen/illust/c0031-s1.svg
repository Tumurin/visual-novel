<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說青峰山紫陽洞清虛道德真君正在碧雲床運元神</tspan><tspan x="90" dy="34">，忽心下一驚，道人袖裏捏指一算，早知黃飛虎有</tspan></text>
