<text x="90" y="120" font-family="serif" font-size="54" fill="#222">封神演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十七回    蘇坦己置造蠆盆</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙用三昧真火燒這妖精。此火非同凡火，從</tspan><tspan x="90" dy="34">眼、鼻、口中噴將出來，乃是精、氣、神煉成三昧</tspan></text>
