<text x="90" y="558" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說羅宣正燒西岐，來了鳳凰山青鸞斗闕的龍吉公</tspan><tspan x="90" dy="34">主──乃是昊天上帝親生，瑤池金母之女；只因有</tspan></text>
