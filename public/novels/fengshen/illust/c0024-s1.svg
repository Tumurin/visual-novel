<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說子牙三更時分，披髮仗劍，踏罡布斗，搯訣結</tspan><tspan x="90" dy="34">印，隨與武吉厭星。次早，武吉來見子牙，口稱：</tspan></text>
