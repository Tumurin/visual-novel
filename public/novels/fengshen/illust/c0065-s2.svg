<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十五回    殷郊岐山受犁鋤</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說李靖大戰羅宣，戟劍相交，猶如虎狼之狀。李</tspan><tspan x="90" dy="34">靖祭起按三十三天黃金寶塔，乃大叫曰：「羅宣！</tspan></text>
