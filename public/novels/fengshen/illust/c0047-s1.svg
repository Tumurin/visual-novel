<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回    公明輔佐聞太師</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，陞中軍，趙公明上虎，提鞭，早到篷下，坐</tspan><tspan x="90" dy="34">名要燃燈答話。燃燈在篷上見公明跨虎而來，謂眾</tspan></text>
