<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">緊閉洞門，靜誦『黃庭』三兩卷；身投西土，『封</tspan><tspan x="90" dy="34">神臺』上有名人。你把姜尚打死，雖死還有回生時</tspan></text>
