<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回    燃燈議破十絕陣</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說宜生、晁田二騎上山，至洞門下馬，只見有一</tspan><tspan x="90" dy="34">童子出洞。宜生曰：「師兄，請煩通報老師：西周</tspan></text>
