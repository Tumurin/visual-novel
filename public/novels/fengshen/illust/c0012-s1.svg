<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十二回    陳塘關哪吒出世</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說李靖在關上無事，忽聞報天下反了四百諸侯。</tspan><tspan x="90" dy="34">忙傳令出，把守關隘，操演三軍，訓練士卒，謹提</tspan></text>
