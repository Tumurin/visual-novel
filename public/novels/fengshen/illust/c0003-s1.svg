<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">崇營探馬報入中軍：「啟二位老爺，冀州有一將請</tspan><tspan x="90" dy="34">二爺答話。」黑虎欠身：「小弟一往。」調本部三</tspan></text>
