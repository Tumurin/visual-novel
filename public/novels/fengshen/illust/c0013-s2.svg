<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回    太乙真人收石磯</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說太乙真人曰：「石磯，你說你的道德清高，你</tspan><tspan x="90" dy="34">乃截教，我乃闡教，因吾輩一千五百年不曾斬卻三</tspan></text>
