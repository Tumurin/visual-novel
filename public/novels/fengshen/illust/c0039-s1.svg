<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十九回    姜子牙冰凍岐山</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說姜子牙得勝回西岐，陞銀安殿。眾將報功。子</tspan><tspan x="90" dy="34">牙羨黃天祥走馬鎗挑風林。金吒曰：「師叔，今日</tspan></text>
