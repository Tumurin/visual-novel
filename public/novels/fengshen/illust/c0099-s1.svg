<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">「太上無極混元教主元始天尊敕曰：嗚呼！仙凡路</tspan><tspan x="90" dy="34">迴，非厚培根行豈能通；神鬼途分，豈諂媚奸邪所</tspan></text>
