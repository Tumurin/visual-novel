<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回    洪錦西岐城大戰</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且言洪錦被五光石打得面上眼腫鼻青，激得只是咬</tspan><tspan x="90" dy="34">牙，忙用丹藥敷貼，一夜痊癒。次日，上馬親至城</tspan></text>
