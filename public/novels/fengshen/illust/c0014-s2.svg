<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十四回    哪吒現蓮花化身</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說李靖因東伯姜文煥為父報仇，調四十萬人馬，</tspan><tspan x="90" dy="34">遊魂關大戰竇榮，榮不能取勝。李靖在野馬嶺操演</tspan></text>
