<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回    冀州侯蘇護伐西岐</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說飛虎大呼曰：「來者何人？」鄭倫曰：「吾乃</tspan><tspan x="90" dy="34">蘇侯麾下鄭倫是也。黃飛虎，你這叛賊！為你屢年</tspan></text>
