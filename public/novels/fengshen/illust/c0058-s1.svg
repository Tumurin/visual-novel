<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十八回    子牙西岐逢呂岳</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">呂岳道罷，子牙笑曰：「據道兄所談，不過如峨嵋</tspan><tspan x="90" dy="34">山趙公明，三仙島雲霄、瓊霄、碧霄之道，一旦俱</tspan></text>
