<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十五回    晁田兵探西岐事</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說晁田安營，與弟共議：「今奉太師命，來探西</tspan><tspan x="90" dy="34">岐虛實，原來也無準備。今日往西岐見陣，如何？</tspan></text>
