<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二將陣前尋鬥賭，兩下交鋒誰敢阻。這個似搖頭獅</tspan><tspan x="90" dy="34">子下山崗；那個如擺尾狻猊尋猛虎。這一個興心要</tspan></text>
