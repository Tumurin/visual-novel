<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回    洪錦西岐城大戰</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這一個頂上金盔飄烈焰；那一個黃金甲挂連環套。</tspan><tspan x="90" dy="34">這一個猩猩血染大紅袍；那一個粉素征袍如白練。</tspan></text>
