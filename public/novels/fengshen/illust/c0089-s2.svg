<text x="90" y="120" font-family="serif" font-size="54" fill="#222">封神演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十九回    紂王敲骨剖孕婦</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說紂王在鹿臺專等孕婦來看驗，只見當駕官啟曰</tspan><tspan x="90" dy="34">：「有箕子等候旨。」王曰：「宣。」箕子至臺上</tspan></text>
<g transform="translate(1070,545)">
