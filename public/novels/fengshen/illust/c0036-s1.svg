<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">張桂芳又見寶纛旛下，武成王黃飛虎坐騎提鎗，心</tspan><tspan x="90" dy="34">中大怒，一馬闖至軍前；見子牙而言曰：「姜尚，</tspan></text>
