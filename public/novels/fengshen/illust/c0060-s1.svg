<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回    馬元下山助殷洪</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黃飛虎大戰殷洪，二騎交鋒，鎗戟上下，來往</tspan><tspan x="90" dy="34">相交，約有二十回合。黃飛虎鎗法如風馳電掣，往</tspan></text>
