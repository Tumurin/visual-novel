<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十一回    太極圖殷洪絕命</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說殷洪見馬元一去無音，心下不樂，對劉甫、苟</tspan><tspan x="90" dy="34">章曰：「馬道長一去，音信杳無，定非吉兆。明日</tspan></text>
