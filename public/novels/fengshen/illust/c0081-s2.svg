<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十一回    子牙潼關遇痘神</text>
<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說黃飛虎、南宮适、洪錦、徐蓋聽得關內喊殺，</tspan><tspan x="90" dy="34">知是周兵成功，四將步行，趕至關前，見周兵已將</tspan></text>
