<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十三回    申公豹說反殷郊</text>
<text x="90" y="524" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說殷郊纔看山巔險峻之處，只聽得林內一聲鑼響</tspan><tspan x="90" dy="34">，見一人面如藍靛，髮似硃砂，騎紅砂馬，金甲紅</tspan></text>
