<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十七回    摘星樓紂王自焚</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說朱昇再三哭奏，勸紂王：「且自寬慰，另尋別</tspan><tspan x="90" dy="34">策，以解比圍。」紂王怒曰：「事已急矣！朕籌之</tspan></text>
