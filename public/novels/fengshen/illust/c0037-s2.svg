<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說子牙在府內自思：「哪吒雖則取勝，恐後面朝</tspan><tspan x="90" dy="34">歌調動大隊人馬，有累西土。」子牙沐浴更衣，來</tspan></text>
