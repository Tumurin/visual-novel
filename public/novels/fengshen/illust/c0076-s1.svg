<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十六回    鄭倫捉將取汜水</text>
<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙只因破了余元，打點設計取關，只聽得關</tspan><tspan x="90" dy="34">內砲響。少時探馬報入中軍，稟曰：「汜水關總兵</tspan></text>
