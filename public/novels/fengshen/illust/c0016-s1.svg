<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回    子牙火燒琵琶精</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙在牡丹亭裏，見風火影裏，五個精靈作怪</tspan><tspan x="90" dy="34">。子牙忙披髮仗劍，用手一指，把劍一揮，喝聲：</tspan></text>
