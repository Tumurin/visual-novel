<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回    子牙劫營破聞仲</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說聞太師見十絕陣俱破，只等朝歌救兵；又望三</tspan><tspan x="90" dy="34">山關鄧九公來助；與彩雲仙子、菡芝仙共議。二仙</tspan></text>
