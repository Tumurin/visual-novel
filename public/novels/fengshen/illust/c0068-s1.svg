<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十八回    首陽山夷齊阻兵</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">南宮适問曰：「你是那裏無名之兵，敢阻西岐大軍</tspan><tspan x="90" dy="34">？」魏賁曰：「你是何人？往那裏去？」南宮适答</tspan></text>
