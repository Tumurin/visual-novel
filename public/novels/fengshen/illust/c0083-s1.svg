<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回    三大師收獅象犼</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說準提道人收了金鰲，趕至萬仙陣前。通天教主</tspan><tspan x="90" dy="34">看見準提，怒沖面上，眼角俱紅，大呼曰：「準提</tspan></text>
