<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回    青龍關飛虎折兵</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說丘引被這一鐧，打得吐血不止，忙取丹藥，一</tspan><tspan x="90" dy="34">時不能痊癒；切齒深恨黃天祥於骨髓，在關內保養</tspan></text>
