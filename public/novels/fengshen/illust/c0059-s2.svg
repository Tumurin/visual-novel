<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十九回    殷洪下山收四將</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說殷洪改了西周號色，打著成湯字號，一日到了</tspan><tspan x="90" dy="34">西岐，果見蘇侯大營紮在城下。殷洪命龐弘去令蘇</tspan></text>
