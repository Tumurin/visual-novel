<text x="90" y="120" font-family="serif" font-size="54" fill="#222">封神演義</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十九回    穿雲關四將被擒</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說子牙祭鞭來打法戒，不意被法戒將鞭接去；子</tspan><tspan x="90" dy="34">牙著忙。忽然土行孫催糧到營前；見法戒將打神鞭</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
