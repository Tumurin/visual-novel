<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說木吒大喝曰：「你是何人，敢將左道邪術困吾</tspan><tspan x="90" dy="34">兄長，使他頭疼？想就是你了！」李奇曰：「非也</tspan></text>
