<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回    陸壓獻計射公明</text>
<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">陸壓歌罷。白天君曰：「爾是何人？」陸壓曰：「</tspan><tspan x="90" dy="34">你既設此陣，陣內必有玄妙處。我貧道乃是陸壓，</tspan></text>
