<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說報馬報與胡升，說徐坤陣亡。胡升心下甚是不</tspan><tspan x="90" dy="34">樂。次日，左右又報：「有周將討戰。」胡升令胡</tspan></text>
