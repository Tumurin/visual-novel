<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回    孔宣兵阻金雞嶺</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說姜子牙營中三路兵暗暗上嶺。將近二更，一聲</tspan><tspan x="90" dy="34">炮響，三路兵吶喊一聲，殺進轅門。哪吒踏輪搖鎗</tspan></text>
