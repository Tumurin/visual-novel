<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十三回    金吒智取游魂關</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說金吒、木吒別了子牙，兄弟二人在路商議。金</tspan><tspan x="90" dy="34">吒曰：「我二人奉姜元帥將令來救東伯侯姜文煥進</tspan></text>
