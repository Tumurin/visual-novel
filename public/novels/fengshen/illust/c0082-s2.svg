<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說余化龍與余達等俱聽了余德言語，不以周兵為</tspan><tspan x="90" dy="34">意，逐日飲酒，只等周營兵將自己病死。那一日不</tspan></text>
