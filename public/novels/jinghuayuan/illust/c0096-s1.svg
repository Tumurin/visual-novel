<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十九回     迷本性將軍游幻境　發慈心仙子下凡塵</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李孝逸因連傷三將，十分氣惱，即親自出馬。文營</tspan><tspan x="90" dy="34">眾公子也到陣前。余承志、洛承志一見，想起當年</tspan></text>
