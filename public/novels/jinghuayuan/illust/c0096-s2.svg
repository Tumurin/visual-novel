<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這日來到才貝關。武六思早已把陣擺了，來到戰場</tspan><tspan x="90" dy="34">喝道：「誰敢破我此陣！」章葒縱馬出來，同武六</tspan></text>
