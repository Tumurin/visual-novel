<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十八回     逞雄心挑戰無火關　啟慾念被圍巴刀陣</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，譚泰、葉洋進陣，也無消息。文蕓十分著急</tspan><tspan x="90" dy="34">，暗暗命人把武七思兵丁捉了一個，細細搜檢，胸</tspan></text>
