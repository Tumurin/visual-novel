<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回     丹桂巖山雞舞鏡　碧梧嶺孔雀開屏</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這日到了白民國交界。迎面有一危峰，一派清光，</tspan><tspan x="90" dy="34">甚覺可愛。唐敖忖道：「如此峻嶺，豈無名花？」</tspan></text>
