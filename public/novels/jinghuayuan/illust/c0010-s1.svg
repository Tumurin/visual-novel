<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回     誅大蟲佳人施藥箭　搏奇鳥壯士奮空拳</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">駱龍問了多、林二人名姓，略談兩句，固向唐敖歎</tspan><tspan x="90" dy="34">道：「吾兒賓王不聽賢姪之言，輕舉妄動，以致合</tspan></text>
