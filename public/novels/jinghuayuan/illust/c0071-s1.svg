<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">錦楓道：「妹子每牌總是天、地、人三個單張在手</tspan><tspan x="90" dy="34">，偏偏又是肚子，又不敢打，所以打了半日，還未</tspan></text>
