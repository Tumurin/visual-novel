<text x="90" y="120" font-family="serif" font-size="54" fill="#222">初刻拍案驚奇</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八卷烏將軍一飯必酬　陳大郎三人重會</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這都是嘆笑世人的話。世上如此之人，就是至親切</tspan><tspan x="90" dy="34">友，尚且反面無情，何況一飯之恩，一面之識？倒</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
