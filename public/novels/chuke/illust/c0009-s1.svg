<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宣徽好生不忍，心裡要收留拜住回家成親，教他讀</tspan><tspan x="90" dy="34">書，以圖出身。與三夫人商議，那三夫人是個女流</tspan></text>
