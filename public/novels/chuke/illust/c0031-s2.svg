<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">方大押著，把高雄兩個解入寨裡見賽兒。賽兒道：</tspan><tspan x="90" dy="34">「監侯在縣裡，我回軍時發落便了。」賽兒又與方</tspan></text>
