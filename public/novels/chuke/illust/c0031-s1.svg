<text x="90" y="120" font-family="serif" font-size="54" fill="#222">初刻拍案驚奇</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一卷何道士因術成奸　周經歷因奸破賊</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天明，看枷中只有燈臺一個，已不見了侯元。卻連</tspan><tspan x="90" dy="34">夜遁到銅鞮，逕到大石邊，見神君謝罪。神君大怒</tspan></text>
