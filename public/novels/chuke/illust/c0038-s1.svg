<text x="90" y="120" font-family="serif" font-size="54" fill="#222">初刻拍案驚奇</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八卷占家財狠婿妒侄　延親脈孝女藏兒</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">員外一日要到莊上收割，因為小梅有身孕，恐怕女</tspan><tspan x="90" dy="34">婿生嫉妒，女兒有外心，索性把家私都托女兒女婿</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
