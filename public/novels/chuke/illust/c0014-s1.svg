<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十四卷酒謀財于郊肆惡　鬼對案楊化借屍</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">「看得楊化以邊塞貧軍，跋涉千里，銀不滿三兩。</tspan><tspan x="90" dy="34">于大郊輒起毒心，先之酒醉，繼之繩勒，又繼之驢</tspan></text>
