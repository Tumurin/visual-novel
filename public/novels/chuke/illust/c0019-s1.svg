<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十九卷李公佐巧解夢中言　謝小娥智擒船上盜</text>
<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">眾人見說已殺了一人，曉得事體必要經官，又且與</tspan><tspan x="90" dy="34">小娥相好的多，恨申蘭的也不少，一齊點了火把，</tspan></text>
