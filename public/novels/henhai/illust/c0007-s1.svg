  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="767" cy="130" r="67" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,418 L0,418 L156,373 L392,337 L643,302 L891,340 L1086,316 L1200,397 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L247,460 L469,337 L709,419 L964,465 L1149,381 L1200,468 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,570 L0,570 L156,440 L333,435 L578,395 L796,434 L1004,550 L1148,472 L1200,480 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="401" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">恨海</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七回 巧應對安穩出危途 誤因循夫妻遭毒手</text>
<text x="90" y="531" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說伯和走近那小門，用手一推，是關着的。叩了</tspan><tspan x="90" dy="34">兩下，不見有人答應。走得乏了，便靠在那小門之</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>