  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="860" cy="220" r="58" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,443 L0,443 L256,304 L504,373 L754,388 L969,313 L1194,348 L1200,337 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,515 L0,515 L176,390 L320,471 L478,365 L691,341 L864,444 L1013,399 L1200,439 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,550 L0,550 L188,489 L386,455 L570,497 L761,513 L1015,461 L1200,538 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="470" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">恨海</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七回 巧應對安穩出危途 誤因循夫妻遭毒手</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">伯和逾牆出了米棧，走出了小巷口，只見滿目荒涼</tspan><tspan x="90" dy="34">，房屋盡皆燒了，剩了一片瓦礫。路上還有許多死</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>