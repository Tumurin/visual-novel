<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回 火熊熊大劫天津衛 病懨懨權住濟寧州</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">於是回到房裏，扯過一幅紅布，裹在頭上，扮做拳</tspan><tspan x="90" dy="34">匪模樣，跑出店來，混在裏面。才上個虹橋，回望</tspan></text>
