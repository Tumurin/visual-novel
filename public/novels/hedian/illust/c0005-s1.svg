<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回　劉莽賊使盡老婆錢　形容管領回開口貨</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一日，又出去賭夜錢輸極了，回家向雌鬼要錢去還</tspan><tspan x="90" dy="34">賭帳。雌鬼不肯，便拍檯拍凳的硬要。雌鬼只得發</tspan></text>
