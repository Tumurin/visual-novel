<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　搖小船陽溝裏失風　出老材死路上遠轉</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知不到一忽覺轉，活鬼忽然大寒大熱起來，口裏</tspan><tspan x="90" dy="34">不住的浮說亂話。雌鬼還只他魘音掩，夢中遇可怕</tspan></text>
