<text x="90" y="120" font-family="serif" font-size="54" fill="#222">何典</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回　活死人討飯遇仙人　臭花娘燒香逢色鬼</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">活死人見了大怒，道："清平世界，怎做這等沒天</tspan><tspan x="90" dy="34">理事，難道無王法的麼？"那男子並無怕懼，反喝</tspan></text>
