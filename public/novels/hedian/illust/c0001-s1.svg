<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">自從盤古皇手裏開天闢地以來，便分定了上中下三</tspan><tspan x="90" dy="34">個太平世界。上界是玉皇大帝領着些天神天將，向</tspan></text>
