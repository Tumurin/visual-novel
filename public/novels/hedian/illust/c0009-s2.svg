<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九回　貪城隍激反大頭鬼　怯總兵偏聽長舌婦</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">迷露裏鬼忙向前來勸，已經來不及，便道："官差</tspan><tspan x="90" dy="34">吏差，來人弗差。他們不過奉官差遣，打殺也覺冤</tspan></text>
