<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一回　五臟廟活鬼求兒　三家村死人出世</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩個依言走去，到了廟前，只見兩扇廟門半開半掩</tspan><tspan x="90" dy="34">，音希，謂露出一線着一條夾縫。形容鬼便踏上階</tspan></text>
