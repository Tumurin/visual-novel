<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八回　鬼谷先生白日昇天　畔房小姐黑夜打鬼</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正想走路，只聽得呀的一聲響，兩扇真寶門大開，</tspan><tspan x="90" dy="34">跑出一個腰細肩胛闊的精胖後生來，看見活死人立</tspan></text>
