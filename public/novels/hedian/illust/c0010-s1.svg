<text x="90" y="120" font-family="serif" font-size="54" fill="#222">何典</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回　閻羅王君臣際會　活死人夫婦團圓</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那日走到山腳下，看見一個俊俏書生，坐在樹陰底</tspan><tspan x="90" dy="34">下打磕睡，喜之不勝，走上前來，不費吹灰之力，</tspan></text>
