<text x="90" y="120" font-family="serif" font-size="54" fill="#222">何典</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二回　造鬼廟爲酬夢裏緣　做新戲惹出飛來禍</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">村中那些大男小女，曉得廟已起好，都成羣結隊的</tspan><tspan x="90" dy="34">到來燒香白相。正是燒香望和尚，一事兩勾當。見</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
