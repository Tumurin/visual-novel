<text x="90" y="120" font-family="serif" font-size="54" fill="#222">二十年目睹之怪現狀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回　翻舊案借券作酬勞　告賣缺縣丞難總督</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我因爲日內要走，恐怕彼此有甚話說，便在簽押房</tspan><tspan x="90" dy="34">和繼之盤桓，談談說說。我問起新任方伯如何，繼</tspan></text>
