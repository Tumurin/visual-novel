<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百二回　溫月江義讓夫人　裘致祿孽遺婦子</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“如此一連三天，把貴重東西都運了出去，連姨娘</tspan><tspan x="90" dy="34">日常所用的金押髮簪子，都除了下來拿去，自己換</tspan></text>
