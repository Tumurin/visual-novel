<text x="90" y="120" font-family="serif" font-size="54" fill="#222">二十年目睹之怪現狀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回　誤聯婚家庭鬧竟見　施詭計幕客逞機謀</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“言中丞此時失了主意，從此夫妻反目。過得兩天</tspan><tspan x="90" dy="34">，營務處總辦陸觀察來上轅，稟知奉了督帥之命，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
