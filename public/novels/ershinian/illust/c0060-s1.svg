<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十回　談官況令尹棄官　亂著書遺名被罵</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那戈什哈，他不是說繼之的壞話，難道他倒說繼之</tspan><tspan x="90" dy="34">的好話不成？那有這個道理！他說的話，說得太爽</tspan></text>
