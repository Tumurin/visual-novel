<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回　潑婆娘賠禮入娼家　闊老官叫局用文案</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“後來子森私下蓄了幾個錢，便與人湊股開了一家</tspan><tspan x="90" dy="34">報關行，倒也連年賺錢。這筆錢，子森卻瞞了老太</tspan></text>
