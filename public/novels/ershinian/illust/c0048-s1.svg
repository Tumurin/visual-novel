<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="二十年目睹之怪現狀">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="908" cy="120" r="53" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,402 L0,402 L223,347 L426,409 L656,361 L911,364 L1141,398 L1200,340 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,519 L0,519 L225,414 L403,335 L640,426 L825,461 L1015,331 L1197,362 L1200,431 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,597 L0,597 L220,505 L460,510 L655,497 L871,502 L1080,450 L1200,494 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="449" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">二十年目睹之怪現狀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回　內外吏胥神奸狙猾　風塵妓女豪俠多情</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我正和繼之說着話時，只見刑房書吏拿了一宗案卷</tspan><tspan x="90" dy="34">進來。繼之叫且放下，那書吏便放下，退了出去。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>