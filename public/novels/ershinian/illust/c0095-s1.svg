<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回　苟觀察就醫游上海　少夫人拜佛到西湖</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">欽差初到的時候，苟才也不免慄慄危懼，後來見他</tspan><tspan x="90" dy="34">專門和藩臺爲難，方纔放心。後來藩司那邊設法調</tspan></text>
