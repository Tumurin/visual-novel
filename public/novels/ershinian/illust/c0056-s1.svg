<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　施奇計姦夫變兇手　翻新樣淫婦建牌坊</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">“回到衙門，把兇刀和屍格一對，竟是一絲不走的</tspan><tspan x="90" dy="34">。不由分說，先交代動公事詳革了他的職銜，便坐</tspan></text>
