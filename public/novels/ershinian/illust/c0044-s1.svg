<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="二十年目睹之怪現狀">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="908" cy="168" r="57" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,410 L0,410 L179,307 L431,359 L628,345 L844,394 L1019,310 L1200,334 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,474 L0,474 L210,443 L428,397 L597,362 L759,380 L1011,469 L1200,437 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,588 L0,588 L145,547 L311,487 L453,483 L618,510 L877,452 L1064,518 L1200,467 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="415" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">二十年目睹之怪現狀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十四回　苟觀察被捉歸公館　吳令尹奉委署江都</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">又帶了兩名僕婦，仍上轎子，奔向繼之家來。我在</tspan><tspan x="90" dy="34">壽座天井裏碰見的正是他。因爲這天女客多，進出</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>