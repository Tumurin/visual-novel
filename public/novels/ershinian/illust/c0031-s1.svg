<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說話間，管德泉走過來說道：“江湖上的事，哪裏</tspan><tspan x="90" dy="34">好去信他！從前有一個甚麼吳少瀾，說算命算得很</tspan></text>
