<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">理之述完了這件事，我從頭仔細一想，這李壯佈置</tspan><tspan x="90" dy="34">的實在周密很毒。因問道：“他這種的祕密佈置，</tspan></text>
