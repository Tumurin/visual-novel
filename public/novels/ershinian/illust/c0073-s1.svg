<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回　書院課文不成師弟　家庭變起難爲祖孫</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">伯述道：“他是我們歷城（山東歷城縣也）同鄉。</tspan><tspan x="90" dy="34">我本來住在歷城會館。就因爲上半年，同鄉京官在</tspan></text>
