<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知官禁的內監，卻在東邊明巷裏，天霸到了面前</tspan><tspan x="90" dy="34">，舉眼見屋脊上伏着一人，蹲然不動，知是等候動</tspan></text>
