<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公聽罷馮氏一番話，沉吟半晌道：“馮氏，你暫</tspan><tspan x="90" dy="34">且回家，等本與你辦清此案。”馮氏聞聽，連忙叩</tspan></text>
