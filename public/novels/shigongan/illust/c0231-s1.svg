<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第231回　小元霸混入薛家窩　沒毛虎泄機留賓館</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">薛龍說：“你要看賊囚在哪裏，極其容易。”說着</tspan><tspan x="90" dy="34">話，把桌子向左轉動，只見對面依然現出門戶來。</tspan></text>
