<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說李天壽見自己的人盡佔了上風，此時正好脫身</tspan><tspan x="90" dy="34">，若是隻管戀戰，他們把城門關閉，打發人討了救</tspan></text>
