<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第463回　出重圍人傑失路　渡寬河王雄駕舟</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知此時這一陣惡殺，早已將方向忘卻。出了關門</tspan><tspan x="90" dy="34">，不向原路去走，反向山後而來。一氣奔馳，約走</tspan></text>
