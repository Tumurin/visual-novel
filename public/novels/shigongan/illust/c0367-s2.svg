<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第367回　黃天霸偷渡田家窪　衆英雄大破聚夾峯</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黃天霸問明土人林保的路徑，心中大喜。當下</tspan><tspan x="90" dy="34">就將林保留在營中，一面聚起衆英雄商議，說道：</tspan></text>
