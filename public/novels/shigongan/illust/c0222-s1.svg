<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第222回　尋朋友有心臨險地　傳捕役無意得功勞</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我們衆兄弟一齊同去。去的時節，不可聲張，裝做</tspan><tspan x="90" dy="34">客船模樣，夜間暗暗進去。大家上岸之後，將大小</tspan></text>
