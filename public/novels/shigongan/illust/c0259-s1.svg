<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說郝素玉大怒，舞動繡鸞刀，直往小西砍到。小</tspan><tspan x="90" dy="34">西急忙接住，兩人交上手，大戰起來。哪知郝素玉</tspan></text>
