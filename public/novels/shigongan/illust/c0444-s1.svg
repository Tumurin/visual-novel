<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">走了一日，已至廣平府界，時將日落。正要尋找客</tspan><tspan x="90" dy="34">棧，忽見前面有一處葦塘。這葦塘蘆草叢雜，地方</tspan></text>
