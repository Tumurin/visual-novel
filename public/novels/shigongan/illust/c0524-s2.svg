<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天霸一刀砍來，已是招架不住。李七侯搶上一步，</tspan><tspan x="90" dy="34">抬起左腿一下掃來，早將王朗打倒在地。若在別人</tspan></text>
