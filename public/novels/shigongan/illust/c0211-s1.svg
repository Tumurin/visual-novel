<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第211回　小元霸錘打賽猿猴　三義士併力助官兵</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">列公，你道這三位是誰？這也不消說得，一定是金</tspan><tspan x="90" dy="34">陵三傑了。如何來到此間呢？只因甘亮同鄧氏兄弟</tspan></text>
