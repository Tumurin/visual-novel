<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第133回　朱光祖行刺遇友　黃天霸信義全交</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天霸令小西暗裏躲藏，拋磚爲號；天霸在正廳抱廈</tspan><tspan x="90" dy="34">之下埋伏，雙雙暗中提防。黃天霸此時早拿定主意</tspan></text>
