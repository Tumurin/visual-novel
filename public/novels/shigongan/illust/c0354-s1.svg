<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第354回　正國法強徒授首　挾私仇惡霸傷心</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不一日回批已到，蔡天化着即就地正法。這日，黃</tspan><tspan x="90" dy="34">天霸等皆全身裝束，各帶兵刃。東安縣又將城守請</tspan></text>
