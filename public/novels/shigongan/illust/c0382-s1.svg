<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第382回　黃天霸大鬧桃花庵　馬如龍獨戰呂祖殿</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只聽噹啷一響，將雙飛燕的鉤撥在一旁；趁勢一刀</tspan><tspan x="90" dy="34">，向雙飛燕左肋下刺去。雙飛燕左手的鉤往下一磕</tspan></text>
