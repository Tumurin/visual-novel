<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說天保重複上馬。那二個官兵高舉火把，跟隨着</tspan><tspan x="90" dy="34">好漢，接應衆人，來拿於六、於七。又說王棟、李</tspan></text>
