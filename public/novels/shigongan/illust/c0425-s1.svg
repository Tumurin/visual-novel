<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第425回　大樹林虎鸞遁跡　花豹村人傑尋蹤</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">計全背後插着一柄單刀，賀人傑腰間掛着一雙銅錘</tspan><tspan x="90" dy="34">。花熊看畢，甚是不解，便讓計全、人傑二人到了</tspan></text>
