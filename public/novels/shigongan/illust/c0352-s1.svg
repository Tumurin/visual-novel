<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第352回　徐文豹大斗曹月娥　衆英雄協拿蔡天化</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時臺上的人已到全了，曹德彪又往臺下招呼過了</tspan><tspan x="90" dy="34">。徐文豹已跳上臺去。只見石勇到臺口，向徐文豹</tspan></text>
