<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">莊前的巡丁齊齊守着。李公然即往後兜抄，躥上房</tspan><tspan x="90" dy="34">屋，一眼瞥見薛鳳的屍首偃倒在瓦楞之上。李公然</tspan></text>
