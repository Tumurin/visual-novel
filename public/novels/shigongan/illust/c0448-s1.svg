<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說施公及大名府知府，與大名縣知縣，見兵丁回</tspan><tspan x="90" dy="34">來報信，說關王廟已破，所有淫僧全行被捉，請前</tspan></text>
