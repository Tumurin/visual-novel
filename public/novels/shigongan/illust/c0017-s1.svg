<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說施公坐堂，看那告狀之人，身穿綢綾，生得清</tspan><tspan x="90" dy="34">秀，年紀四旬有餘，面貌慈善。看罷，施公道：“</tspan></text>
