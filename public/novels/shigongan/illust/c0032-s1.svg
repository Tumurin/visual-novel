<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說公差徐茂，一連幾天，並無題目。這一日入茶</tspan><tspan x="90" dy="34">鋪消愁，明爲喫茶，暗暗留神。只見又來幾人，內</tspan></text>
