<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽被李昆寶劍一揮，只見一道白光，那獸已迎刃而</tspan><tspan x="90" dy="34">倒。李昆復一劍，結果了性命。此時外面的人通曉</tspan></text>
