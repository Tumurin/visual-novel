<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說賀人傑正要起身，只見殷強走了進來，在房外</tspan><tspan x="90" dy="34">問道：“賀賢弟，可曾起來？”人傑聽是殷強，連</tspan></text>
