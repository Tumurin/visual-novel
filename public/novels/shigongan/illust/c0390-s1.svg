<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第390回　朱光祖問路斬更夫　郝天龍巡夜回本寨</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">原來朱光祖有兩個綽號，一喚草上飛，一喚賽時遷</tspan><tspan x="90" dy="34">，只因他飛檐走壁的功夫，要算第一。不論到什麼</tspan></text>
