<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第89回　爲政有功升倉廠　行路偶遇盜官糧</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">猛見從四外跑來一羣男女，並非近前勸解，轟的一</tspan><tspan x="90" dy="34">聲，竟搶了米車，一齊動手。賢臣不解其意，勒馬</tspan></text>
