<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">人傑在前引路，躥林越樹，到了半山，那個樓前搭</tspan><tspan x="90" dy="34">個更棚，裏面點着個燈球，兩人在裏敲那更鼓。殷</tspan></text>
