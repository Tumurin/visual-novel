<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第320回　失餉銀關太受傷　急搬兵計全報信</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說殷家堡因遇水災，地方官未曾具報，那殷家堡</tspan><tspan x="90" dy="34">內，周圍二千多戶，忿忿不平，因與堡總商量。這</tspan></text>
