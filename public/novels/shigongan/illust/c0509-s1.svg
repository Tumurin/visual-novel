<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第509回　賀人傑絕處逢生　王寨主難中改悔</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">殷龍聽了此言，只得命賽花同趙家兄弟送他兩人回</tspan><tspan x="90" dy="34">店，自己提着朴刀一路而去。進了寨門，果見一人</tspan></text>
