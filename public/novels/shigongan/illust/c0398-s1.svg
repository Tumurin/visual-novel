<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第398回　避火炮偷渡後山河　盜御馬三進連環套</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說吳用人探明連環套內各處埋伏地雷火炮，當即</tspan><tspan x="90" dy="34">稟明瞭黃天霸等人。當下天霸即命他出外歇息。吳</tspan></text>
