<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第400回　分給資財恩威並濟　誤肆劫掠冒昧而行</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">停了一日，黃天霸等及一切人衆，保着御馬，押解</tspan><tspan x="90" dy="34">囚車，直望京師進發。在路行程，非止一日。這日</tspan></text>
