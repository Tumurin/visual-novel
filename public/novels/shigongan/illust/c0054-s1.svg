<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說三寇議到江都劫法場，救蓮花院十二寇，因有</tspan><tspan x="90" dy="34">兔死狐悲之故。賀天保見過施忠，打那關家堡同救</tspan></text>
