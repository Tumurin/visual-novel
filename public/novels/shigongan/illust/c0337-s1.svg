<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第337回　妓女無心窩留巨盜　狗兒畏罪首告強徒</text>
<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當下就叫人擺下酒來，金玉姑、小紅、小寶陪着蔡</tspan><tspan x="90" dy="34">天化，四人同飲，說不盡那般快樂。不表天化飲酒</tspan></text>
