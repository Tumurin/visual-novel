<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第217回　吊打欽差吳成泄恨　審問奸細薛鳳誆言</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">我與你今晚去走一遭，倘然大人在內，就將他救了</tspan><tspan x="90" dy="34">出來，豈不是一件天大的功勞嗎？你我臉上多少光</tspan></text>
