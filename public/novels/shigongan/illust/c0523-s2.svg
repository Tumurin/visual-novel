<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第523回　飛雲子初次識施公　衆英雄更番戰王朗</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一宿無話，次日黃天霸與賀人傑早領着桂蘭、賽花</tspan><tspan x="90" dy="34">進城而去。他四人本在店中養病，昨晚中軍傳出信</tspan></text>
