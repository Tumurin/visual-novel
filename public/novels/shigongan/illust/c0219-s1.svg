<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第219回　黃天霸初探薛家窩　甘教師鏢打笑面虎</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只見來的是兩個巡丁，一個拿着鋼叉，提了燈籠，</tspan><tspan x="90" dy="34">一個手內提着燈籠、梆鑼，腰挎佩刀，一路講說而</tspan></text>
