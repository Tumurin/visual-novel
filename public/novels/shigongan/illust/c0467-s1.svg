<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">智明聽他言語，便將前後的話，以及飛雲子盜取夜</tspan><tspan x="90" dy="34">光杯，現往別處，王朗不能來的話，前後說了一遍</tspan></text>
