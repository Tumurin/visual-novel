<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日一早，守備吳邦幹，督同合營兵丁，早到</tspan><tspan x="90" dy="34">署堂伺候。一會子，施公升堂，各官環列左右，兵</tspan></text>
