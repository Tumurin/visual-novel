<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且言揚州、江都遠近，有四名響馬，稱爲南方四霸</tspan><tspan x="90" dy="34">，個個武藝精通。黃天霸改名施忠，手使金鏢三支</tspan></text>
