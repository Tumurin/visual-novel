<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公一看，不覺大驚失色，立刻將黃天霸等傳進，</tspan><tspan x="90" dy="34">道：“方纔桃源縣知縣胡維世申文前來，說是八月</tspan></text>
