<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第281回　毛如虎醉後被擒　黃天霸急中誘敵</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">黃天霸與二李便到各處搜尋夥伴。剛轉到花廳後面</tspan><tspan x="90" dy="34">，卻巧遇着何路通。天霸三人，去提畢超、於亮。</tspan></text>
