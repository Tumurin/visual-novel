<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第295回　餘成龍誤留賀人傑　施賢臣獨遣李公然</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">賀人傑道：“後輩今年才交一十三歲。只因圖報父</tspan><tspan x="90" dy="34">仇，不遠千里而來，竭誠投效，望助我一臂之力！</tspan></text>
