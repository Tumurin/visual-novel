<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公一聽，哈哈大笑，傳劉永問話。青衣忙到堂口</tspan><tspan x="90" dy="34">，叫：“劉永上堂，與你妻對詞。”劉永一聽，遂</tspan></text>
