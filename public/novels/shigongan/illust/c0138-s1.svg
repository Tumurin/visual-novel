<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第138回　拿惡奴朱亮獻功　赴市曹囚徒梟首</text>
<text x="90" y="513" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">州官回明賢臣，賢臣叫人用冷水把惡奴噴醒。不多</tspan><tspan x="90" dy="34">時喬三蘇醒，翻身坐在下面，心內糊塗，冷呆呆往</tspan></text>
