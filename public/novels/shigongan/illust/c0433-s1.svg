<text x="90" y="120" font-family="serif" font-size="54" fill="#222">施公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第433回　口占雀屏允稱快婿　夢聯鴛枕竟遂良緣</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">於是清音就唱起來。諸親友傳杯弄盞，互相痛飲。</tspan><tspan x="90" dy="34">酒至半酣，大家皆喫得高興。如何大鬧洞房，且看</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
