<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">看官，施老爺先前只打量他是看出招牌上的破綻，</tspan><tspan x="90" dy="34">再不想他是皇糧莊兒的至親，被這人早泄了底，說</tspan></text>
