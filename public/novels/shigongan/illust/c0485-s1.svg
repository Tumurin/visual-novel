<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第485回　陷深坑險擒小將　中火彈急煞佳人</text>
<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蔣責哪裏肯舍？一聲吆喝，所有的嘍兵，圍繞上來</tspan><tspan x="90" dy="34">。殷賽花見救了殷強，也就放膽寬心，與朱世雄廝</tspan></text>
