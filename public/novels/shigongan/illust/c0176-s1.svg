<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說天霸久聞王子勇猛無比，講動手未必能服他，</tspan><tspan x="90" dy="34">心想要使穩當計。他來至王爺面前雙膝跪倒，口尊</tspan></text>
