<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第524回　臨大敵埋伏齊開　得御杯英雄出色</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說一撮毛見長蛇頭機關撥動不開，知是埋伏破去</tspan><tspan x="90" dy="34">，一聲叱吒，拚力上前，那柄刀緊對君召與褚標砍</tspan></text>
