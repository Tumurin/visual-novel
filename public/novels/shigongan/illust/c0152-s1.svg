<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第152回　金大力棍掃衆惡棍　黃天霸鏢傷六和尚</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金大力不亞瘋魔之虎，一條棍橫打豎掃，指東打西</tspan><tspan x="90" dy="34">，如水底蛟龍一般。忽見短辮子馬上“哎喲”一聲</tspan></text>
