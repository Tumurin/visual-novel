<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">三人計議已定，隨即將衆人請到聚義廳上，對着飛</tspan><tspan x="90" dy="34">雲子道：“今晚黃天霸必然上山，三哥乃齊星樓之</tspan></text>
