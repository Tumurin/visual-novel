<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第383回　雙飛燕敗走桃花庵　老褚標夜宿松林甸</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">轉過月亮門，早看見他三人在左首那方大院落內廝</tspan><tspan x="90" dy="34">殺，正是殺得難解難分，不分勝負。褚標飛舞朴刀</tspan></text>
