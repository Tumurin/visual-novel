<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第325回　賀人傑巧計敗賽花　郝素玉軟錘打殷勇</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說黃天霸等人到了西山嘴，一齊攻打寨柵，但見</tspan><tspan x="90" dy="34">殷剛一人督率莊丁，死守住寨柵。正在危急之際，</tspan></text>
