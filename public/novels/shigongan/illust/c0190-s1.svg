<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說時遲，那時快，此人早已跳將過來，一手便從壁</tspan><tspan x="90" dy="34">上抽刀，望着吳成便砍。這吳成這一刀砍了空，情</tspan></text>
