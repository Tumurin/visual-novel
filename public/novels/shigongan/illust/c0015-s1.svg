<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說縣裏施食臺上僧尼之事。九黃舒展喉嚨，聲音</tspan><tspan x="90" dy="34">響亮，吐字真切。臺下僧配法器，雖然配着法器，</tspan></text>
