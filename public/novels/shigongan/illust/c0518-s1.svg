<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當時四下圍了上來，只是不敢動手，命一個頭目匆</tspan><tspan x="90" dy="34">匆的去飛報上山。隔了一會，只見一人，單身舞動</tspan></text>
