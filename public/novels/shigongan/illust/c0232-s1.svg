<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第232回　賽姜維逃出望山堂　黃天霸三進薛家窩</text>
<text x="90" y="562" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">薛龍、薛虎、薛彪、薛豹一齊都到。鄧虎一人，怎</tspan><tspan x="90" dy="34">好抵敵？正在心慌，只聽得一聲喊，跳出許多好漢</tspan></text>
