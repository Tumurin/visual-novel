<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第245回　防裏防路通遭袖箭　急中急天霸發金鏢</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時何路通也就追到，只見前面兩人，雙刀並舉，</tspan><tspan x="90" dy="34">殺得難解難分。何路通舉起拐來，當頭便擊。謝豹</tspan></text>
