<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第86回　兇僧搶少婦　鎖拿李太歲</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說兵丁登時帶進老者、少婦。僧人跪倒下面。兵</tspan><tspan x="90" dy="34">丁閃在一旁。林公座上打量已畢，向僧人大喝道：</tspan></text>
