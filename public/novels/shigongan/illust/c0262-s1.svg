<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第262回　黃天霸辭別鳳凰嶺　金大力怒打菊花莊</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公應允，吩咐小心要緊。二人答應，挨至日落，</tspan><tspan x="90" dy="34">便取了兵器，直往菊花莊而來。二人沿途商議妥當</tspan></text>
