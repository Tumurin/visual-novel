<text x="90" y="120" font-family="serif" font-size="54" fill="#222">施公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第322回　賽仁貴獨擋護莊河　李公然一打殷家堡</text>
<text x="90" y="559" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李昆大怒，遂拍馬挺槍直殺過來。殷勇也即出了土</tspan><tspan x="90" dy="34">圍，上馬出迎。各莊丁跟隨在後，也是手執器械，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
