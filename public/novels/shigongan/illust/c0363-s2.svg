<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第363回　黃天霸督師徵草寇　李公然故意敗強徒</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">彼此相見，更不打話，一槍一戟，二人便交起手來</tspan><tspan x="90" dy="34">。呂飛熊抖擻精神，恨不能一戰就可結果李昆的性</tspan></text>
