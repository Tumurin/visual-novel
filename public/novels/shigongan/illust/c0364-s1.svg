<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第364回　關小西刀斬呂飛熊　賀人傑鏢打曹如虎</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">關太正在危急，恰巧賀人傑一支軍前來接應，當即</tspan><tspan x="90" dy="34">擺動雙錘，接住廝殺。曹如虎見賀人傑，不覺哈哈</tspan></text>
