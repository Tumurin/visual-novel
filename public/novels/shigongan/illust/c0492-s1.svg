<text x="90" y="120" font-family="serif" font-size="54" fill="#222">施公案</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第492回　投王朗巧遇舊賓朋　見黃成喜分佳飲食</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">賀人傑不知分量，初次與黃天霸前去，受了重傷；</tspan><tspan x="90" dy="34">二次與殷家的兄弟又去，幾乎送了性命。現在聽說</tspan></text>
