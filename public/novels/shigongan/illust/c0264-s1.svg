<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第264回　李公然仗義釋其鸞　張桂蘭有心結素玉</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公見問，便將郝其鸞如何行劫，關小西如何大戰</tspan><tspan x="90" dy="34">郝素玉，何路通如何偵探菊花莊，後來二人有病起</tspan></text>
