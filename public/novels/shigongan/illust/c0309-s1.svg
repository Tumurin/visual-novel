<text x="90" y="521" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說褚標追至水龍窩，認明寨門，便不進去。即向</tspan><tspan x="90" dy="34">水龍窩左右前後，看了一會。又在左右探明瞭暗路</tspan></text>
