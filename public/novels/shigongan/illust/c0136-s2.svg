<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不言天霸、小西另有妙計捉拿喬三。單言德州州官</tspan><tspan x="90" dy="34">，他已經看明施公的字柬，一同衆官送賢臣出監斬</tspan></text>
