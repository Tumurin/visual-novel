<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第511回　萬君召痛毆店主　託天王殺害客商</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時那許多小二，見店主如此喫苦，早已跑了乾淨</tspan><tspan x="90" dy="34">，怕君召遷怒於他。店主喊了幾聲，只是無人答應</tspan></text>
