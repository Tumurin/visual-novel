<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第193回　黃天霸鏢打方世傑　李公然盜藥救自身</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天霸等三人見了發怔。隨後他打回三彈，公然分明</tspan><tspan x="90" dy="34">躲過，忽然“喲呀”一聲，躺倒在地。方世傑舉刀</tspan></text>
