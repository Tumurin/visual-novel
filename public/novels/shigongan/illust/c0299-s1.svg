<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說人傑既將印信取回，火燒了凌虛樓，同黃天霸</tspan><tspan x="90" dy="34">等七人，尋了兩間空屋，在那裏歇息。話分兩頭，</tspan></text>
