<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第37回　賢臣入虎穴　吊打問口話</text>
<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">好漢滿臉含笑，真乃三生有幸，都拉拉手。隨見他</tspan><tspan x="90" dy="34">們已將施公放在桌上，天保一旁站立。施忠與衆人</tspan></text>
