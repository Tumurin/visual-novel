<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日天明，朱光祖起來，梳洗已畢，與萬君召同用</tspan><tspan x="90" dy="34">過早點，就辭了君召，望東安而去。出得門來，心</tspan></text>
