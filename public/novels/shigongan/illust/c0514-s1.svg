<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素玉尚未開言，忽聽樹聲響動，一柄錘頭向馬頭打</tspan><tspan x="90" dy="34">來。桂蘭說聲：“不好！”趕將馬頭一領，向左一</tspan></text>
