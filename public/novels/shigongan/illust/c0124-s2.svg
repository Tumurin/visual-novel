<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裏衆寇如入無人之境，來到米堆跟前。那二十名</tspan><tspan x="90" dy="34">頭目，二百小卒，趕着車輛，緊跟進來。衆人一齊</tspan></text>
