<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽見一人聽見爲臣哼了一聲，他把衆人復又叫出殿</tspan><tspan x="90" dy="34">外，他們嘰嘰喳喳不知說些什麼，忽一聲一擁齊入</tspan></text>
