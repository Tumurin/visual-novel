<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第277回　施賢臣閒話論贓官　黃天霸賣拳逢惡僕</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日，黃天霸、計全二人，便帶了槍棒，出了</tspan><tspan x="90" dy="34">店門，往都天廟而去。一會子已到，二人撿了一處</tspan></text>
