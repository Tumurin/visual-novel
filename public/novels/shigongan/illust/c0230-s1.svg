<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第230回　施欽差將計就計　崔中軍調取三軍</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說三人走到市上，正是順隆店門首。王三一見彷</tspan><tspan x="90" dy="34">彿此地來過，只是一時想不起甚麼地名，心裏犯疑</tspan></text>
