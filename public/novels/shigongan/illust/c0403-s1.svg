<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時雙飛燕手中金鏢，腿着倭刀，已有兩處受傷，</tspan><tspan x="90" dy="34">若論別人，早已不能動，他還在那裏想掙扎，仍然</tspan></text>
