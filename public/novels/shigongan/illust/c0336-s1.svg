<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鬥了有一個時辰，不但拿他不住，且未曾傷他分毫</tspan><tspan x="90" dy="34">。此時卻惱了關小西，大喝一聲。舞動折鐵倭刀，</tspan></text>
