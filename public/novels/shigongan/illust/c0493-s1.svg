<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了大堂外面，但見那人一身皁衣，頭上紮了個青</tspan><tspan x="90" dy="34">布巾，當中一個大紅絨球，站立在院落中間。見李</tspan></text>
