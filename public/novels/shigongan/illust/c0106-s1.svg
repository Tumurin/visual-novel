<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那驢到關廂，驢夫接去。主僕進了飯店，喫茶洗臉</tspan><tspan x="90" dy="34">畢，喫些東西，會了錢。小西扛起行李出鋪，越過</tspan></text>
