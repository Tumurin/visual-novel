<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第270回　淫女狠心冤魂不散　姦夫毒手弱女何辜</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">他哪裏肯依？小婦人也去求他，他也不睬。復又撕</tspan><tspan x="90" dy="34">了塊布，將丈夫嘴塞住，就從身上掏出一根釘來。</tspan></text>
