<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第294回　餘成龍激走褚標　賀人傑智誘任勇</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">走了半日，已到嶺上，便望寨柵前門行去。卻好今</tspan><tspan x="90" dy="34">日是任勇巡哨，剛至柵門，猛見山下走上一個年幼</tspan></text>
