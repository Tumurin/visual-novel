<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第272回　吉日良辰小西入贅　佳餚美酒計全鬧房</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不一會已至，郝其鸞早迎出來。關小西即便下轎，</tspan><tspan x="90" dy="34">到了廳上，先行見禮，然後坐下。計全、李昆相陪</tspan></text>
