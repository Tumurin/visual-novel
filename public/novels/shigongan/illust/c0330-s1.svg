<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第330回　施賢臣聚議訪淫徒　賀人傑馳歸見老母</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再說賀人傑由淮安起身，早行夜宿，在路上非止一</tspan><tspan x="90" dy="34">日。這日已到家中，見着他母親梁氏。在賀人傑是</tspan></text>
