<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第227回　神彈子有心打薛鳳　黃天霸無意中吳成</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只有那笑面虎薛鳳空閒，提着雙鋒劍東斬西劈，忽</tspan><tspan x="90" dy="34">見天霸揹着一人，從假山上躍上屋去，明知把不全</tspan></text>
