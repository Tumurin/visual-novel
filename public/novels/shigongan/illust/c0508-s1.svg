<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第508回　臨危地趙五救人傑　道姓名天霸遇雲鶴</text>
<text x="90" y="516" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天保見他緊緊追來，心下大喜，順手撥動機關，前</tspan><tspan x="90" dy="34">面早露出個門戶，身軀一轉走入進去。人傑也不分</tspan></text>
