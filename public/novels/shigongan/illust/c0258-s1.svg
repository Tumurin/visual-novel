<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">單說施公見天霸去後，過兩日卻起身前往淮安。行</tspan><tspan x="90" dy="34">抵宿遷縣境菊花莊口，忽見前面土崗子上衝下一陣</tspan></text>
