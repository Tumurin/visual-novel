<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說靈官爺自縱金光，暗回龍棚，等候衆神將怪物</tspan><tspan x="90" dy="34">拿到駕前，好交法旨。遲了一刻不見動靜。靈官爺</tspan></text>
