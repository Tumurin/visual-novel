<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說天霸將普清背膊砍下一段，邁前一看，仍恐普</tspan><tspan x="90" dy="34">清爬起，又將他右手剁下，然後跳出房來，擒一枝</tspan></text>
