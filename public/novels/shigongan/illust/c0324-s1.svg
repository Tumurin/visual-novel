<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第324回　何路通一探護莊河　黃天霸二打殷家堡</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">何路通急急的跑了回來，回至營中，說明此事。黃</tspan><tspan x="90" dy="34">天霸等頗爲憂悶。當即傳令五更造飯，黎明出戰。</tspan></text>
