<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">陸老幺見廟已焚燬，兩個山頭又被官軍得了，哪裏</tspan><tspan x="90" dy="34">還敢戀戰，恨不能插翅飛去，逃得性命，猶如昇天</tspan></text>
