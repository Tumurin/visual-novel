<text x="90" y="568" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">走到跟前，舉刀望着李昆就砍。若說七侯中這一鏢</tspan><tspan x="90" dy="34">，究竟不是中的要害的處，還可抵敵，只苦的夾在</tspan></text>
