<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第207回　陳知縣連夜徵兵　施總漕安排拿賊</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說施大人打發陳景隆動身之後，就與衆位豪傑聚</tspan><tspan x="90" dy="34">談。施大人吩咐擺上豐盛酒席，叫衆位兄弟坐下。</tspan></text>
