<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第388回　爭勝負竇耳墩定期　決輸贏黃天霸討戰</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">黃天霸安歇一夜。次日一早，即便起身，飽餐已畢</tspan><tspan x="90" dy="34">，便約朱光祖等，一齊前去。走了一會。已到連環</tspan></text>
