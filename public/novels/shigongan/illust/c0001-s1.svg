<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第1回　胡秀才告狀鳴冤　施賢臣得夢訪案</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">登時到了門首，看一看清門淨戶，並不辦會。二人</tspan><tspan x="90" dy="34">立了一回，見廟中角門內，走出兩個小沙彌來。留</tspan></text>
