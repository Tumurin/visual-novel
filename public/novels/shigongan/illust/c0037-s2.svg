<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">義士想罷，連忙牽馬到店拴上，就將酒食煎炒喫盡</tspan><tspan x="90" dy="34">。天氣不早，腰帶利刃，起身出店，到關家堡打探</tspan></text>
