<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說賀人傑從窗外跳進，執定單刀，對準費德功便</tspan><tspan x="90" dy="34">砍。只聽費德功“呵呀”一聲，將一張椅子，拋在</tspan></text>
