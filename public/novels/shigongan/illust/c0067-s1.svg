<text x="90" y="510" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">施公上坐。衆寇兩邊站立。賢臣眼望施忠、王棟、</tspan><tspan x="90" dy="34">王梁說話。叫聲：“三位好漢，救我之恩，何以答</tspan></text>
