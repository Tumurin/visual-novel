<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說寶玉從瀟湘館出來，連忙問秋紋道：“老爺叫</tspan><tspan x="90" dy="34">我作什么？"秋紋笑道：“沒有叫，襲人姐姐叫我</tspan></text>
