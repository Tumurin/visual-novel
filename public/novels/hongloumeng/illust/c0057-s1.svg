<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十五回　　辱親女愚妾爭閒气　欺幼主刁奴蓄險心</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說元宵已過， 只因當今以孝治天下，目下宮中</tspan><tspan x="90" dy="34">有一位太妃欠安，故各嬪妃皆為之減膳謝妝，不獨</tspan></text>
