<text x="90" y="120" font-family="serif" font-size="54" fill="#222">紅樓夢</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回　 慧紫鵑情辭試忙玉　慈姨媽愛語慰痴顰</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說寶玉听王夫人喚他， 忙至前邊來，原來是王</tspan><tspan x="90" dy="34">夫人要帶他拜甄夫人去．寶玉自是歡喜，忙去換衣</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
