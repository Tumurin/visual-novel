<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1000" cy="195" r="53" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,447 L0,447 L166,359 L418,375 L616,320 L778,351 L1002,329 L1200,321 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,505 L0,505 L240,337 L449,339 L613,430 L754,364 L916,456 L1133,443 L1200,475 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,593 L0,593 L200,481 L410,423 L588,464 L740,386 L953,492 L1158,474 L1200,495 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
