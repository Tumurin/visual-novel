<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說賈璉拿了那塊假玉忿忿走出， 到了書房．那</tspan><tspan x="90" dy="34">個人看見賈璉的气色不好，心里先發了虛了，連忙</tspan></text>
