<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說馮紫英去后，賈政叫門上人來吩咐道：“今儿</tspan><tspan x="90" dy="34">臨安伯那里來請吃酒，知道是什么事？"門上的人</tspan></text>
