<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回　　　博庭歡寶玉贊孤儿　正家法賈珍鞭悍仆</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說惜春正在那里揣摩棋譜， 忽听院內有人叫彩</tspan><tspan x="90" dy="34">屏，不是別人卻是鴛鴦的聲儿．彩屏出去，同著鴛</tspan></text>
