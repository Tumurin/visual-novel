<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一零四回　　醉金剛小鰍生大浪　痴公子余痛触前情 話說賈雨村剛欲過渡，</text>
<text x="90" y="581" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">見有人飛奔而來，跑到跟前，口稱：“老爺，方才</tspan><tspan x="90" dy="34">進的那廟火起了！ "雨村回首看時，只見烈炎燒</tspan></text>
