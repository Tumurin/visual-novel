<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一零一回　　大觀園月夜感幽魂　散花寺神簽惊异兆</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說鳳姐回至房中， 見賈璉尚未回來，便分派那</tspan><tspan x="90" dy="34">管辦探春行裝奩事的一干人．那天已有黃昏以后，</tspan></text>
