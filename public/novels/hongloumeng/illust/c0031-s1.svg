<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回　 寶釵借扇机帶雙敲　齡官划薔痴及局外</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一句沒說完，只听喊道：“好了！"寶林二人不防</tspan><tspan x="90" dy="34">，都唬了一跳，回頭看時，只見鳳姐儿跳了進來，</tspan></text>
