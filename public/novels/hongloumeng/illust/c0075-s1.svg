<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十三回　　痴丫頭誤拾繡春囊　懦小姐不問累金鳳</text>
<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說那趙姨娘和賈政說話，忽听外面一聲響，不知</tspan><tspan x="90" dy="34">何物．忙問時，原來是外間窗□不曾扣好，塌了屈</tspan></text>
