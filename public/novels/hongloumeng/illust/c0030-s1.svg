<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說寶玉正自發怔，不想黛玉將手帕子甩了來，正</tspan><tspan x="90" dy="34">碰在眼睛上，倒唬了一跳，問是誰． 林黛玉搖著</tspan></text>
