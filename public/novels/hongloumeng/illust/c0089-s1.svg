<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回　　　感深秋撫琴悲往事　坐禪寂走火入邪魔</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">失意人逢失意事，新啼痕間舊啼痕．紫鵑見了這樣</tspan><tspan x="90" dy="34">，知是他触物傷情，感怀舊事，料道勸也無益，只</tspan></text>
