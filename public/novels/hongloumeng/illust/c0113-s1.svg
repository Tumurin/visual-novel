<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一一回　　 鴛鴦女殉主登太虛　狗彘奴欺天招伙盜</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說鳳姐听了小丫頭的話，又气又急又傷心，不覺</tspan><tspan x="90" dy="34">吐了一口血，便昏暈過去，坐在地下．平儿急來靠</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
