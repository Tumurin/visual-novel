<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一一五回　　 惑偏私惜春矢素志　證同類寶玉失相知</text>
<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">寶玉一溜煙回到自己房中， 寶釵問了知道叫他作</tspan><tspan x="90" dy="34">文章，倒也喜歡，惟有寶玉不愿意， 也不敢怠慢</tspan></text>
