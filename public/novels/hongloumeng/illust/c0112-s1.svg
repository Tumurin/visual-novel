<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說賈母坐起說道：“我到你們家已經六十多年了</tspan><tspan x="90" dy="34">．從年輕的時候到老來，福也享盡了．自你們老爺</tspan></text>
