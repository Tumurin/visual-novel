<text x="90" y="570" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說薛姨媽听了薛蝌的來書，因叫進小廝問道：“</tspan><tspan x="90" dy="34">你听見你大爺說，到底是怎么就把人打死了呢？ </tspan></text>
