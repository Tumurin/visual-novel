<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十一回　 撕扇子作千金一笑　因麒麟伏白首雙星　話</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">的鮮血在地，也就冷了半截，想著往日常听人說：</tspan><tspan x="90" dy="34">“少年吐血，年月不保，縱然命長，終是廢人了。</tspan></text>
