<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回　　見土儀顰卿思故里　聞秘事鳳姐訊家童</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">只見寶玉進房來了，黛玉讓坐畢，寶玉見黛玉淚痕</tspan><tspan x="90" dy="34">滿面，便問：“妹妹，又是誰气著你了？"黛玉勉</tspan></text>
