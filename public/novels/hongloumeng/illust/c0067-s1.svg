<text x="90" y="120" font-family="serif" font-size="54" fill="#222">紅樓夢</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十五回　　賈二舍偷娶尤二姨　尤三姐思嫁柳二郎</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這尤三姐松松挽著頭發，大紅襖子半掩半開，露著</tspan><tspan x="90" dy="34">蔥綠抹胸，一痕雪脯．底下綠褲紅鞋， 一對金蓮</tspan></text>
<g transform="translate(1070,545)">
