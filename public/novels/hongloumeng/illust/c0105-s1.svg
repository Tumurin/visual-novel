<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一零三回　　施毒計金桂自焚身　昧真禪雨村空遇舊</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說賈璉到了王夫人那邊， 一一的說了．次日到</tspan><tspan x="90" dy="34">了部里打點停妥，回來又到王夫人那邊，將打點吏</tspan></text>
