<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十七回　 林黛玉焚稿斷痴情　薛寶釵出閨成大禮</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說黛玉到瀟湘館門口， 紫鵑說了一句話，更動</tspan><tspan x="90" dy="34">了心，一時吐出血來，几乎暈倒．虧了還同著秋紋</tspan></text>
