<text x="90" y="120" font-family="serif" font-size="54" fill="#222">紅樓夢</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回　呆霸王調情遭苦打　冷郎君懼禍走他鄉</text>
<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說王夫人听見邢夫人來了， 連忙迎了出去．邢</tspan><tspan x="90" dy="34">夫人猶不知賈母已知鴛鴦之事，正還要來打听信息</tspan></text>
