<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那薛蟠三杯下肚，不覺忘了情，拉著云儿的手笑道</tspan><tspan x="90" dy="34">：“你把那梯己新樣儿的曲子唱個我听，我吃一壇</tspan></text>
