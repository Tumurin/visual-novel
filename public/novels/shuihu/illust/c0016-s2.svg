<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六回　花和尚單打二龍山　青面獸雙奪寶珠寺</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">府尹看罷大驚，隨即便喚緝捕人等。只見階下一人</tspan><tspan x="90" dy="34">聲喏，立在簾前。太守道：「你是甚人？」那人稟</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
