<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十四回　高太尉大興三路兵　呼延灼擺佈連環馬</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說宋江次日把軍馬分作五隊在前，後軍十將簇擁</tspan><tspan x="90" dy="34">；兩路伏兵分於左右。秦明當先，搦呼延灼出馬交</tspan></text>
