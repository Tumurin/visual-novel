<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回　林沖水寨大併火　晁蓋梁山小奪泊</text>
<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說晁蓋，公孫勝，自從把火燒了莊院，帶同十數</tspan><tspan x="90" dy="34">個莊客來到石碣村，半路上撞見三阮弟兄各執器械</tspan></text>
<g transform="translate(1070,545)">
