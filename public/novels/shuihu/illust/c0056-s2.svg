<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　徐寧教使鈎鐮鎗　宋江大破連環馬</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">呼延灼正在中軍帳內，聽得探子報知，傳令便差先</tspan><tspan x="90" dy="34">鋒韓滔先來出哨，隨即銷上連環甲馬。呼延灼全身</tspan></text>
