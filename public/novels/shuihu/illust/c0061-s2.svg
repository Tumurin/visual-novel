<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">蔡福回到家裏，卻纔進門，只見一人揭起蘆簾，跟</tspan><tspan x="90" dy="34">將入來，叫一聲：「蔡節級相見。」蔡福看時，但</tspan></text>
