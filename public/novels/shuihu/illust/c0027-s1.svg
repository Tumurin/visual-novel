<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　武松威震平安寨　施恩義奪快活林</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話猶未了，只見一個道：「差撥官人來了！」衆人</tspan><tspan x="90" dy="34">都自散了。武松解了包裹坐在單身房裏。只見那個</tspan></text>
