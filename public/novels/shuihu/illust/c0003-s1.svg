<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三回　趙員外重修文殊院　魯智深大鬧五臺山</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">智深一味地打將出來。大半禪客都躲出廊下來。監</tspan><tspan x="90" dy="34">寺，都寺，不與長老說知，叫起一班職事僧人，點</tspan></text>
