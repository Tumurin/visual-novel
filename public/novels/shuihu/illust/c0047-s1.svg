<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回　一丈青單捉王矮虎　宋公明二打祝家莊</text>
<text x="90" y="555" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這邊秦明和祝龍鬬到十合之上，祝龍如何敵得秦明</tspan><tspan x="90" dy="34">過。莊門裏面那教師欒廷玉，帶了鐵鎚，上馬挺鎗</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
