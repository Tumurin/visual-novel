<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十回　朱貴水亭施號箭　林沖雪夜上梁山</text>
<text x="90" y="597" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">林沖看岸上時，兩邊都是合抱的大樹，半山裏一座</tspan><tspan x="90" dy="34">斷金亭子。再轉將過來，見座大關。關前擺著槍刀</tspan></text>
