    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="868" cy="136" r="60" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,422 L0,422 L152,338 L411,330 L620,367 L849,345 L1080,395 L1200,384 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,514 L0,514 L197,361 L381,471 L547,370 L713,458 L908,452 L1145,416 L1200,334 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,561 L0,561 L241,503 L480,401 L724,393 L970,525 L1168,485 L1200,492 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="468" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十三回　呼延灼月夜賺關勝　宋公明雪天擒索超</text>
<text x="90" y="598" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">關勝喝道：「分明草賊！替何天？替何道？天兵在</tspan><tspan x="90" dy="34">此，還巧言令色！若不下馬受縛，著你粉骨碎身！</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
