<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十回　虔婆醉打唐牛兒　宋江怒殺閻婆惜</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">此時天色尚早，未明，縣門卻纔開。那婆子約莫到</tspan><tspan x="90" dy="34">縣前左側，把宋江一把扭住，發喊叫道：「有殺人</tspan></text>
