<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十四回　高太尉大興三路兵　呼延灼擺佈連環馬</text>
<text x="90" y="531" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說梁山泊遠探報馬逕到大寨報知此事。聚義廳上</tspan><tspan x="90" dy="34">，當中晁蓋，宋江，上首軍師吳用，下首法師公孫</tspan></text>
