<path d="M0,675 L0,451 L0,451 L230,348 L426,378 L659,325 L833,401 L1042,330 L1200,365 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L159,362 L402,338 L656,342 L826,450 L1078,415 L1200,360 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,564 L0,564 L185,401 L390,395 L623,476 L844,484 L1032,398 L1200,433 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
