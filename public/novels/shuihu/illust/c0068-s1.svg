<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋江在陣前看了董平這表人品，一見便喜。又見他</tspan><tspan x="90" dy="34">箭壺中插一面小旗，上寫一聯道：「英雄雙鎗將，</tspan></text>
