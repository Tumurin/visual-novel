<text x="90" y="565" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">毛太公引了二人，入到莊後，方叫莊客把鑰匙來開</tspan><tspan x="90" dy="34">門，百般開不開。毛太公道：「這園多時不曾有人</tspan></text>
