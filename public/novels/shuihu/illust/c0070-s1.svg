<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十回　忠義堂石碣受天文　梁山泊英雄驚惡夢</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說宋公明一打東平，兩打東昌，回歸山寨，計點</tspan><tspan x="90" dy="34">大小頭領，共有一百單八員，心中大喜。遂對衆弟</tspan></text>
