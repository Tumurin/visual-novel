<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十九回　施恩三入死囚牢　武松大鬧飛雲浦</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衆軍漢把武松一步一棍打到廳前，武松叫道：「我</tspan><tspan x="90" dy="34">不是賊，是武松！」張都監看了大怒，變了面皮，</tspan></text>
