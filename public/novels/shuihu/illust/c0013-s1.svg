<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三回　赤髮鬼醉臥靈官殿　晁天王認義東溪村</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說劉唐在房裏尋思道：「我著甚來繇苦惱這遭？</tspan><tspan x="90" dy="34">多虧晁蓋完成，解脫了這件事。只叵耐雷橫那廝平</tspan></text>
