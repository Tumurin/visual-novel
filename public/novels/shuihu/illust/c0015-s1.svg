<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五回　楊志押送金銀擔　吳用智取生辰綱</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正行之間，前面迎著那土岡子。一行十五人奔土岡</tspan><tspan x="90" dy="34">子來，歇下擔仗，十四人都去松林樹下睡倒了。楊</tspan></text>
