<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兩個挽了肐膊，出得茶坊來，上街行得三五十步，</tspan><tspan x="90" dy="34">只見一簇衆人圍住白地上。史進道：「兄長，我們</tspan></text>
