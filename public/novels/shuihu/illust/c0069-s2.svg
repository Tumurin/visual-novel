<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回　沒羽箭飛石打英雄　宋公明棄糧擒壯士</text>
<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋江陣上索超望見，輪動大斧，便來解救。對陣龔</tspan><tspan x="90" dy="34">旺、丁得孫兩騎馬齊出，截住索超廝殺。張清、董</tspan></text>
<g transform="translate(1070,545)">
