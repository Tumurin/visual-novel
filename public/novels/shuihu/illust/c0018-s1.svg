<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日天明，只見人報道：「林教頭相訪！」吳用便</tspan><tspan x="90" dy="34">對晁蓋道：「這人來相探，中俺計了。」七個人慌</tspan></text>
