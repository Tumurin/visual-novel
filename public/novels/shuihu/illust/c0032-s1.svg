<text x="90" y="540" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說劉知寨坐在廳上，叫解過那來。衆人把宋江簇</tspan><tspan x="90" dy="34">擁在廳前跪下。劉知寨喝道：「你這廝是清風山打</tspan></text>
