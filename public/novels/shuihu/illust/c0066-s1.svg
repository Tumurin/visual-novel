<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回　宋江賞馬步三軍　關勝降水火二將</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正走之間，看見路旁一個酒店，李逵便入去裏，連</tspan><tspan x="90" dy="34">打了三角酒，二斤肉吃了，起身便走。酒保攔住討</tspan></text>
