<circle cx="950" cy="231" r="69" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,406 L0,406 L217,348 L433,399 L579,307 L763,319 L940,310 L1172,356 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,504 L0,504 L218,469 L390,358 L556,473 L719,429 L974,477 L1196,398 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,551 L0,551 L209,471 L380,453 L550,471 L725,488 L906,460 L1156,472 L1200,423 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
