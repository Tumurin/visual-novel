<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="775" cy="175" r="51" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,449 L0,449 L175,390 L434,328 L661,347 L867,365 L1018,343 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,480 L0,480 L160,427 L379,385 L550,449 L805,451 L1024,333 L1183,360 L1200,465 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,608 L0,608 L208,448 L434,523 L601,439 L765,463 L1001,505 L1200,418 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="400" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十七回　武松威震平安寨　施恩義奪快活林</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那施恩叉手不離方寸，才說出這件事來。有分教武</tspan><tspan x="90" dy="34">松：顯出那殺人的手段，重施這打虎的威風。正是</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>