<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十三回　入雲龍鬬法破高廉　黑旋風下井救柴進</text>
<text x="90" y="533" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">雷橫提了首級，都下山來，先使人去飛報主帥，宋</tspan><tspan x="90" dy="34">江已知殺了高廉，收軍進高唐州城內，先傳下將令</tspan></text>
