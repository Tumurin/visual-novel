  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="905" cy="210" r="46" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,437 L0,437 L201,322 L414,375 L560,324 L728,314 L883,362 L1057,399 L1200,352 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,491 L0,491 L234,375 L380,369 L584,457 L747,393 L965,376 L1200,358 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,590 L0,590 L188,531 L328,482 L488,543 L705,404 L959,414 L1189,473 L1200,502 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="437" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十七回　及時雨會神行太保　黑旋風鬥浪裏白條</text>
<text x="90" y="567" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李逵正打哩，一個人在背後劈腰抱住，一個人便來</tspan><tspan x="90" dy="34">幫住手，喝道：「使不得！使不得！」待李逵回頭</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
