<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回　張都監血濺鴛鴦樓　武行者夜走蜈蚣嶺</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">武松聽了，心頭那把無名業火高三千丈，衝破了青</tspan><tspan x="90" dy="34">天；右手持刀，左手叉註：左手右查。開五指，搶</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
