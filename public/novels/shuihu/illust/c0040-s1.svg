<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十回　宋江智取無為軍　張順活捉黃文炳</text>
<text x="90" y="580" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且不說五起人馬登程。節次進發，只隔二十里而行</tspan><tspan x="90" dy="34">。先說第一起、晁蓋、宋江、花榮、戴宗、李逵等</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
