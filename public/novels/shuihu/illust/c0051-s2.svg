<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回　李逵打死殷天賜　柴進失陷高唐州</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至第三日，只見這殷天錫，騎著一匹攛行的馬，將</tspan><tspan x="90" dy="34">引閒漢三二十人，手執彈弓川弩，吹筒氣毬，粘竿</tspan></text>
<g transform="translate(1070,545)">
