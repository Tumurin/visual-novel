<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十八回　潯陽樓宋江吟反詩　梁山泊戴宗傳假信</text>
<text x="90" y="519" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說吳用送了戴宗過渡，自同衆頭領再回大寨筵席</tspan><tspan x="90" dy="34">。正飲酒間，只是吳學究叫聲苦，不知高低。衆頭</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
