<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十回　張都監血濺鴛鴦樓　武行者夜走蜈蚣嶺</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說孟州城裏張都監衙內也有躲得過的，直到五更</tspan><tspan x="90" dy="34">才敢出來。衆人叫起裏面親隨，外面當直的軍牢，</tspan></text>
