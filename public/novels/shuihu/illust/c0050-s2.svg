<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">朱仝隨著柴進直到裏面。朱仝道：「黑旋風那廝如</tspan><tspan x="90" dy="34">何卻敢逕入貴莊躲避？」柴進道：「容覆：小可小</tspan></text>
