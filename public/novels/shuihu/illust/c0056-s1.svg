<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十六回　徐寧教使鈎鐮鎗　宋江大破連環馬</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說李忠知二龍山消息，自引了三百小嘍囉下山策</tspan><tspan x="90" dy="34">應。呼延灼聞知，急領所部軍馬，攔路列陣，舞鞭</tspan></text>
