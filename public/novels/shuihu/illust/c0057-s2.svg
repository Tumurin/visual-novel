<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十七回　三山聚義打青州　衆虎同心歸水泊</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋江道：「賢弟心中有何危厄不決之難，但請盡說</tspan><tspan x="90" dy="34">不妨。便當不避水火，一力與汝相助。賢弟且請起</tspan></text>
