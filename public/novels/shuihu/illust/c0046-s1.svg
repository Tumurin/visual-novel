<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說言未了，只聽得前面喝道，說是「莊上三官人巡</tspan><tspan x="90" dy="34">綽過來！」石秀在壁縫裏張時，看得前面擺著二十</tspan></text>
