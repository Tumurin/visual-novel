<text x="90" y="564" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">衆人再議救孔明之計。吳用道：「只除非教呼延將</tspan><tspan x="90" dy="34">軍賺開城門，唾手可得。——更兼絕了這呼延將軍</tspan></text>
