<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="水滸傳">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="981" cy="205" r="63" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,453 L0,453 L221,407 L415,312 L617,383 L800,354 L945,322 L1145,383 L1200,343 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,512 L0,512 L235,337 L454,357 L645,447 L801,400 L980,377 L1171,476 L1200,374 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,595 L0,595 L183,503 L432,461 L600,537 L815,499 L1069,493 L1200,539 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="418" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十八回　施恩重霸孟州道　武松醉打蔣門神</text>
<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">武松又行不到三四里路，再喫過十來碗酒。此時已</tspan><tspan x="90" dy="34">有午牌時分，天色正熱，卻有些微風。武松酒卻湧</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>