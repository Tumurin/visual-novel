<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回　宋公明夜打曾頭市　盧俊義活捉史文恭</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">段景住備說奪馬一事。宋江聽了，大怒道：「前者</tspan><tspan x="90" dy="34">奪我馬匹，至今不曾報仇。晁天王又遭他射死。今</tspan></text>
