<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十七回　宋公明夜打曾頭市　盧俊義活捉史文恭</text>
<text x="90" y="588" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，曾塗對史文恭計議道：「若不先斬賊首，難</tspan><tspan x="90" dy="34">以追滅。」囑付教師史文恭牢守寨柵。曾塗率領軍</tspan></text>
