<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十八回　吳用賺金鈴弔掛　宋江鬧西嶽華山</text>
<text x="90" y="512" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">宋江謝別了宿太尉，回到少華山上，便與四籌好漢</tspan><tspan x="90" dy="34">商議收拾山寨糧，放火燒了寨柵。一行人等，軍馬</tspan></text>
