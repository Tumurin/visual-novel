<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="水滸傳">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1012" cy="177" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,436 L0,436 L253,375 L413,352 L570,321 L796,389 L967,352 L1156,396 L1200,330 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,480 L0,480 L240,450 L422,395 L639,445 L816,352 L1057,428 L1200,471 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,557 L0,557 L238,525 L458,381 L656,491 L879,413 L1132,552 L1200,397 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="426" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回　病關索大鬧翠屏山　拚命三火燒祝家店</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那婦人只得把和尚二年前如何起意；如何來結拜我</tspan><tspan x="90" dy="34">父做乾爺；做好事日，如何先來下禮；我遞茶與他</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>