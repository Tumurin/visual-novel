<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這李俊聽得是宋公明，便跳過船來，口裏叫道：「</tspan><tspan x="90" dy="34">哥哥驚恐？若是小來得遲了些個，誤了仁兄性命！</tspan></text>
