<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十一回　還道村受三卷天書　宋公明遇九天玄女</text>
<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一時，衆頭領各各上馬，離了還道村口，宋江在馬</tspan><tspan x="90" dy="34">上，以手加額望空頂禮，稱謝神明庇佑之力，容日</tspan></text>
