<path d="M0,675 L0,408 L0,408 L232,350 L438,409 L688,348 L898,306 L1095,408 L1200,404 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,512 L0,512 L140,409 L344,348 L579,435 L773,461 L974,464 L1200,377 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,585 L0,585 L169,515 L347,466 L574,435 L723,534 L941,391 L1114,513 L1200,391 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
