<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十八回　東平府誤陷九紋龍　宋公明義釋雙鎗將</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說東平府程太守聞知宋江起軍馬到了安山鎮駐紮</tspan><tspan x="90" dy="34">，便請本州兵馬都監雙鎗將董平商議軍情重事。正</tspan></text>
