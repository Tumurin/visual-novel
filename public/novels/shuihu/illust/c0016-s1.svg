<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">兄大名。聽得說道師兄在大相國寺裏掛搭，如今何</tspan><tspan x="90" dy="34">故來這裏？」魯智深道：「一言難盡！洒家在大相</tspan></text>
