<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">白秀英道：「官人既是來聽唱，如何不記得帶錢出</tspan><tspan x="90" dy="34">來？」雷橫道：「我賞你三五兩銀子，也不打緊；</tspan></text>
