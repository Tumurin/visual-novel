<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="水滸傳">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="848" cy="211" r="57" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,444 L0,444 L210,322 L351,400 L557,322 L770,349 L964,322 L1165,307 L1200,331 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,494 L0,494 L166,469 L310,364 L479,375 L627,413 L868,427 L1112,384 L1200,471 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,588 L0,588 L254,465 L505,395 L725,387 L923,410 L1106,448 L1200,484 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="469" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回　母夜叉孟州道賣人肉　武都頭十字坡遇張青</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">武松跳將起來，把左腳踏住婦人，提著雙拳，看那</tspan><tspan x="90" dy="34">人時，頭戴青紗凹面巾；身穿白布衫，下面腿絣護</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>