<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回　小霸王醉入銷金帳　花和尚大鬧桃花村</text>
<text x="90" y="549" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">不是魯智深投那個去處，有分教：半日裏送了十餘</tspan><tspan x="90" dy="34">條性命生靈；一把火燒了有名的靈山古跡。直教：</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
