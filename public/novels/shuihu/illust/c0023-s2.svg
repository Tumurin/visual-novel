  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="734" cy="178" r="48" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,449 L0,449 L194,366 L447,365 L700,382 L921,311 L1085,328 L1200,319 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,502 L0,502 L150,424 L343,392 L549,354 L789,461 L1035,386 L1200,425 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,583 L0,583 L176,476 L345,488 L592,529 L802,532 L1054,538 L1200,483 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="456" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">水滸傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回 王婆貪賄說風情 鄆哥不忿鬧茶肆</text>
<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">斷章句，話分兩頭。且說本縣有個小的，年方十五</tspan><tspan x="90" dy="34">六歲，本身姓喬，因爲做軍在鄆州生養的，就取名</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>