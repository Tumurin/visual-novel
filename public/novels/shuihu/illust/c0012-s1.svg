<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十二回　青面獸北京鬥武　急先鋒東郭爭功</text>
<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說當時周謹，楊志兩個勒馬在門旗下，正欲交戰</tspan><tspan x="90" dy="34">交鋒。只見兵馬都監聞達喝道：「且住！」自上廳</tspan></text>
