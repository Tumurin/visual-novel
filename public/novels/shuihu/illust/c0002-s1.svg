<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">史進上梯子問道：「你兩個何故半夜三更來劫我莊</tspan><tspan x="90" dy="34">上？」兩個都頭道：「大郎，你兀自賴哩！見有原</tspan></text>
