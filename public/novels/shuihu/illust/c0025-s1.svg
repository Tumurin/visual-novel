<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說當時何九叔跌倒在地下，衆火家扶住。王婆便</tspan><tspan x="90" dy="34">道：「這是中了惡，快將水來！」噴了兩口，何九</tspan></text>
