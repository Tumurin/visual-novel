<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這回書緊接上回，表的是安公子到了淮安府，安頓</tspan><tspan x="90" dy="34">了家眷行李，便去打聽安太太的公館，急切裡要想</tspan></text>
