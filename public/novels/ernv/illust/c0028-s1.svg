<text x="90" y="583" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且住！姑娘這半日這等亂糟糟的，還是冒失無知呢</tspan><tspan x="90" dy="34">，還是遇事輕喜？都不是。天下作女孩兒的，除了</tspan></text>
