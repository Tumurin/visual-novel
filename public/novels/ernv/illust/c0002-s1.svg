<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這回書緊接前回，講的是那安老爺揀發了河工知縣</tspan><tspan x="90" dy="34">，把外面的公私應酬料理已畢，便在家打點起上路</tspan></text>
