<text x="90" y="578" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">列公，可記得那周後稷廟裡的「緘口金人」背上那</tspan><tspan x="90" dy="34">段《銘》？說道是：「戒之哉！毋多言，多言多敗</tspan></text>
