<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">列公，天下事最妙的是雲端裡看廝殺，你我且置身</tspan><tspan x="90" dy="34">局外，袖手旁觀，看後來這位安水心先生怎的下手</tspan></text>
