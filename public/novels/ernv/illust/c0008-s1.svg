<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這回書說書的先有個交代。列公，你看書中說的不</tspan><tspan x="90" dy="34">知姓名的這個穿紅的女子，不過是個過路兒的人遇</tspan></text>
