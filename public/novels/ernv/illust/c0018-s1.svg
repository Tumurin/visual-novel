<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那時國初時候，大凡旗人家裡都還有幾名家將，與</tspan><tspan x="90" dy="34">如今使僱工家人的不同。那些家將也都會些撂跤打</tspan></text>
