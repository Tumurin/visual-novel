<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十一回 包公智捉白猴精</text>
<text x="90" y="547" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">包拯聞知捉得妖怪，升堂審理，果見一個白猴，火</tspan><tspan x="90" dy="34">眼金睛，縛定不能動。拯道：“此異畜，當即除之</tspan></text>
