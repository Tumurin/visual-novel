<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回 除惡僧理索氏冤</text>
<text x="90" y="544" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">有人來認，即來報我。”勝依教來到寺中，稱叫賣</tspan><tspan x="90" dy="34">僧靴。正值各僧行都閒在舍裏，齊來看買。內一少</tspan></text>
