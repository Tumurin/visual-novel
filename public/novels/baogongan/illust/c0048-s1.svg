<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回 東京判斬趙皇親</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">娘子自忖：“西京只有師家會織，叔叔二郎現在揚</tspan><tspan x="90" dy="34">州未回，此間莫非我丈夫在焉。”即抽身出來看時</tspan></text>
