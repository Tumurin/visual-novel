<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">包公正待細問，不覺醒來，殘燭猶明，起行徘徊之</tspan><tspan x="90" dy="34">間，見窗前遺下新皁靴一隻，包公計上心來。次日</tspan></text>
