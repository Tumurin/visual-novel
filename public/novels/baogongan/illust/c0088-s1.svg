<text x="90" y="520" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">居家將近一年，其妻一日忽見有數十擔而來，只見</tspan><tspan x="90" dy="34">夫主在後。阿周大驚：“昔日原嫁一夫，今安得有</tspan></text>
