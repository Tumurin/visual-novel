<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回 琴童代主人伸冤</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">翁、陳二艄及琴童作證，疑是鬼使神差，一款招承</tspan><tspan x="90" dy="34">明白。便用長枷監於獄中，放回衆僧人。次日拯取</tspan></text>
