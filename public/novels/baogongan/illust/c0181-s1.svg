<text x="90" y="596" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說大田縣高村坡有一峻嶺，名曰枯蹄嶺，上通大</tspan><tspan x="90" dy="34">田，下往九溪。有一販布孤客往鄉收帳，路經其地</tspan></text>
