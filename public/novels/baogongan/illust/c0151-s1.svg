<text x="90" y="529" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說當下那妖怪徑脫身變做施俊模樣，便走歸來。</tspan><tspan x="90" dy="34">何氏正在房中梳妝，聽得丈夫回家，連忙出來看時</tspan></text>
