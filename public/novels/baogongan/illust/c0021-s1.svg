<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">歌罷，又訴曰：“小人銀兩俱編千文字號，大人可</tspan><tspan x="90" dy="34">差人去他牀下搜取，便見明白。”訴訖，乃含淚而</tspan></text>
