<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十二回 港口漁翁</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">時四月盡間，荷花盛開，本處仕女有遊船之樂。忽</tspan><tspan x="90" dy="34">一日琴童與漁翁正出河口賣魚，正遇着陳、翁二艄</tspan></text>
