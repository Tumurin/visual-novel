<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日施從喬來到開封府去，裝做客人，叩龔勝門，</tspan><tspan x="90" dy="34">叫：“宋兄相訪。”勝連忙開門，孫趙二人從腰間</tspan></text>
