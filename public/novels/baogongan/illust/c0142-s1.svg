<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說江州在城有兩個鹽儈，皆慣通客商，延接往來</tspan><tspan x="90" dy="34">之客。一姓鮑名順，一姓江名玉，二人雖是交契，</tspan></text>
