<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說包公守東京之日，治下寧靜，奸宄斂跡，每以</tspan><tspan x="90" dy="34">判斷爲心，案牘不致留滯。皇佑元年正月十五日，</tspan></text>
