<text x="90" y="584" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">半年餘，偶因鄰家冬夜失火，燒至李辛房舍。花羞</tspan><tspan x="90" dy="34">慌忙無計，可憐單衣驚走，無所適從，與李辛各散</tspan></text>
