<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說包公任南直隸巡按時，池州有一老者，年登八</tspan><tspan x="90" dy="34">旬，姓周名德，性極風騷，心甚狡僞。因見族房寡</tspan></text>
