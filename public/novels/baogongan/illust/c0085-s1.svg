<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十五回 決秦衙內之斬罪</text>
<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻有前來的弓兵見打倒獵犬，道與衙內得知。衙內</tspan><tspan x="90" dy="34">大怒，喝令弓兵將包公二人趕捉進衙中見其父。秦</tspan></text>
