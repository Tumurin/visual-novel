<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至三日，四人俱赴廳前跪下。拯大怒道：“趙國禎</tspan><tspan x="90" dy="34">、孫元吉，你這兩賊，全不怕我！黑夜劫財，坑陷</tspan></text>
