<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，世美喚管下驃騎將軍趙伯純來衙，暗囑雲：</tspan><tspan x="90" dy="34">“爾可代我急趕秦氏殺死，追我瑛哥、東妹轉府。</tspan></text>
