<text x="90" y="536" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">本夜，張英睡至二更，謂妻道：“我睡不着，要想</tspan><tspan x="90" dy="34">些酒喫。”莫氏道：“如此便叫婢去暖來。”張英</tspan></text>
