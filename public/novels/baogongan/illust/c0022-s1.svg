<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十二 回鍾馗證元弼絞罪</text>
<text x="90" y="543" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">弼呤罷，眉頭不展，臉帶憂容，悶積數月，無意攻</tspan><tspan x="90" dy="34">書。適有一婢，彼夜持利劍一把，密往其家，只見</tspan></text>
