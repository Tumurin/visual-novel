<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">告爲獲實強姦事：朋黨聚惡，與山居野育者何殊；</tspan><tspan x="90" dy="34">簾幃不飾，比牢餐棧棲者無別。棍惡張逸、李陶，</tspan></text>
