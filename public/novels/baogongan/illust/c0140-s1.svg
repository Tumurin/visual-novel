<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">明年，洪已遷去，包公來按西京。楊氏聞之，重賄</tspan><tspan x="90" dy="34">獄官，得出陳訴。包分根勘其事，拘鄰里問之，皆</tspan></text>
