<text x="90" y="525" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，父女到廳。拯喝道：“老賊重富輕貧，負卻</tspan><tspan x="90" dy="34">前盟，是何道理？”於是令張千喚出鄭國材到廳，</tspan></text>
