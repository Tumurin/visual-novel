    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="816" cy="177" r="46" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,418 L0,418 L251,385 L455,333 L641,368 L828,338 L1009,338 L1200,333 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,484 L0,484 L251,433 L475,375 L615,478 L847,453 L1022,330 L1200,357 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,566 L0,566 L247,446 L400,384 L654,401 L860,400 L1111,421 L1200,510 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="462" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十五回  沈瞻贖子孔方兄能全骨肉  陳淵夢妻正氣女便是神靈</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，至神狴峒，問到封家，傳說進去，跑出兩個</tspan><tspan x="90" dy="34">苗丁，一個領雲北進見，一個便令素臣挑擔後邊去</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>