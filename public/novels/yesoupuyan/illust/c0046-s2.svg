<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回  古廟逢兇蜂螫屠龍之手　盤山遇俠獅降猛虎之威</text>
<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽見前邊火勢大發，燒得那大殿，如火雲樓相似，</tspan><tspan x="90" dy="34">霞光萬道，紫氣千重。十幾個和尚、道人，拖槍拽</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
