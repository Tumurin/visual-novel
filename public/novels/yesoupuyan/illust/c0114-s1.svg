<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十三回  忽顯靈文素臣真符假夢　怕上天熊飛娘死抱生人</text>
<text x="90" y="573" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">飛娘正待上索，忽地背後搶過一人，兩手拉繩，飛</tspan><tspan x="90" dy="34">身而上。飛娘看那人身影，竟是素臣，忙說：“文</tspan></text>
