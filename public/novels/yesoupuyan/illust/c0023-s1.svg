<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十三回  爲朋友熱腸堤上忙追比翼鳥  聽兒童拍手山中急採並頭蓮</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽聽船頭上沸反起來，出艙去看，見幾個差人，與</tspan><tspan x="90" dy="34">船家嚷鬧。又李問故，船家指着說道：“爺沒瞧見</tspan></text>
