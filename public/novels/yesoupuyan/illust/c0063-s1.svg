<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十三回  老虎欺心獻毛鱉　個人饒舌得銀蛇</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">剛收進港，忽然一陣黑雲擁起，遮住日色，風雨大</tspan><tspan x="90" dy="34">作，雷電交加，湘靈、晴霞嚇得面如土色。文虛、</tspan></text>
