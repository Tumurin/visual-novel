<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十三回  奚天使死成歡喜佛　木倭奴生作淨光王</text>
<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文容棺木到家，賽奴、雲氏哭死幾番，長生亦哀號</tspan><tspan x="90" dy="34">擗踊。獨寤生但只垂淚，並不哀痛。雲氏恨罵：“</tspan></text>
