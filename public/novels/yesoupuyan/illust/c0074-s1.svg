<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十四回  所求乎朋友相看儼然　重之以婚煙一言既出</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣看那優童，都只十一二歲，因讚道：“兩兄之</tspan><tspan x="90" dy="34">樂府，固屬奇文；即這幾個優童，亦可謂奇優矣！</tspan></text>
