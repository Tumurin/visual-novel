<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十二回  斷鐵ㄌ雙關密計　開銅鎖方便陰功</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那兩個卻是幻民，系大秦國人，能吞刀、吐火、自</tspan><tspan x="90" dy="34">支解、易牛馬頭、跳丸障眼諸法，由崇明對洋靈龜</tspan></text>
