<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十四回  泰運將開囊括扶桑曰本　疑胎乍脫血凝鐵丐銀兒</text>
<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了次日，已有賽呂、袁作忠、林平仲、劉牧之、</tspan><tspan x="90" dy="34">朱無黨幾處軍報進來，知各軍同日登岸，倭民歡迎</tspan></text>
