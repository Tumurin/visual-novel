<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十六回  古廟逢兇蜂螫屠龍之手　盤山遇俠獅降猛虎之威</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">尹雄望見素臣，倒身便拜。素臣忙去扯時，尹雄連</tspan><tspan x="90" dy="34">拜道：“聞名雷貫，積想魂銷；不意荒山，得邀玉</tspan></text>
