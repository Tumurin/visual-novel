<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十四回  首妾入東宮口中得喜　西江尋老母耳內成驚</text>
<text x="90" y="579" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">奚囊把賽觀音反縛兩手，喝道：“饒你一刀，快起</tspan><tspan x="90" dy="34">來，跟着漢子走罷。好涎臉的孩子，看你戴甚鬼臉</tspan></text>
