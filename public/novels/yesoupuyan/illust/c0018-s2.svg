<text x="90" y="535" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那原差瞪呆了眼睛，那些人都向他打着市語，原差</tspan><tspan x="90" dy="34">都都的說些什麼，只見衆人一齊開道：“就是</tspan></text>
