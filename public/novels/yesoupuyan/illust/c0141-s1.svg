<path d="M0,675 L0,400 L0,400 L161,314 L407,406 L573,362 L780,361 L1036,342 L1192,339 L1200,308 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,524 L0,524 L145,450 L339,348 L580,430 L769,452 L1000,468 L1200,473 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,556 L0,556 L212,466 L422,549 L645,469 L893,435 L1105,560 L1200,469 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="424" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四十回  哭覃吉素臣發病　看餘詩末子封侯</text>
<text x="90" y="554" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金剛寶座，右膝着地，拈花乞食，千靈百異，火燒</tspan><tspan x="90" dy="34">斧削，不留一二，幻妄悉除，禎祥迭至。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>