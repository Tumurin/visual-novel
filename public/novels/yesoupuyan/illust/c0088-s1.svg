    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="782" cy="228" r="47" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,442 L0,442 L163,327 L383,383 L570,339 L757,311 L1014,370 L1160,333 L1200,355 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,482 L0,482 L149,426 L296,336 L495,346 L681,404 L929,378 L1129,342 L1200,379 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,573 L0,573 L164,453 L370,392 L514,478 L720,453 L930,406 L1086,554 L1200,516 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="470" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十七回  五日抱兩王子醫法通神  一旬產四男兒麟祥曠世</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次早，即發扛起身。合城紳士百姓，俱感激按君除</tspan><tspan x="90" dy="34">了大惡，又奏留數百萬銀米置倉賑糶之德，製衣脫</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>