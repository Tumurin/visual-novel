<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回  真才子壓倒假名公　假新娘賺殺真嬌客</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣道：“此詩情見乎辭，閔老愛而延兄，其意顯</tspan><tspan x="90" dy="34">然；怎吾兄反以爲不然？”成之道：“閔老系恩蔭</tspan></text>
