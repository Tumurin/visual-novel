<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四十八回  番公主入門生子　文翰林跨海尋妻</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">至四月初旬，兵已精熟，乃忽獵至賊巢附近，密令</tspan><tspan x="90" dy="34">攻剿，仿素臣四伏破柳州之策，先破河東。仿素臣</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
