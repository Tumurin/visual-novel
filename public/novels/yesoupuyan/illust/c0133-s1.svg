<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十二回  素父忽迷羅剎國　麟兒獨上狀元臺</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">剛到浴室門口，聽見衆人講說，悄悄窺視，一眼瞧</tspan><tspan x="90" dy="34">見奚勤腰間昂然巨物，如船桅豎起，就進來拖拽。</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
