<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十六回  柯知縣平白地放出殺人心餘夫人半青天伸下拿雲手</text>
<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">長卿勃然大怒，洪年又嚇又氣，罵道：“你這班瞎</tspan><tspan x="90" dy="34">眼的狗才，這等可惡，怎敢鎖起俺老爺來？”那鎖</tspan></text>
