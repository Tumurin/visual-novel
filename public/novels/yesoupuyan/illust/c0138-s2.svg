<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十七回  古佛今佛兩窟俱空　君囿臣囿四靈鹹集</text>
<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">文麟統師出關，沿途曉行夜宿，各衛所隨護，各宣</tspan><tspan x="90" dy="34">撫宣慰司辦差。行了六七日，已入內蒙古旗地。蒙</tspan></text>
<g transform="translate(1070,545)">
