<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十五回  誅夜叉大熊戴德　救作忠六義同仇</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">忽聽有呻吟之聲，素臣根問衆熊，衆熊都指着旁邊</tspan><tspan x="90" dy="34">一塊大石板，有一熊便去掀開。素臣近前看時，卻</tspan></text>
