<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十八回  醫怪病青面消磨　受奇榮白衣發達</text>
<text x="90" y="526" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">金相大怒，拍案喝道：“權禹不奏上行，擅動兵馬</tspan><tspan x="90" dy="34">，一大罪也；輕舉挫威，喪師辱國，二大罪也；諱</tspan></text>
