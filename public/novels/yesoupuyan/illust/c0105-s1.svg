<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百零四回  假班師分兵入峽　真救駕匹馬歸朝</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">縣道韋忠射傷大狗，受貳如何不急救護，反殺起岑</tspan><tspan x="90" dy="34">浚來？受貳本系大狗寵童，大狗的寡房妹子二猴，</tspan></text>
