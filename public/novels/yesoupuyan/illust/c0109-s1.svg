<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知不俟明日，是夜四更，金硯即到。太子喚至榻</tspan><tspan x="90" dy="34">前，殷勤慰謝。金硯朝拜過，稟知素臣前：“小的</tspan></text>
