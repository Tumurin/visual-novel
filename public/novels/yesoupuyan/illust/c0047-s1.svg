<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十七回  假談星命裏尋奴　真賣卜詩中遇友</text>
<text x="90" y="577" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣扶起，叩問其故。尹雄道：“義兄鐵丐，不知</tspan><tspan x="90" dy="34">有何要事，入洋緝探，苦留不住，就是劫出愚夫婦</tspan></text>
