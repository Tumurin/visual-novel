<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十二回  扮醫生有心除毒　救病漢無意逢親</text>
<text x="90" y="556" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日早起，德進道：“今日過關，你雖沒貨物，也</tspan><tspan x="90" dy="34">要給他一錢銀子，他看也不看，就放你過去；若少</tspan></text>
