<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">鸞吹等急問何事，任夫人大慟道：“京中有人下來</tspan><tspan x="90" dy="34">，說文先生直言觸怒，綁在午門，候旨處斬，是他</tspan></text>
