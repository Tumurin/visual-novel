<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十八回  主代帝殂代崩暗尊昭烈　前比尹後比旦明頌武侯</text>
<text x="90" y="591" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">紅瑤道：“女兒聽着恩爹妙論，把心花放開，此時</tspan><tspan x="90" dy="34">耳聰目明，精神長髮，竟如沒有昨日之事了！”飛</tspan></text>
