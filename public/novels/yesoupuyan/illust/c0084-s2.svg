<path d="M0,675 L0,452 L0,452 L147,315 L389,378 L630,317 L802,380 L1046,327 L1191,384 L1200,400 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,530 L0,530 L259,386 L482,472 L706,374 L857,415 L1114,416 L1200,340 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,582 L0,582 L162,390 L358,558 L527,447 L725,512 L959,447 L1136,463 L1200,512 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="470" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十三回  憐才撥亞魯賜婚者二十人定計滅屠龍成功在五六日</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣道：“不是你這一殺，那姦夫袋內刀瘡神藥，</tspan><tspan x="90" dy="34">也不到我手裏，令妹額角上的傷，亦不能好得恁速</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>