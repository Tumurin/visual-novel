<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">須臾，天已微明，素臣帶着金硯竟望府前而來，只</tspan><tspan x="90" dy="34">見攔街塞道，俱擁滿百姓。素臣擠將過去，到了府</tspan></text>
