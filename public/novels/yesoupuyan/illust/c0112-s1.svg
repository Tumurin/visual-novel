<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十一回  三萬雄兵不敵鋤荊棘　五千長線可推角股勾弦</text>
<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣因如包提着況大元帥，忙問日京近事。虎臣道</tspan><tspan x="90" dy="34">：“靳直、景王一心篡弒，把洋內齋堂、劉公、竹</tspan></text>
