<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十一回  看壁詞癡人入化　談天性俠女驚叱</text>
<text x="90" y="542" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那女子朗朗而言道：“吾非世人，乃泰山碧霞元君</tspan><tspan x="90" dy="34">位下，靈報司仙使。泰山日觀峯下，有玉面狐狸幻</tspan></text>
