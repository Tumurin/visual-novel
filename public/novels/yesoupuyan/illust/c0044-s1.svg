<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十四回  仿八陣圖黃昏遁甲　破兩門法白晝鏖兵</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣不趕，正待衝出陣去，忽聽炮聲震天，梆子響</tspan><tspan x="90" dy="34">處，千弩俱發，石彈齊飛，素臣舞刀遮隔，叮叮噹</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
