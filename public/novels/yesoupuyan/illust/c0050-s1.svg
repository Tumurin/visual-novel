<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十回  照妖鏡團玉鏡臺　割股心邂逅冰心女</text>
<text x="90" y="574" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣被刑心痛，痛極一驚，忽然直醒轉來，渾身冷</tspan><tspan x="90" dy="34">汗，心頭突突地跳個不住，身子仍在邯鄲道呂翁祠</tspan></text>
