<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十六回  負腹無謀空擬罡風攪海　拍肩有讖果然明鏡中天</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日，刑廳審擬田半千一案，府縣錄家人口供俱到</tspan><tspan x="90" dy="34">。田案，廳擬原中俱枷號兩月，責四十板，追出原</tspan></text>
