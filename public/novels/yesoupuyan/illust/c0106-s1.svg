<path d="M0,675 L0,460 L0,460 L163,329 L387,321 L535,362 L779,334 L1004,345 L1200,307 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,496 L0,496 L202,467 L391,332 L622,445 L849,344 L1083,333 L1200,442 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,570 L0,570 L191,474 L374,475 L551,503 L777,381 L1010,482 L1180,387 L1200,506 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="384" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百零五回  鸞音爲臣子監軍新時宮制  雲妃代尼僧摩頂舊曰恩情</text>
<text x="90" y="514" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣大喜，急趕至太后內殿門首，只聽一片聲傳景</tspan><tspan x="90" dy="34">王令旨，說並太后拿下。門首軍將正待無禮，素臣</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>