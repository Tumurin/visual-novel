<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五回  燈花發荼毗兩個淫僧　虎足從風結識一條好漢</text>
<text x="90" y="511" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這裏素娥把門關上，將條凳頂門擺着，讓鸞吹睡下</tspan><tspan x="90" dy="34">。自己又同石氏談了一會心事。石氏引着到窖中，</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
