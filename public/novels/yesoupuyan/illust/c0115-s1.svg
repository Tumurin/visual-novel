<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">賊船上呵呵大笑道：“若沒那陣怪風，都做了海鬼</tspan><tspan x="90" dy="34">了！怎敢回來送死？”把旗一揮，四散的船，都攢</tspan></text>
