  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="1042" cy="127" r="49" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,401 L0,401 L235,301 L418,402 L638,361 L792,341 L1023,356 L1196,361 L1200,392 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,487 L0,487 L189,333 L440,340 L698,387 L920,365 L1163,470 L1200,376 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,577 L0,577 L165,544 L314,440 L513,536 L741,540 L902,421 L1089,423 L1200,512 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="464" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第五十八回  爲好成空三處衾ブ皆冷落  從天而降一門妻妾小團圓</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">璇姑忽見一個藍面男子，直奔上前，嚇得倒退兩步</tspan><tspan x="90" dy="34">，縮入轎中，心頭突突的跳個不住。那第二乘已抬</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>