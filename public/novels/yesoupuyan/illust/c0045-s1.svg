<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回  虎口行奸贗虎惡於真虎　僧寮放火生僧燒作熟僧</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣急看，卻是匡無外主僕二人奮勇殺入，心中這</tspan><tspan x="90" dy="34">一喜，不覺精神頓長，氣力尤加，拍馬揮刀接應。</tspan></text>
