    <stop offset="0" stop-color="#f7f2e7"/><stop offset="1" stop-color="#e6dcc6"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#sky)"/>
<circle cx="790" cy="169" r="47" fill="#b3402a" opacity="0.75"/>
<path d="M0,675 L0,436 L0,436 L260,410 L518,372 L755,388 L966,331 L1192,304 L1200,405 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,479 L0,479 L244,466 L438,480 L678,393 L915,373 L1170,466 L1200,466 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,607 L0,607 L186,519 L411,506 L556,389 L743,456 L901,398 L1081,531 L1200,501 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
<ellipse cx="600" cy="464" rx="660" ry="60" fill="#f7f2e7" opacity="0.55"/>
<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十八回  陌路種成荊樹喜連今日之枝  深宮賜出夭桃誰識當年之木</text>
<text x="90" y="594" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">水夫人道：“廣西之事，張順等回來已知。京中及</tspan><tspan x="90" dy="34">山東之事，文恩等也約略說過。你把延安之事，說</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
</svg>