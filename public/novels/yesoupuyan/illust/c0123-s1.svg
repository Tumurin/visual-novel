<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百二十二回  姊妹重逢驚智囊宅遠慮　主奴敘舊感鎮國之深恩</text>
<text x="90" y="541" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">正在以心問心，靜觀自得，忽聽一片吶喊之聲，忙</tspan><tspan x="90" dy="34">問文敏。文敏道：“定是世子不知太師爺進園，在</tspan></text>
