<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十二回  以血驗氣大闡陰陽之化因熊及虎廣推禽獸之恩</text>
<text x="90" y="600" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說到那裏，似有羞慚之狀，掩面而泣。素臣亦爲感</tspan><tspan x="90" dy="34">傷，因道：“現在當今第一文人，名叫王鏊，亦是</tspan></text>
