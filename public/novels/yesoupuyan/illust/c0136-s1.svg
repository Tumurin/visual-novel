<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十五回  七年病遇三年艾　一世盲開萬世明</text>
<text x="90" y="569" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一日，文勤、文慎跑進內堂，說：“太師爺立傳沈</tspan><tspan x="90" dy="34">夫人出去診脈。”僕婦傳稟進來，閤家駭異。素娥</tspan></text>
