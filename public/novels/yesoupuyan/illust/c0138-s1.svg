<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百三十七回  古佛今佛兩窟俱空　君囿臣囿四靈鹹集</text>
<text x="90" y="518" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">次日黎明，京營兩翼兵亦到。文麟因知敵人虛實，</tspan><tspan x="90" dy="34">便令雲北、以神趕過前面，與蒙古營相望而居。城</tspan></text>
