<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百十七回  拷貴妃乾清三擋　誅達賴韃靼雙降</text>
<text x="90" y="593" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">初四日，諸事已備，頭營兵二百名到。初五日，治</tspan><tspan x="90" dy="34">酒起行，天生、滿魯都爲前隊，素臣、可汗爲中隊</tspan></text>
