<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百回  奸徒出首害忠臣　義士同心結死友</text>
<text x="90" y="586" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">裘監幾次密稟，特派勇將，統率大兵來剿。正值廣</tspan><tspan x="90" dy="34">西峒苗作亂，殺入內地，連破思恩、慶遠二府，文</tspan></text>
