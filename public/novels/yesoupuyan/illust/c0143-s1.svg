<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百四十二回  馬爲月老侄得嬌妻　虎作冰人叔收美妾</text>
<text x="90" y="517" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那日，文趕虎，緊趕緊走，慢趕慢走，一日一夜</tspan><tspan x="90" dy="34">，至次日早晨，趕有五六百里，在南留智北邊，趕</tspan></text>
