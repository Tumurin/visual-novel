<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第一百零九回  怨鬼捉姦逆藩伏法　青宮驗痣假子歸真</text>
<text x="90" y="562" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到得初更時分，景王忽然嚎叫說，都梁、都昌兩王</tspan><tspan x="90" dy="34">把拶指拶他；看兩手時，十指果然發脹。一會又喊</tspan></text>
<g transform="translate(1070,545)">
