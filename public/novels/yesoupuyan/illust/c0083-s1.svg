<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十二回  斷鐵ㄌ雙關密計　開銅鎖方便陰功</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">二十六日一早，登州有船至島，來替飛娘做三朝，</tspan><tspan x="90" dy="34">來人呈上玉麟書札說：各島並沒有敗下去的船，卻</tspan></text>
