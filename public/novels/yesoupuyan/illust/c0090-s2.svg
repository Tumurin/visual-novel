<path d="M0,675 L0,420 L0,420 L234,328 L413,312 L632,340 L890,340 L1038,312 L1183,331 L1200,382 L1200,675 Z" fill="#2b3440" opacity="0.18"/><path d="M0,675 L0,485 L0,485 L243,471 L471,448 L667,479 L902,478 L1106,405 L1200,342 L1200,675 Z" fill="#2b3440" opacity="0.3"/><path d="M0,675 L0,605 L0,605 L216,490 L436,487 L667,445 L841,411 L1014,493 L1200,460 L1200,675 Z" fill="#2b3440" opacity="0.45"/>
