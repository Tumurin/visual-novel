<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十八回  束矢狂生翻爲座上客　操戈逆弟磕破柩前頭</text>
<text x="90" y="550" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">早是又李從人叢內擠將出來，上堂跪下。任知縣疑</tspan><tspan x="90" dy="34">是來羞駁他，忙道：“本縣知你被誣，已在這裏懲</tspan></text>
