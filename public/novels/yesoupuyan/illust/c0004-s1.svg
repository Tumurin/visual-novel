<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四回  異性結同懷古廟烘布情話絮　邪謀蠱貞女禪堂擲炬禿奴驚</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了天明，素臣打量回寓，安慰鸞吹坐等，出去僱</tspan><tspan x="90" dy="34">船。依舊掇掉了石臼，正在開門，這廟中的一個老</tspan></text>
