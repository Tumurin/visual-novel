<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十九回  男道學遍看花蕊　女狀元獨佔鰲頭</text>
<text x="90" y="557" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">日色方出。十一位姨娘已俱到房，齊向牀前相叫。</tspan><tspan x="90" dy="34">隨來的丫鬟黑壓壓的站滿一房，手中攜着諸般樂器</tspan></text>
