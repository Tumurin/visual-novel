<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十六回  天闕山神猿饒舌　孔雀峒石女發身</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣暗看玉兒，心裏着急。玉兒在身邊取出哥嫂預</tspan><tspan x="90" dy="34">備的一方綠絹，遞與素臣。素臣接過，見絹上斑斑</tspan></text>
<g transform="translate(1070,545)">
