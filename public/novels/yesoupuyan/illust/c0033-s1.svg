<text x="90" y="120" font-family="serif" font-size="54" fill="#222">野叟曝言</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十三回  靳千戶雙賺鵲橋仙　劉大娘三犯江兒水</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">直到這日午飯以後，忽聽門個我聲鼎沸，宅內鑼聲</tspan><tspan x="90" dy="34">震天，不知何事。只見一個丫鬟提着一壺茶，撩在</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
