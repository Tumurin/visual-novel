<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">當駕官奉旨催促，太夫人含淚上轎。趙芮喝令趕開</tspan><tspan x="90" dy="34">衆人，只見兩匹劣馬，潑風也似的趕來，大叫：“</tspan></text>
