<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六十六回  神算定假倭功歸把總　正氣除邪會名託城隍</text>
<text x="90" y="572" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素臣大笑。因問：“初六出會，是何神道？怎樣盛</tspan><tspan x="90" dy="34">法，竟至天下沒有第二？”飛熊道：“這會說來好</tspan></text>
