<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十六卷　李講公窮邸遇俠客</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">房德原是沒主意的人，被老婆這班後話一聳，漸生</tspan><tspan x="90" dy="34">疑惑，沉吟不語。貝氏又道：“總來這恩是報不得</tspan></text>
