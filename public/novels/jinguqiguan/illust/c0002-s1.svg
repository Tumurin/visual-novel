<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二卷　兩縣令競義婚孤女</text>
<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說賈昌在客中，不久回來，不見了月香小姐和那</tspan><tspan x="90" dy="34">養娘。詢知其故，與婆娘大鬧幾場。後來知得鍾離</tspan></text>
