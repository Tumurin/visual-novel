<text x="90" y="571" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說臨安城中有個吳八公子。父親吳嶽見爲福州太</tspan><tspan x="90" dy="34">守。這吳八公子新從父親任上回來，廣有金銀。平</tspan></text>
