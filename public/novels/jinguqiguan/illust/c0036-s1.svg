<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">神宗皇帝見奏，曉得開封府盡獲盜犯，笑道：“果</tspan><tspan x="90" dy="34">然不出小孩子所算。”龍顏大喜，批准奏章，着會</tspan></text>
