<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六卷　蔡小姐忍辱報仇</text>
<text x="90" y="527" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">瑞虹見臺家都殺，獨不害他，料必然來污辱，奔出</tspan><tspan x="90" dy="34">艙門，望江中便跳。陳小四放下斧頭，雙手抱住道</tspan></text>
