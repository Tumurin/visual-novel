<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十三卷　沈小霞相會出師表</text>
<text x="90" y="587" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">看看日沒黃昏，李萬腹中餓極了，看見間壁有個點</tspan><tspan x="90" dy="34">心店兒，不免脫下布衫，抵當幾文錢的火燒來喫。</tspan></text>
