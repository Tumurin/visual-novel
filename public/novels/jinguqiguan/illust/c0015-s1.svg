<text x="90" y="515" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">各處搜到，不見盧楠，料想必在園上，一齊又趕入</tspan><tspan x="90" dy="34">去。盧楠正與四五個賓客，在暖閣上飲酒，小優兩</tspan></text>
