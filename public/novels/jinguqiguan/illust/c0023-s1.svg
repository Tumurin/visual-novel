<text x="90" y="537" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">話說平氏拆開家信，果是丈夫筆跡，寫道：“陳商</tspan><tspan x="90" dy="34">再拜，賢妻平氏見字：別後襄陽遇盜，劫資殺僕。</tspan></text>
