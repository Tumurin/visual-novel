<text x="90" y="523" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">郭七郎身子如在雲霧裏一般，急思衣錦榮歸，擇日</tspan><tspan x="90" dy="34">起身，張多保又設酒餞行。起初這些往來的閒漢、</tspan></text>
