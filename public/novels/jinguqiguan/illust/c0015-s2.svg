<text x="90" y="120" font-family="serif" font-size="54" fill="#222">今古奇觀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十五卷　盧太學詩酒傲王侯</text>
<text x="90" y="545" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">且說知縣那日早衙，投文已過，也不退堂，就要去</tspan><tspan x="90" dy="34">赴酌。因見天色太早，恐酒席未完，吊一起公事來</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
