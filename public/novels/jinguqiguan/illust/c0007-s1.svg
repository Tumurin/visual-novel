<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七卷　賣油郎獨佔花魁</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">從來梳弄的子弟早起時，媽兒進房賀喜，行戶中都</tspan><tspan x="90" dy="34">來稱慶，還要喫幾日喜酒。那子弟多則住一二月，</tspan></text>
