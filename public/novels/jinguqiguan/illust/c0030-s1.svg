<text x="90" y="528" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">員外一日要到莊上收割，因爲小梅有身孕，恐怕女</tspan><tspan x="90" dy="34">婿生嫉妒，女兒有外心，索性把傢俬都託女兒、女</tspan></text>
