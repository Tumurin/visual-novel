<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三卷　滕大尹鬼斷傢俬</text>
<text x="90" y="560" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再過四年，小孩子長成五歲。老子見他伶俐，又忒</tspan><tspan x="90" dy="34">會頑耍，要送他館中上學。取個學名，哥哥叫善繼</tspan></text>
