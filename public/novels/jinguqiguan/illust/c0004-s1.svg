<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">那縣令又奉承刺史，遣人到黃太學家致意。黃太學</tspan><tspan x="90" dy="34">回道：“已經受聘，不敢從命。”縣令再三強求，</tspan></text>
