<text x="90" y="120" font-family="serif" font-size="54" fill="#222">今古奇觀</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第十一卷　吳保安棄家贖友</text>
<text x="90" y="522" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">其時，郭仲翔也被擄去。細奴邏見他丰神不凡，叩</tspan><tspan x="90" dy="34">問之，方知是郭元振之侄，遂給與本洞頭目烏羅部</tspan></text>
