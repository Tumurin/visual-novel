<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第三十五卷　王嬌鸞百年長恨</text>
<text x="90" y="532" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">孫九領書。夜宿曉行，直至吳江延陵橋下，猶恐傳</tspan><tspan x="90" dy="34">遞不的，直候周廷章面送。廷章一見孫九，滿瞼通</tspan></text>
