<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十六回  呂廚子回家學舌 薛素姐沿路趕船</text>
<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素姐在那臺上喫燒酒，舞木棍，口裏胡說白道。只</tspan><tspan x="90" dy="34">等唱完了《魚籃》整戲，又找了一出《十面埋伏》</tspan></text>
