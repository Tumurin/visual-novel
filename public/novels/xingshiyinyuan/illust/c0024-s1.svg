<text x="90" y="534" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">說便是十月初一日謝了土神，辭了場圃，是個莊家</tspan><tspan x="90" dy="34">完備的節候。但這樣滿收的風景，也依不得這個常</tspan></text>
