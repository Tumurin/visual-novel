<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回  不賢婦逆姑毆婿 護短母喫腳遭拳</text>
<text x="90" y="530" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">到了後晌，狄希陳也沒敢往屋裏去睡，在他孃的外</tspan><tspan x="90" dy="34">間裏睡了。到了二更天氣，狄賓梁從睡夢中被一人</tspan></text>
