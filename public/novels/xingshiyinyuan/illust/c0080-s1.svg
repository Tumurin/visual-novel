<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第八十回  童寄姐報冤前世 小珍珠償命今生</text>
<text x="90" y="595" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">一日，將午的時候，寄姐不在面前，童奶奶袖了幾</tspan><tspan x="90" dy="34">個槓子火燒，要從窗縫送進與他，喚了幾聲不見答</tspan></text>
