<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">珍哥道：“老婆們別要強辯！怎麼我的兩個丫頭落</tspan><tspan x="90" dy="34">在你手哩，你大家趕溫面，烙火燒喫，你己我那丫</tspan></text>
