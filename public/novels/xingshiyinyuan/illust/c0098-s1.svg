<text x="90" y="553" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素姐走到中門邊，濃袋道：“外邊的事，姑娘知道</tspan><tspan x="90" dy="34">呀！”素姐道：“我知道外邊甚麼事，你失張倒怪</tspan></text>
