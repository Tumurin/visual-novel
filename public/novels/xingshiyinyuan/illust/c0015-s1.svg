<text x="90" y="548" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">梁生、胡旦藏得這所在甚好，裏邊沒人敢傳將出去</tspan><tspan x="90" dy="34">，外邊又沒人敢尋將進來，倒也是個銅牆鐵壁。爭</tspan></text>
