<text x="90" y="120" font-family="serif" font-size="54" fill="#222">醒世姻緣傳</text>
<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九回  匹婦含冤惟自縊 老鰥報怨狠投詞</text>
<text x="90" y="539" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">天約有辰牌時分，等莊上柴不送到，還不曾做得早</tspan><tspan x="90" dy="34">飯，計氏自己把那頂新轎拆下幾扇，燒鍋做飯，又</tspan></text>
<g transform="translate(1070,545)">
  <rect width="86" height="86" fill="#b3402a" rx="6"/>
  <text x="43" y="40" text-anchor="middle" font-family="serif" font-size="30" fill="#f7f2e7">插畫</text>
  <text x="43" y="72" text-anchor="middle" font-family="serif" font-size="22" fill="#f7f2e7">占位</text>
</g>
