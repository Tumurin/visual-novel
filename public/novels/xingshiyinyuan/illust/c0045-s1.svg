<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十五回  薛素姐酒醉疏防 狄希陳乘機取鼎</text>
<text x="90" y="575" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">素姐夢中醒轉，心裏曉得着了人手，那身子醉的那</tspan><tspan x="90" dy="34">裏動得？狄希陳見他不能扎掙，放心大戰。素姐說</tspan></text>
