<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十九回  馮夷神受符放水 六甲將按部巡堤</text>
<text x="90" y="546" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說那些被水淹死的人總然都是一死，那死的千態</tspan><tspan x="90" dy="34">萬狀，種種不一。呂祖閣那個住持道士張水雲，那</tspan></text>
