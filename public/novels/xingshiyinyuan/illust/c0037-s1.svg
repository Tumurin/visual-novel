<text x="90" y="538" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">誰知那閨女雖也不是那衝鋒陷陣的名將，卻也還見</tspan><tspan x="90" dy="34">過陣。那狄希陳還是一個“齊東的外甥”，沒等披</tspan></text>
