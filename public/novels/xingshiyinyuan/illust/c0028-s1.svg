<text x="90" y="585" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻是玉帝檄召江西南昌府鐵樹宮許旌陽真君放出神</tspan><tspan x="90" dy="34">蛟，瀉那鄰郡南旺、漏澤、範旭、跑突諸泉，協濟</tspan></text>
