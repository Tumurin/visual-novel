<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第二十六回  作孽衆生填惡貫 輕狂物類鑿良心</text>
<text x="90" y="551" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">再其次，就是人家的管家娘子、管家、覓漢、短工</tspan><tspan x="90" dy="34">這四樣人。那管家娘子在那大人家揀那頭一分好菜</tspan></text>
