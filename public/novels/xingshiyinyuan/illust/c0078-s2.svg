<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十八回  陸好善害怕賠錢 寧承古詐財捱打</text>
<text x="90" y="599" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">陸長班家中叫了女廚，預先置了酒度，候素姐寺裏</tspan><tspan x="90" dy="34">回來，要與素姐送行，好打發他明日走路。素姐赴</tspan></text>
