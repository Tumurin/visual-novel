<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十一回  陳哥思妓哭亡師 魏氏出喪作新婦</text>
<text x="90" y="592" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">狄周媳婦說：“這陳哥，怕不的大嫂也管不下他來</tspan><tspan x="90" dy="34">哩。這得一位利害嫂子，象娘管爹似的，才管出個</tspan></text>
