<text x="90" y="563" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">狄希陳催着相於廷行令。相於廷道：“脫不了咱兩</tspan><tspan x="90" dy="34">個人，怎麼行令？咱‘打虎’罷。我說你打，你說</tspan></text>
