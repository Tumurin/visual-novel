<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第四十八回  不賢婦逆姑毆婿 護短母喫腳遭拳</text>
<text x="90" y="590" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">李九強說：“四爺，你要肯拿，這眼皮子底下就有</tspan><tspan x="90" dy="34">一個賣私鹽的都把勢哩。只是四爺你不敢拿他。”</tspan></text>
