<text x="90" y="566" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">卻說梁生、胡旦因有勢要親眷，晁家父子通以貴客</tspan><tspan x="90" dy="34">介賓相待，萬分欽敬。晁老呼梁生的字爲安期，呼</tspan></text>
