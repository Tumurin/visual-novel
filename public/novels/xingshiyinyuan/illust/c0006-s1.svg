<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第六回  小珍哥在寓私奴 晁大舍赴京納粟</text>
<text x="90" y="561" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">晁大舍與爹孃同在船上，走了幾日，到了武城地方</tspan><tspan x="90" dy="34">，祭了祖，焚過了黃，晁大尹方知雍山莊上被人放</tspan></text>
