<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第七十七回  饞小廝爭嘴唆人 風老婆撒極上吊</text>
<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">這素姐能有甚麼涵養，容得這樣的事？暴跳如雷，</tspan><tspan x="90" dy="34">即刻就要進京，算計翻江攪海，大鬧京師，狠命的</tspan></text>
