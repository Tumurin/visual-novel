<text x="90" y="589" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">玉兒開了門，請過狄員外爺兒兩個過來。作了揖，</tspan><tspan x="90" dy="34">童奶奶道：“清早我們爺出門的時節，就分付伺候</tspan></text>
