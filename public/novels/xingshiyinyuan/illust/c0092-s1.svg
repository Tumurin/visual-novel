<text x="90" y="582" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">過了半月，三月十五日，晁夫人三年忌辰，在墳上</tspan><tspan x="90" dy="34">搭棚廠，請僧建脫服道場。也集了無數的親友，都</tspan></text>
