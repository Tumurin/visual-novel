<text x="90" y="180" font-family="serif" font-size="30" fill="#555">第九十九回  郭將軍奉旨賜環 狄經歷回家致仕</text>
<text x="90" y="576" font-family="serif" font-size="24" fill="#444"><tspan x="90" dy="0">烏蒙土官又將失利的塘報，飛馳到了撫院，說梁佐</tspan><tspan x="90" dy="34">的兵馬全師覆沒，盡困在山峪之中；雖不曾殺害，</tspan></text>
