<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="及時雨運動飲料廣告">
<defs>
  <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b3d66"/><stop offset="1" stop-color="#12568f"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#rain)"/>
<g opacity="0.35" stroke="#bcd8ef" stroke-width="6" stroke-linecap="round">
  <line x1="180" y1="60" x2="150" y2="140"/><line x1="340" y1="30" x2="310" y2="110"/>
  <line x1="520" y1="70" x2="490" y2="150"/><line x1="720" y1="40" x2="690" y2="120"/>
  <line x1="900" y1="80" x2="870" y2="160"/><line x1="1060" y1="50" x2="1030" y2="130"/>
</g>
<g transform="translate(520,220)">
  <rect x="30" y="0" width="140" height="300" rx="40" fill="#eaf4fb"/>
  <rect x="30" y="90" width="140" height="170" rx="30" fill="#2fa3e0"/>
  <rect x="55" y="-46" width="90" height="60" rx="14" fill="#bcd8ef"/>
  <path d="M100,120 q34,44 0,84 q-34,-40 0,-84" fill="#eaf4fb" opacity="0.9"/>
</g>
<text x="80" y="130" font-family="serif" font-size="72" font-weight="bold" fill="#eaf4fb">及時雨</text>
<text x="80" y="205" font-family="serif" font-size="34" fill="#bcd8ef">梁山好漢的運動補給飲料</text>
<text x="80" y="255" font-family="serif" font-size="28" fill="#8fb8d8">宋江喝了都說：補水，就要及時</text>
<g transform="translate(80,560)">
  <rect width="260" height="64" rx="32" fill="#2fa3e0"/>
  <text x="130" y="42" text-anchor="middle" font-family="serif" font-size="30" fill="#0b3d66">及時補水</text>
</g>
<text x="1120" y="640" text-anchor="end" font-family="serif" font-size="20" fill="#6d97bb">本頁面為示範廣告</text>
</svg>
