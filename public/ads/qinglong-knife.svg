<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="青龍牌菜刀廣告">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e3b2e"/><stop offset="1" stop-color="#092820"/>
  </linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8ecef"/><stop offset="0.5" stop-color="#aab4bc"/><stop offset="1" stop-color="#dfe5e9"/>
  </linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="950" cy="150" r="240" fill="#14584a" opacity="0.5"/>
<g transform="rotate(-18 600 380)">
  <rect x="330" y="300" width="520" height="200" rx="18" fill="url(#blade)" stroke="#7f8a92" stroke-width="4"/>
  <rect x="850" y="352" width="200" height="52" rx="26" fill="#5a3b22"/>
  <rect x="1030" y="344" width="34" height="68" rx="10" fill="#3c2716"/>
  <circle cx="385" cy="352" r="16" fill="#b3402a"/>
</g>
<text x="80" y="130" font-family="serif" font-size="72" font-weight="bold" fill="#f2c14e">青龍牌菜刀</text>
<text x="80" y="205" font-family="serif" font-size="34" fill="#d8e6df">偃月刀能誅文醜，青龍刀能剁排骨</text>
<text x="80" y="255" font-family="serif" font-size="28" fill="#9fc3b4">過五關，斬六將，切菜剁肉樣樣行</text>
<g transform="translate(80,560)">
  <rect width="260" height="64" rx="32" fill="#f2c14e"/>
  <text x="130" y="42" text-anchor="middle" font-family="serif" font-size="30" fill="#0e3b2e">立即選購</text>
</g>
<text x="1120" y="640" text-anchor="end" font-family="serif" font-size="20" fill="#6f9484">本頁面為示範廣告</text>
</svg>
